rs.","key_symbols":["TEXT_BUILDERS / register(name): registry of text builders by vector type","build_code: the 'code' text (header, doc comments, code or class skeleton)","build_usage: the 'usage' text (callers, test callers, optional commit subjects)","build_parts(chunk, ctx, vec_type): the TextParts (windows) to embed for one chunk and type","build_texts(chunk, ctx, vec_types): whole texts for several types","BuildContext: callers, commits, max_items, code_header, window_chars, window_overlap_lines","Ref: a caller reference (id, qualname, name, path, start_line, is_test, kind)","TextPart: one window's text, part number, part count and relative line offsets","_windows / _even_windows: line windows under a character budget, made as even as possible"],"connects_to":["src/codemem/indexer.py","src/codemem/store.py","src/codemem/schema.py","src/codemem/languages/__init__.py","src/codemem/callgraph.py","src/codemem/config.py"],"component":"texts"},"src/codemem/tokenize.py":{"bytes":2750,"lines":75,"auto_summary":"Code-aware tokenization for BM25.","symbols":[{"kind":"def","name":"split_identifier","line":22,"doc":"`revoke_session` -> [revoke, session]; `getUserById` -> [get, user, by, id]."},{"kind":"def","name":"_split_identifier","line":28,"doc":""},{"kind":"def","name":"_stem","line":36,"doc":""},{"kind":"def","name":"tokenize","line":44,"doc":""},{"kind":"def","name":"to_fts_text","line":60,"doc":""},{"kind":"def","name":"fts_match_query","line":64,"doc":"Build a safe FTS5 MATCH expression: quoted tokens OR-ed together."},{"kind":"def","name":"fts_or","line":69,"doc":"Distinct tokens as one FTS5 MATCH expression, OR-ed together."}],"summary":"Code-aware tokenizer for BM25 keyword search, used for both indexed text and queries, plus helpers that build a safe FTS5 MATCH expression.","details":"tokenize() finds identifiers and digit runs, splits each identifier on underscores and camelCase (getUserById becomes get, user, by, id), lowercases the parts, and also keeps the whole identifier (lowercased, outer underscores stripped) when it had more than one part, so exact-name queries score highest. Output tokens contain only a-z, 0-9 and underscore, so SQLite FTS5's unicode61 tokenizer with tokenchars '_' does no further splitting. Optional stopword removal drops a short list of English words plus self and cls, and optional stemming strips only a few suffixes (ies to y, ing, ed, es, s, with minimum lengths and never on 'ss' endings). Identifier splitting is cached with an LRU cache of 131072 entries because identifiers repeat across a repo. fts_or() de-duplicates tokens and joins them as double-quoted terms with OR, so words like AND or NEAR stay literal.","key_symbols":["tokenize(text, stem=False, stopwords=False): list of lowercase code-aware tokens","split_identifier(ident): snake_case and camelCase split","to_fts_text(text, **opts): tokens joined by spaces, as stored in FTS5","fts_match_query(query, **opts): query to MATCH expression","fts_or(tokens): distinct quoted tokens OR-ed together, or None if empty","STOPWORDS: small stopword set including self and cls"],"connects_to":["src/codemem/store.py","src/codemem/search.py","src/codemem/embedder.py"],"component":"tokenize"},"src/codemem/vectorcache.py":{"bytes":4436,"lines":105,"auto_summary":"Content-addressed vector cache shared by every index: (embedder key, text hash) -> vector.","symbols":[{"kind":"def","name":"to_blob","line":29,"doc":""},{"kind":"def","name":"from_blob","line":33,"doc":""},{"kind":"class","name":"VectorCache","line":37,"doc":"","methods":["__init__","_conn","get_many","put_many","count","close"]}],"summary":"A content-addressed vector cache shared by every index on the machine: (embedder key, text hash) maps to a stored vector, so rebuilding or indexing another version of a repo avoids re-running the model.","details":"The cache is a single SQLite table 'cache' (embedder, text_hash, dim, data) keyed on (embedder, text_hash), stored WITHOUT ROWID. Vectors are kept as float16 bytes at full dimension. The indexer opens it at <CODEMEM_HOME>/cache/vectors.db unless vector_cache = 'off'. Each thread gets its own connection in WAL mode with synchronous=NORMAL and a 60 s busy timeout, so several processes can share the file. Lookups go in slices of 500 hashes, and writes use INSERT OR IGNORE inside BEGIN IMMEDIATE. A failed write is logged and rolled back but never breaks an index update, because the cache only saves work; an index still keeps its own copy of every vector. close() closes only the calling thread's connection and those of finished threads, never one a running thread may be using.","key_symbols":["VectorCache(path): the shared SQLite cache","VectorCache.get_many(embedder, hashes): cached vectors by text hash","VectorCache.put_many(embedder, hashes, vecs): best-effort insert","VectorCache.count(embedder=None): number of cached vectors","VectorCache.close(): closes connections safely across threads","to_blob / from_blob: float16 byte encoding, also used by store.py"],"connects_to":["src/codemem/indexer.py","src/codemem/store.py"],"component":"embeddings"},"src/codemem/watcher.py":{"bytes":9292,"lines":230,"auto_summary":"File events -> batches of changed paths for incremental updates.","symbols":[{"kind":"def","name":"git_dir","line":33,"doc":"The repo's git folder: `.git/`, or where a worktree's or submodule's `.git` file points."},{"kind":"class","name":"Debouncer","line":50,"doc":"Collects paths and hands them over once no new one arrived for `delay` seconds, or at most","methods":["__init__","trigger","flush","_take","_fire","cancel"]},{"kind":"class","name":"_Handler","line":102,"doc":"","methods":["__init__","on_any_event"]},{"kind":"class","name":"RepoWatcher","line":116,"doc":"","methods":["__init__","_inside_root","_git_relative","seen","pending","barrier","start","alive","stop"]},{"kind":"def","name":"git_busy","line":227,"doc":"A git command is changing the working tree right now (checkout, merge, rebase)."}],"summary":"Turns operating-system file events (via watchdog) into debounced batches of changed repo-relative paths for the service. It also provides a barrier so a search can confirm every earlier save has been seen.","details":"The watcher only notices changes; CodememService decides when to index. RepoWatcher schedules a recursive watchdog Observer on the repo root, plus a non-recursive one on the git folder when it lives outside the root (a worktree or submodule whose .git is a 'gitdir:' file). seen() ignores 'opened' and 'closed_no_write' events and directory 'modified' events, skips the index folder and ALWAYS_SKIP_DIRS (.git, venv, node_modules, __pycache__, build, dist and so on), and turns changes to .gitignore or .codemem.toml, or to git's HEAD, packed-refs or refs/ (branch switch, pull, reset), into a full-reconcile request. Otherwise it forwards folders, files with a supported source extension, and paths that no longer exist. Debouncer collects paths and fires once no new event arrived for debounce_ms (500 ms), or at most max_wait_ms (2,000 ms) after the first, so a long burst of saves cannot postpone indexing forever; flush() lets a search take the collected paths at once. barrier() writes an empty marker file named codemem-barrier-<pid>-<random> into the git folder (or a hidden one in the repo root without git) and waits up to 0.25 s for its own event, which proves every earlier event has arrived because events come in order; it returns True on an OSError so it never blocks. git_busy() reports whether .git/index.lock exists (a checkout, merge or rebase in progress).","key_symbols":["RepoWatcher(root, on_change, debounce_ms=500, max_wait_ms=2000, skip=()): the observer and event filter","RepoWatcher.seen(raw, is_dir): classifies one event path (barrier marker, git ref, config/ignore change, source file)","RepoWatcher.barrier(timeout=0.25): marker-file round trip proving earlier events arrived","RepoWatcher.pending(): take collected paths now (debouncer flush)","Debouncer(delay, fn, max_wait): quiet-period batching with a maximum wait","_Handler.on_any_event: watchdog handler forwarding src and dest paths","git_dir(root): the git folder, following a .git file's gitdir: pointer","git_busy(root): True while .git/index.lock exists"],"connects_to":["src/codemem/service.py","src/codemem/config.py","src/codemem/languages"],"component":"service"},"tests/conftest.py":{"bytes":1427,"lines":53,"auto_summary":"","symbols":[{"kind":"class","name":"RecordingEmbedder","line":15,"doc":"FakeEmbedder that remembers every document text it embedded.","methods":["__init__","embed_documents"]},{"kind":"def","name":"isolated_home","line":28,"doc":"Never touch the real ~/.codemem from tests."},{"kind":"def","name":"sample_repo","line":38,"doc":""},{"kind":"def","name":"fake_config","line":45,"doc":""},{"kind":"def","name":"recorder","line":52,"doc":""}],"summary":"Shared pytest setup: keeps fixture repos out of collection, isolates every test from the real ~/.codemem, and provides the sample repo copy, a fake-model config and a recording embedder.","details":"collect_ignore_glob = ['fixtures/*'] stops pytest from collecting the sample repos' own test_*.py files, which are data. The autouse isolated_home fixture points CODEMEM_HOME at a per-test tmp folder and unsets CODEMEM_MODEL, CODEMEM_DEVICE and CODEMEM_STEERING, so no test reads or writes the user's real indexes or inherits their env. sample_repo copies tests/fixtures/sample_repo into tmp_path so tests can edit it freely. fake_config is a Config whose code and usage vectors both use model 'fake:64', and recorder is a RecordingEmbedder (a FakeEmbedder subclass that remembers every document text it embedded), which many tests use to count re-embeds.","key_symbols":["collect_ignore_glob: fixture repos are data, not tests","isolated_home (autouse): sets CODEMEM_HOME to tmp, clears CODEMEM_MODEL/DEVICE/STEERING","sample_repo: fresh tmp copy of fixtures/sample_repo","fake_config: Co ng FAISS, a corrupt .faiss file, or an older saved file under a newer note are all rebuilt or reconciled from the rows without re-embedding; an older schema is wiped (keeping other tools' files like cmeval-built) while a newer schema is refused, not wiped. Also: an embedder change drops only that vec type, a Matryoshka dim change keeps vectors, long chunks score by their best window, find_vectors reuses equal texts, ChunkFilter / path-prefix LIKE escaping, find_chunk_at prefers the innermost chunk, IndexLock is exclusive, a second Store catches up incrementally, concurrent searches never see a half-patched index, and closing a Store or VectorCache does not break another thread's live connection.","key_symbols":["test_faiss_vector_store_upsert_remove_search_filter","test_faiss_keeps_two_bytes_per_number_and_ranks_exactly / test_a_saved_file_of_four_byte_numbers_still_loads","test_add_update_delete_keeps_sqlite_and_faiss_in_sync","test_crash_before_saving_the_search_index_is_repaired_from_the_rows","test_a_corrupt_index_file_is_rebuilt","test_an_older_index_is_rebuilt_for_the_current_schema / test_a_newer_index_is_refused_not_wiped","test_embedder_change_drops_only_that_vec_type / test_matryoshka_dim_change_keeps_the_vectors","test_long_chunks_score_by_their_best_window","test_another_process_writes_and_this_one_catches_up / test_a_saved_index_is_reconciled_with_the_rows","test_searches_during_writes_never_see_a_half_patched_index"],"connects_to":["src/codemem/store.py","src/codemem/vectorcache.py","src/codemem/schema.py","src/codemem/embedder.py","src/codemem/tokenize.py"],"component":"tests"},"tests/test_texts_embedder.py":{"bytes":10373,"lines":217,"auto_summary":"","symbols":[{"kind":"def","name":"_chunk","line":11,"doc":""},{"kind":"def","name":"test_resolve_edges_skips_ambiguous_and_self","line":19,"doc":""},{"kind":"def","name":"test_test_detection","line":27,"doc":""},{"kind":"def","name":"test_usage_text_lists_callers_and_tests","line":36,"doc":""},{"kind":"d <script>

const D = JSON.parse(document.getElementById("data").textContent);
const C = Object.fromEntries(D.components.map(c => [c.id, c]));
const F = D.files;
const KINDS = D.kinds;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[ch]));
const kindColor = k => `var(--k-${k || "support"})`;
const children = id => D.components.filter(c => c.parent === id);
const ancestors = id => { const out = []; for (let c = C[id]; c; c = C[c.parent]) out.unshift(c); return out; };

// Every file under a component, including its sub-components.
const allFiles = id => [...(C[id].files || []), ...children(id).flatMap(ch => allFiles(ch.id))];

// ---- tiny markdown: paragraphs, bullets, ``` blocks, `code`, **bold**, [[file links]], {{component links}}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, t) => `<code>${t}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s.,;:)]|$)/g, "$1<i>$2</i>")
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, p, label) => F[p] ? `<a href="#/f/${encodeURI(p)}">${label || p}</a>` : (label || p))
    .replace(/\{\{([^}|]+)(?:\|([^}]+))?\}\}/g, (_, id, label) => C[id] ? `<a href="#/c/${id}">${label || esc(C[id].name)}</a>` : (label || id));
}
function md(text) {
  if (!text) return "";
  const out = []; let list = null; const lines = String(text).split("\n");
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      if (list) { out.push("</ul>"); list = null; }
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (/^\s*[-*] /.test(line)) {
      if (!list) { out.push("<ul>"); list = true; }
      out.push(`<li>${inline(line.replace(/^\s*[-*] /, ""))}</li>`); continue;
    }
    if (list) { out.push("</ul>"); list = null; }
    if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return `<div class="prose">${out.join("")}</div>`;
}

// ---- the system map (top-level components in labelled lanes, with curved links)
function wrap(text, width, maxLines) {
  // Word-wrap for SVG text; the last line ends in "…" if the text doesn't fit.
  const words = String(text).replace(/`/g, "").split(/\s+/), lines = [];
  let cur = "";
  for (const w of words) {
    if ((cur + " " + w).trim().length > width && cur) { lines.push(cur); cur = w; } else cur = (cur + " " + w).trim();
  }
  if (cur) lines.push(cur);
  if (lines.length > maxLines) {
    const keep = lines.slice(0, maxLines);
    keep[maxLines - 1] = keep[maxLines - 1].slice(0, width - 2).replace(/\s*\S*$/, "") + " …";

}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    const down = b.y >= a.y + a.h;
    const y1 = down ? a.y + a.h : a.y, y2 = down ? b.y : b.y + b.h;
    const lo = Math.max(a.x, b.x), hi = Math.min(a.x + a.w, b.x + b.w);
    if (hi - lo >= 60) {

    }
    const x1 = clamp(bcx, a.x + 40, a.x + a.w - 40), x2 = clamp(acx, b.x + 40, b.x + b.w - 40), ym = (y1 + y2) / 2;
    return { d: `M${x1},${y1} C${x1},${ym} ${x2},${ym} ${x2},${y2}`, mx: (x1 + x2) / 2, my: ym };
  }
  const right = b.x >= a.x + a.w;
  const x1 = right ? a.x + a.w : a.x, x2 = right ? b.x : b.x + b.w;
  const y = (Math.max(a.y, b.y) + Math.min(a.y + a.h, b.y + b.h)) / 2;

    <text x="${x}" y="${y + 4.5}" text-anchor="middle">${esc(label)}</text></g>`;

  const hotE = new Set(hotEdges.map(e => e.join(">")));
  const hotN = new Set(hotNodes);
  const focus = dimOthers && (hotE.size || hotN.size);
  const [W, H] = D.canvas;
  let svg = `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="codemem system map">
    <defs>
      <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--edge)"/></marker>
      <marker id="arrhot" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="var(--hot)"/></marker>
    </defs>`;
  for (const lane of D.lanes || []) {

  const pills = [];

    const isHot = hotE.has(`${e.from}>${e.to}`) || hotE.has(`${e.to}>${e.from}`);
    const cls = isHot ? "hot" : (focus ? "dim" : "");
    const g = edgeGeometry(a, b), m = isHot ? "arrhot" : "arr";
    svg += `<g class="edge ${cls}"><path d="${g.d}" marker-end="url(#${m})"${e.both ? ` marker-start="url(#${m})"` : ""}/></g>`;
    if (e.label) pills.push(pill(e.label, g.mx, g.my, cls));
  }
  for (const n of nodes) {
    const p = pos[n.id], isHot = hotN.has(n.id);
    const cls = isHot ? "hot" : (focus ? "dim" : "");
    const nFiles = allFiles(n.id).length;
    const sub = wrap(n.maptag || n.tagline || "", Math.floor((p.w - 50) / 6.7), 2);
    const top = p.y + (sub.length > 1 ? 30 : 36);
    svg += `<g class="node ${cls}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.name)}">
      <title>${esc(n.name)}: ${nFiles} file${nFiles === 1 ? "" : "s"}. Click to open.</title>
      <rect class="box" x="${p.x}" y="${p.y}" width="${p.w}" height="${p.h}" rx="14"/>
      <rect x="${p.x + 16}" y="${top - 13}" width="10" height="10" rx="3" fill="${kindColor(n.kind)}"/>
      <text class="title" x="${p.x + 34}" y="${top - 2}">${esc(n.maptitle || n.name)}</text>
      ${sub.map((line, i) => `<text class="sub" x="${p.x + 16}" y="${top + 21 + i * 18}">${esc(line)}</text>`).join("")}
      <path class="chev" d="M${p.x + p.w - 20},${p.y + p.h / 2 - 6} l6,6 l-6,6"/>
    </g>`;

}

const INDEX = [
  ...D.components.map(c => ({ kind: "Component", title: c.name, sub: c.tagline || "", href: `#/c/${c.id}`, text: `${c.name} ${c.tagline} ${c.summary} ${c.details || ""}` })),
  ...Object.entries(F).map(([p, f]) => ({ kind: "File", title: p, sub: f.summary || f.auto_summary || "", href: `#/f/${encodeURI(p)}`,
    text: `${p} ${f.summary} ${f.details} ${(f.key_symbols || []).join(" ")} ${(f.symbols || []).map(s => s.name + " " + (s.methods || []).join(" ")).join(" ")}` })),
  ...D.flows.flatMap(f => f.steps.map((s, i) => ({ kind: "Flow step", title: `${f.name} › ${s.title}`, sub: "", href: `#/flow/${f.id}/${i}`, text: `${s.title} ${s.text} ${(s.refs || []).join(" ")}` }))),
].map(e => ({ ...e, hay: e.text.toLowerCase(), t: e.title.toLowerCase() }));
// Exact names defined in a file (from the code and its key parts) rank that file first.
for (const e of INDEX) {
  if (e.kind !== "File") continue;
  const f = F[decodeURI(e.href.slice(4))] || {};
  e.syms = new Set([...(f.symbols || []).flatMap(s => [s.name, ...(s.methods || [])]),
    ...(f.key_symbols || []).map(k => k.split(":")[0].replace(/\(.*$/, "").trim())].map(x => x.toLowerCase()));
}
function runSearch(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean); if (!terms.length) return [];
  return INDEX.map(e => {
    let score = 0;
    for (const t of terms) {
      if (!e.hay.includes(t)) return null;
      score += 1 + (e.t.includes(t) ? 5 : 0) + (e.syms && [...e.syms].some(s => s === t || s.endsWith("." + t)) ? 8 : 0);
    }
    return { e, score: score + (e.kind === "Component" ? 1 : 0) };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30).map(x => x.e);
}
let sel = -1;

    : (ev.target.value.trim() ? `<a><small>No match.</small></a>` : "");

    ev.preventDefault(); sel = (sel + (ev.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((a, i) => a.classList.toggle("sel", i === sel)); items[sel]?.scrollIntoView({ block: "nearest" });
  } else if (ev.key === "Enter" && items.length) { go(items[Math.max(sel, 0)].getAttribute("href")); closeSearch(); }
  else if (ev.key === "Escape") closeSearch();
});
function closeSearch() { $("#qres").classList.remove("open"); $("#q").blur(); }
$("#qres").addEventListener("click", ev => { if (ev.target.closest("a[href]")) closeSearch(); });
document.addEventListener("click", ev => { if (!ev.target.closest(".search")) $("#qres").classList.remove("open"); });
document.addEventListener("keydown", ev => {
  if (document.activeElement.tagName === "INPUT") return;
  // Presentation clickers send PageDown / PageUp; they step only in the big picture.
  const big = route().startsWith("#/big");
  if (ev.key === "/") { ev.preventDefault(); $("#q").focus(); }
  else if ((ev.key === "ArrowRight" || big && ev.key === "PageDown") && $("#next") && !$("#next").disabled) { ev.preventDefault(); $("#next").click(); }
  else if ((ev.key === "ArrowLeft" || big && ev.key === "PageUp") && $("#prev") && !$("#prev").disabled) { ev.preventDefault(); $("#prev").click(); }
});

// ---- theme (remembered per browser; works without storage too)
function setTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { setTheme(localStorage.getItem("codemem-explorer-theme")); } catch (e) {}
$("#theme").onclick = () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const t = dark ? "light" : "dark"; setTheme(t);
  try { localStorage.setItem("codemem-explorer-theme", t); } catch (e) {}
};

// ---- routing: the address hash when the browser allows it (file://, http), else an in-page route
let current = location.hash || "#/";
const route = () => current;
function go(h) {
  current = h;
  try { if (location.protocol !== "data:" && location.hash !== h) location.hash = h; } catch (e) {}
  if (location.hash !== h) render();  // the hash didn't change (e.g. a data: URL), so no hashchange event comes
}
window.addEventListener("hashchange", () => { if (location.hash && location.hash !== current) current = location.hash; render(); });
document.addEventListener("click", ev => {
  const a = ev.target.closest('a[href^="#/"]');
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
  ev.preventDefault(); go(a.getAttribute("href"));
});
function render() {
  const h = decodeURI(current.replace(/^#\/?/, ""));
  const [view, ...rest] = h.split("/");
  if (view !== "flows" && view !== "flow") stopPlay();
  document.body.classList.toggle("wide", !view || view === "flows" || view === "flow" || view === "big");
  if (view === "c") viewComponent(rest[0], rest.slice(1).join("/") || null);
  else if (view === "f") viewFile(rest.join("/"));
  else if (view === "flows") viewFlows(D.flows[0].id, 0);
  else if (view === "flow") viewFlows(rest[0], +rest[1] || 0);
  else if (view === "big") viewOverview(+rest[0] || 0);
  else if (view === "files") viewFiles("");
  else viewHome();
  if (view !== "flow" && view !== "big") window.scrollTo({ top: 0 });
}
$("#ver").textContent = `${D.git.branch} @ ${D.git.commit}`;
$("#foot").innerHTML = `Built from ${esc(D.git.branch)} @ <span class="mono">${esc(D.git.commit)}</span> (${esc(D.git.date)}) on ${esc(D.built)}.
  Rebuild with <code>python build.py</code> in this folder; descriptions live in <code>content.json</code> next to it.`;
render();
</script>
