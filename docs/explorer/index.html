e.html` with `content.json` (all the text: components, map layout, flows, a description of every file) plus facts it reads from the repo with git (the file list, line counts, Python definitions, Markdown headings, the commit), and writes one self-contained `index.html`.","details":"Rebuild with `python docs/explorer/build.py` after the repo changes; `--check` only lists files that belong to no component. A new file shows up if a component's glob covers it; otherwise the build stops and names it.","files":["docs/explorer/README.md","docs/explorer/build.py","docs/explorer/content.json","docs/explorer/index.html","docs/explorer/template.html"]},{"id":"project","name":"Project files","tagline":"pyproject, lockfile, Python version, gitignore","summary":"How the package is built and installed: uv project, pinned dependencies, Python 3.11, and what git ignores.","kind":"support","related":["config"],"files":[".gitignore",".python-version","pyproject.toml","uv.lock"]},{"id":"res-2026-10-23-dev50-final","name":"2026-10-23-dev50-final","tagline":"First full dev run","summary":"First full dev run: 50 SWE-bench Verified dev tasks, 6 systems (grep, grep-fn, grep-fn-plus, cm-bm25, cm-bm25-code, cm-bm25-code-usage), update mode, 50 hits per search, baseline grep-fn-plus, real Anthropic token counts. Merged from a grep run (cmeval c6b2933) and a codemem run (codemem d5c2013).","parent":"eval-results","details":"**Headline:** File recall@10: cm-bm25-code-usage 0.848 [0.752, 0.932] vs grep-fn-plus 0.760 and cm-bm25-code 0.703. Function MRR: cm-bm25-code-usage 0.423 vs grep-fn-plus 0.316, +0.107 [-0.044, +0.254], Holm p 0.588; no primary test significant after Holm over 6 tests. codemem build 232.3 s mean, update 64.4 s median, index 398.3 MB.","files":["eval/results/2026-10-23-dev50-final/index.jsonl","eval/results/2026-10-23-dev50-final/meta.json","eval/results/2026-10-23-dev50-final/report.md","eval/results/2026-10-23-dev50-final/score-meta.json","eval/results/2026-10-23-dev50-fina ":"**Headline:** Function MRR: cm2-bm25 0.203, cm2-bm25-code 0.347, cm2-bm25-code-usage 0.386, cm2-full-fn 0.413. All 4 primary tests Holm p 0.594, none significant. Token numbers are rough estimates the report says never to report.","files":["eval/results/2026-10-24-subset-v2/index.jsonl","eval/results/2026-10-24-subset-v2/meta.json","eval/results/2026-10-24-subset-v2/report.md","eval/results/2026-10-24-subset-v2/score-meta.json","eval/results/2026-10-24-subset-v2/scores.jsonl.gz","eval/results/2026-10-24-subset-v2/summary.csv"]},{"id":"res-2026-10-24-subset-weights","name":"2026-10-24-subset-weights","tagline":"Search-time weighting variants for v2 (configs/codemem-v2-weights.toml, codemem 18d3b77) o","summary":"Search-time weighting variants for v2 (configs/codemem-v2-weights.toml, codemem 18d3b77) on the same 13 tasks; 8 cm2 systems on one index, baseline cm2-ref, token estimates.","parent":"eval-results","details":"**Headline:** Function MRR: cm2-ref 0.386, cm2-t05-c05-b05 0.410, cm2-fn-t05 0.421. Primary differences +0.024 [+0.002, +0.055] and +0.035 [+0.002, +0.090], all Holm p 0.500, not significant.","files":["eval/results/2026-10-24-subset-weights/index.jsonl","eval/results/2026-10-24-subset-weights/meta.json","eval/results/2026-10-24-subset-weights/report.md","eval/results/2026-10-24-subset-weights/score-meta.json","eval/results/2026-10-24-subset-weights/scores.jsonl.gz","eval/results/2026-10-24-subset-weights/summary.csv"]},{"id":"res-2026-10-24-subset-b4","name":"2026-10-24-subset-b4","tagline":"Update vs. rebuild check for the 7 codemem v2 systems on the 13 subset tasks","summary":"Update vs. rebuild check for the 7 codemem v2 systems on the 13 subset tasks: update run at codemem 31c0f99, rebuild run at codemem 18d3b77.","parent":"eval-results","details":"**Headline:** Result: PASS. 13 (100%) same top 10 for every system, metric difference 0.0000, token differences up to 0.19%. Warning: the runs use different codemem code.","files":["eval/results/2026- elines on the 399 fresh dev tasks","summary":"The grep baselines (grep, grep-fn, grep-fn-plus) on the 399 fresh dev tasks (`tasks/fresh-v1.jsonl`), at cmeval `3743a30`. The report is filtered with `--where gold_all_python=true` (364 tasks; the other 35 are in its last section). No codemem systems: they join later with `cmeval merge`. Dev split.","parent":"eval-results","details":"**Headline:** File recall@10 on 364 tasks: grep-fn-plus 0.599, grep-fn 0.157, grep 0.103.","files":["eval/results/2026-10-25-fresh-dev-grep-b/index.jsonl","eval/results/2026-10-25-fresh-dev-grep-b/meta.json","eval/results/2026-10-25-fresh-dev-grep-b/report.md","eval/results/2026-10-25-fresh-dev-grep-b/score-meta.json","eval/results/2026-10-25-fresh-dev-grep-b/scores.jsonl.gz","eval/results/2026-10-25-fresh-dev-grep-b/summary.csv"]},{"id":"res-2026-10-26-py100","name":"2026-10-26-py100","tagline":"Main Python comparison: cm3-full vs grep","summary":"The main Python comparison (F5 B4): grep, grep-fn, grep-fn-plus and `cm3-full` (`configs/main-python.toml`) on `tasks/fresh-v1-py100.jsonl` (100 all-Python fresh dev tasks from pandas, transformers, home-assistant and airflow), at `aed438d`, update mode. Primary tests: cm3-full vs grep-fn-plus, Holm over 2.","parent":"eval-results","details":"**Headline:** File recall@10: cm3-full 0.753 vs grep-fn-plus 0.676. Function MRR 0.378 vs 0.461 (Holm p 0.238) and tokens to the first right function 1,284 vs 1,871 (Holm p 0.397): neither primary test significant.","files":["eval/results/2026-10-26-py100/index.jsonl","eval/results/2026-10-26-py100/meta.json","eval/results/2026-10-26-py100/report.md","eval/results/2026-10-26-py100/score-meta.json","eval/results/2026-10-26-py100/scores.jsonl.gz","eval/results/2026-10-26-py100/summary.csv"]},{"id":"res-2026-10-26-cpp68","name":"2026-10-26-cpp68","tagline":"Main C++ comparison: cm3-full vs grep","summary":"The main C++ comparison (F7 B4): grep, grep-fn, grep-fn-plus (C, C++ and CUDA files) and `cm3-full` (`configs/main-cpp.toml`) on `tasks/fresh-cpp-v1-68.jsonl` (25 duckdb, 25 Godot, 18 llama.cpp all-C++ fresh dev tasks), at `7c24558`, update mode. Report with `--where gold_all_cpp=true`.","parent":"eval-results","details":"**Headline:** File recall@10: cm3-full 0.605 vs grep-fn-plus 0.382. Function MRR 0.276 vs 0.152 (+0.124, Holm p 0.014) and tokens to the first right function 1,813 vs 3,955 (Holm p 0.010): both primary tests significant.","files":["eval/results/2026-10-26-cpp68/index.jsonl","eval/results/2026-10-26-cpp68/meta.json","eval/results/2026-10-26-cpp68/report.md","eval/results/2026-10-26-cpp68/score-meta.json","eval/results/2026-10-26-cpp68/scores.jsonl.gz","eval/results/2026-10-26-cpp68/summary.csv"]},{"id":"res-2026-10-26-ts50","name":"2026-10-26-ts50","tagline":"Main TypeScript comparison: cm3-full vs grep","summary":"The main TypeScript comparison (F7 B4): grep, grep-fn, grep-fn-plus (`.ts` files) and `cm3-full` (`configs/main-typescript.toml`) on `tasks/fresh-ts-v1-50.jsonl` (25 vscode, 25 playwright all-TypeScript fresh dev tasks), at `7c24558`, update mode. Report with `--where gold_all_typescript=true`.","parent":"eval-results","details":"**Headline:** File recall@10: cm3-full 0.601 vs grep-fn-plus 0.418. Function MRR 0.307 vs 0.258 (Holm p 0.469, not significant); tokens to the first right function 1,745 vs 4,329 (Holm p 0.048, significant).","files":["eval/results/2026-10-26-ts50/index.jsonl","eval/results/2026-10-26-ts50/meta.json","eval/results/2026-10-26-ts50/report.md","eval/results/2026-10-26-ts50/score-meta.json","eval/results/2026-10-26-ts50/scores.jsonl.gz","eval/results/2026-10-26-ts50/summary.csv"]}],"files":{".gitignore":{"bytes":157,"lines":13,"summary":"Git ignore rules for the codemem repo: Python build and cache output, virtualenvs, and local codemem, eval and personal data folders.","details":"It ignores __pycache__/, compiled *.py[cod] files, .venv/, .pytest_cache/, /dist/, /build/ and *.egg-info/. It also ignores local working folders: .codemem-index/, .cache/ (where the README says `.cache/env.sh` keeps models, caches and indexes inside the project), .codemem-home/, .eval-data/ and .personal/, plus macOS .DS_Store files.","key_symbols":["Python artefacts: __pycache__/, *.py[cod], .venv/, .pytest_cache/, /dist/, /build/, *.egg-info/","Local data: .codemem-index/, .cache/, .codemem-home/, .eval-data/, .personal/"],"connects_to":["README.md"],"component":"project"},".python-version":{"bytes":6,"lines":1,"summary":"Pins the project's Python to 3.11, which uv reads when it creates the virtualenv.","details":"The file contains the single line '3.11'. It matches requires-python >= 3.11 in pyproject.toml; 3.11 is the minimum because the config loader uses the standard-library tomllib, which was added in 3.11.","key_symbols":["3.11"],"connects_to":["pyproject.toml","uv.lock"],"component":"project"},"README.md":{"bytes":11349,"lines":205,"headings":[[1,"codemem"],[2,"Install"],[2,"Quick start"],[2,"Using it from an agent"],[2,"Configuration"],[2,"Where things are stored"],[2,"Evaluating"],[2,"Team"],[2,"License note"]],"summary":"The project front page: what codemem is for, how to install and run it, how to connect agents, every configuration option, where data is stored, how to run the eval, and the team.","details":"It describes codemem as local code search for coding agents over nine languages (Python, JavaScript, TypeScript, Go, Java, C, C++/CUDA, Rust), indexing every function, class and top-level block and answering plain-language questions through MCP and a CLI, aimed at vague feature-level questions while grep stays the tool for exact strings. It links the five docs, gives install commands (uv tool install or pipx; uv sync and uv run pytest for development, with -m model for the real jina model) and a command table for init, index, search, status, watch, mcp and languages. The agent section covers Claude Code (.mcp.json or `claude mcp add`), Cursor (.cursor/mcp.json), Codex (a printed ~/.codex/config.toml snippet) and the python -m fallback, and names the four tools. The configuration section shows the load order (~/.codemem/config.toml, then <repo>/.codemem.toml, then CODEMEM_* environment variables), a fully annotated TOML example with defaults, OpenAI-compatible embedding APIs (key read from an environment variable, never stored), and plugin embedders and vector backends. It ends with storage locations, eval commands (cmeval run/score/report and compare_scores.py), team roles, and a note that jina-code-embeddings is reportedly CC BY-NC 4.0 (non-commercial).","key_symbols":["Quick start: init --agents claude, search --debug, status","Command table: init, index, search, status, watch, mcp, languages","Using it from an agent: Claude Code, Cursor, Codex, python -m fallback","Configuration: annotated TOML with every default, [embedding] API, plugins","Where things are stored: ~/.codemem/indexes/<repo>-<hash>/ and ~/.codemem/cache/vectors.db","Evaluating: cmeval commands and configs/codemem-v3.toml","License note: jina models reportedly non-commercial"],"connects_to":["docs/architecture.md","docs/data-model.md","docs/decisions.md","docs/advanced-design.md","docs/exa.md","pyproject.toml"],"component":"docs"},"docs/advanced-design.md":{"bytes":46637,"lines":673,"headings":[[1,"Advanced design: where codemem goes after the baseline"],[2,"Research questions (from the project plan)"],[2,"0. The short version"],[2,"1. Where the baseline loses"],[2,"2. Anchor text for code (idea 1)"],[3,"2.1 In plain words"],[3,"2.2 What to add (in order of cost)"],[3,"2.3 How to index anchors"],[3,"2.4 Experiments"],[2,"3. Query routing and exact-lookup protection (idea 2)"],[3,"3.1 In plain words"],[3,"3.2 Design (\"Canon-lite\")"],[3,"3.3 Reranker (after routing works)"],[3,"3.4 Other pipeline ideas from Exa"],[2,"4. Many vectors per function (idea 3: your multi-vector intuition)"],[3,"4.1 In plain words: why one vector is lossy"],[3,"4.2 How to score many vectors"],[3,"4.3 Your \"fine-tuned 8B with cross-attention over n base embeddings\", mapped to what exists"],[3,"4.4 The proposed novel piece: structure-seeded pooled late interaction"],[3,"4.5 A free bonus: line highlights"],[3,"4.6 Storage and speed for 100k functions (~300 tokens each)"],[3,"4.7 Experiments and gates"],[3,"4.8 How search works end to end in the final design"],[2,"5. Train on the repo's own links, then distill (idea 4)"],[3,"5.1 In plain words"],[3,"5.2 Training pairs"],[3,"5.3 Recipe"],[3,"5.4 Risks"],[2,"6. Highlights under one token budget (idea 5)"],[3,"6.1 In plain words"],[3,"6.2 What codemem already does, and what comes next"],[2,"7. Cheap index (idea 6, RQ2)"],[2,"8. Freshness ideas (RQ3)"],[2,"9. Evaluation add-ons borrowed from Exa"],[2,"10. Compute plan"],[2,"11. Roadmap"],[3,"Open questions about the current system"],[2,"12. Sources"]],"summary":"An exploratory research proposal, explicitly not implemented, for where codemem goes after the baseline, organised around the project's research questions on accuracy, cost and freshness.","details":"It states three research questions (RQ1 accuracy of usage context and multi-signal retrieval, RQ2 tokens and a cheap index, RQ3 latency) with hypotheses, an evaluation plan (metrics, full-issue vs short agent-style queries, benchmarks such as SWE-bench Lite/Verified, LocBench and multilingual sets, baselines, leakage rules) and risks. Section 0 ranks six ideas: anchor text for code (callers, tests, commits), query routing with exact-lookup protection, many vectors per function (late interaction), training on the repo's own links then distilling, highlights under a token budget, and a cheap index (short vectors, 1-bit quantisation, rescoring). It warns that published gains come mostly from training on the right task and from reranking, and that generic rerankers can hurt exact lookups. Later sections detail each idea with experiments and gates, plus freshness ideas, eval add-ons from Exa, a compute plan and a dated roadmap. The 'Open questions about the current system' table lists known gaps, including that functions nothing calls rank lower because they have no usage vector, which matches the decision recorded in CLAUDE.md.","key_symbols":["Research questions RQ1-RQ3 and H1-H4","§0 The short version: six ideas ranked by gain for cost","§2-§7: anchors, routing, multi-vector, training, highlights, cheap index","§11 Roadmap and open questions about the current system","§12 Sources"],"connects_to":["docs/exa.md","docs/architecture.md","eval"],"component":"guides"},"docs/architecture.md":{"bytes":46398,"lines":717,"headings":[[1,"How codemem works"],[2,"1. What it is for"],[2,"2. The big picture"],[2,"3. What the index knows about a function"],[3,"3.1 Finding files"],[3,"3.2 Chunks"],[3,"3.3 Call links"],[3,"3.4 Texts"],[3,"3.5 Vectors"],[2,"4. Keeping the index fresh: the two-stage indexer"],[3,"4.1 The two stages"],[3,"4.2 A search catches up first, within 4 s"],[3,"4.3 The watcher and the writer"],[3,"4.4 How stage A touches only what changed"],[3,"4.5 When things go wrong"],[2,"5. Storage"],[2,"6. Search"],[2,"7. MCP server and CLI"],[2,"8. How the eval uses it"],[2,"9. Extending it"],[2,"10. Performance"],[2,"11. The code, end to end"]],"summary":"The main explanation of how codemem works and why, following one running example (finding revoke_session for the issue 'Disabled users stay logged in') through the whole system.","details":"Section 2 gives the big picture: agents, the CLI and the eval all go through CodememService, whose watcher, single writer thread and pre-search catch-up drive a two-stage indexer over a SQLite store with in-memory FAISS indexes. Section 3 covers finding files, chunking with tree-sitter, call links by name, code and usage texts, and vectors. Section 4, the core, explains freshness: stage A (structure, one SQLite transaction, milliseconds) and stage B (embedding, in batches, newest first), the dirty_texts queue committed with the structure, the 4 s catch-up before every search with a marker-file barrier, the freshness note, and failure cases (crashes, two sessions, no file events, model still loading). Section 5 covers storage (index.db tables, vec_*.faiss copies kept at 2 bytes per number, write.lock, the shared vector cache). Section 6 covers search: BM25 with field weights name 10, signature 5, path 3, doc 2, code 1, code and usage vector lists, RRF with 1/(60 + rank) over top 50 per list, filters and weights, and location tie-breaks. Sections 7 to 11 cover the MCP server and CLI, how the eval uses the library, extension points, performance on vLLM, and a function-by-function map of an update and a search.","key_symbols":["§2 The big picture (diagram of service, indexer, store, search)","§4 Keeping the index fresh: two stages, catch-up within 4 s, watcher and writer","§5 Storage: index.db, vec_*.faiss, write.lock, vector cache","§6 Search: BM25 + code + usage, RRF k=60, cards","§7 MCP server and CLI: the four tools","§11 The code, end to end: call paths for an update and a search"],"connects_to":["README.md","docs/data-model.md","docs/decisions.md","src/codemem/service.py","src/codemem/search.py","src/codemem/watcher.py","src/codemem/indexer.py","src/codemem/store.py"],"component":"guides"},"docs/data-model.md":{"bytes":33988,"lines":625,"headings":[[1,"codemem data model and contracts"],[2,"0. The running example"],[2,"1. The picture"],[2,"2. File"],[2,"3. Chunk"],[3,"3.1 Kinds"],[3,"3.2 Fields"],[3,"3.3 Qualified names by language"],[3,"3.4 Line rules"],[3,"3.5 Classes and blocks"],[3,"3.6 Tests"],[3,"3.7 Unchanged, moved or changed"],[2,"4. Calls and edges"],[2,"5. Texts and vectors"],[3,"5.1 Vector types and their texts"],[3,"5.2 Parts (windows)"],[3,"5.3 Vector row"],[3,"5.4 Embedder key"],[3,"5.5 Reuse"],[2,"6. BM25 fields"],[2,"7. On disk"],[2,"8. Consistency and recovery"],[2,"9. Identity across edits and commits"],[2,"10. Version stamps"],[2,"11. What is fixed, and what can grow"],[2,"12. Contracts"],[3,"12.1 MCP tools (what agents rely on)"],[3,"12.2 The eval adapter (what `eval/src/cmeval/adapters/codemem.py` relies on)"],[3,"12.3 Configuration"],[3,"12.4 Plugin classes"]],"summary":"The exact formats and contracts: what each stored record holds, the rules for keys, lines and hashes, version stamps, and the interfaces that MCP clients, the eval adapter, the config and plugins rely on.","details":"Sections 1 to 6 define files, chunks (kinds function, method, class, block; fields; qualified names per language; line rules; tests), calls and edges, the code and usage texts with their windows, vector rows, embedder keys, reuse, and the five BM25 fields. Section 7 lists what is on disk: index.db in WAL mode with its tables, vec_<type>.faiss plus a vec_<type>.json note (an IndexIDMap2 over an fp16 IndexScalarQuantizer, with older 4-byte IndexFlatIP files converted on load), write.lock, the shared vectors.db cache, model_hashes.json, and the meta keys. Sections 8 to 11 cover consistency and recovery (SQLite is the source of truth, FAISS is derived and kept in step by epochs), identity across edits, version stamps, and what can grow. Section 12 is the contract: the four MCP tools with arguments and outputs, the card format and the freshness note, what the eval adapter depends on (CodememService, update returning IndexStats, search with ValueError for unknown signals, format_results, config_from_dict, fake models, full=True wiping in place), the configuration load order with index-time vs search-time settings, and the embedder and VectorStore plugin interfaces.","key_symbols":["§3 Chunk: kinds, fields, qualnames, line rules","§5 Texts and vectors, embedder key","§7 On disk and meta keys","§8 Consistency and recovery","§12.1 MCP tools contract","§12.2 Eval adapter contract","§12.3 Configuration (load order, index-time vs search-time)","§12.4 Plugin classes (Embedder, VectorStore, embedder factories)"],"connects_to":["docs/architecture.md","src/codemem/schema.py","src/codemem/store.py","src/codemem/texts.py","src/codemem/server.py","eval/src/cmeval/adapters/codemem.py"],"component":"guides"},"docs/decisions.md":{"bytes":15858,"lines":183,"headings":[[1,"Running codemem: dependencies, limits, keys and files"],[2,"1. What depends on what"],[2,"2. Each dependency: why it, and what if it's missing or down"],[2,"3. Operational choices, and why"],[2,"4. Constants"],[2,"5. Keys: what decides when work is redone"],[2,"6. Files: what to keep and what is safe to delete"],[2,"7. Network and privacy"],[2,"8. Known gaps"]],"summary":"The operating manual: what codemem depends on and what happens when a dependency is missing or down, the operational values and why they were chosen, constants, the keys that decide when work is redone, files and what is safe to delete, network use, and known gaps.","details":"Section 2 is a table per dependency (the jina model, sentence-transformers and PyTorch, FAISS, SQLite FTS5, tree-sitter, watchdog, git, the MCP SDK pinned below 3, an optional embedding API) with failure behaviour and backups; for example without file events codemem does a full check every 10 s and before each search. Section 3 explains settings such as the 4 s catch-up budget (chosen Oct 25), the 0.5 s / 2 s debounce, the 5-minute safety check, saving FAISS after 30 s idle, the vector cache, the 10 MB file cap, skipping vendored and generated code, 1,024 tokens per text, API retry policy, and 'light' steering as the middle of the agent study's three levels. Section 4 lists code constants with their files (CATCHUP_MAX_CHUNKS, _BATCH, _CALL_CHARS, SAVE_AFTER_IDLE, BURST_PATHS, _LONG_CLASS_LINES, the k cap of 50 and others). Section 5 defines the embedder key formats (local, API, plugin), notes that the device is part of the local key, and tabulates what each setting change redoes. Section 6 says only the shared vector cache is costly to lose. Sections 7 and 8 cover the two cases where codemem uses the network (model download, an optional API) and known gaps such as API outages making searches wait about 31 s.","key_symbols":["§1-§2 Dependencies and failure modes","§3 Operational choices and why","§4 Constants table","§5 Keys: embedder key, index settings, what each change redoes","§6 Files: what is safe to delete","§7 Network and privacy","§8 Known gaps"],"connects_to":["docs/architecture.md","README.md","src/codemem/service.py","src/codemem/config.py","src/codemem/embedder.py"],"component":"guides"},"docs/exa.md":{"bytes":17327,"lines":279,"headings":[[1,"What we take from Exa"],[2,"1. The short version"],[2,"2. What codemem already uses"],[2,"3. Notes by area"],[3,"3.1 Vector database ([web-scale vector DB](https://exa.ai/blog/building-web-scale-vector-db), Dec 2024)"],[3,"3.2 BM25 ([50% memory reduction](https://exa.ai/blog/bm25-optimization), May 2025)"],[3,"3.3 exa-d, the data framework ([exa-d](https://exa.ai/blog/exa-d), Jan 2026): the most transferable post"],[3,"3.4 The search pipeline ([Composing a Search Engine](https://exa.ai/blog/composing-a-search-engine), Apr 2026; [reranking](https://exa.ai/blog/sota-reranking), Oct 2026)"],[3,"3.5 Embedding training: next-link prediction (Latent Space podcast, Jan 2025; Cognitive Revolution podcast, Mar 2024)"],[3,"3.6 Highlights ([Dynamic Highlights](https://exa.ai/blog/dynamic-highlights), Aug 2026; [Highlights](https://exa.ai/blog/highlights-for-agents), Apr 2026)"],[3,"3.7 Evaluation (WebCode, How we do evals, ATLAS, RL outcomes, Snapshot, company search)"],[3,"3.8 Product and latency notes"],[2,"4. Transferable ideas, ranked"]],"summary":"Exploratory research notes on what codemem can learn from Exa's engineering blog (Exa runs a web search engine for AI agents; codemem does not use Exa's product).","details":"It merges two reading passes (Oct 4 and Oct 23, 2026, the second covering all 47 blog posts) and warns that quotes came through an extraction model and some numbers were read off charts. The short version notes that Exa never writes about keeping an index fresh (codemem's niche), that its next-link prediction objective maps to next-reference prediction for code, that its pipeline is hybrid with RRF, and that its evaluation tricks (separate retrieval scoring, memory filters, changing only the retriever, bootstrap intervals) are cheap to copy. Section 2 maps Exa ideas codemem already uses: hybrid lists merged with RRF k=60, exa-d-style hash-keyed derived data and one update codepath, versioned model keys, best-window highlights, search plus get_chunk as two-tier tools, scope filters, skipping vendored code. Section 3 has notes by area (vector DB, BM25, exa-d, pipeline and reranking, embedding training, highlights, evaluation, product and latency), and section 4 ranks ten transferable ideas, marking the ones already done.","key_symbols":["§1 The short version","§2 What codemem already uses (table)","§3 Notes by area","§4 Transferable ideas, ranked"],"connects_to":["docs/advanced-design.md","docs/architecture.md"],"component":"guides"},"docs/explorer/README.md":{"bytes":1762,"lines":29,"headings":[[1,"codemem Explorer"]],"summary":"How to open, rebuild and check the explorer, and what each of its files is.","component":"explorer"},"docs/explorer/build.py":{"bytes":11340,"lines":270,"auto_summary":"Build index.html: an interactive map of every file in the codemem repo.","symbols":[{"kind":"def","name":"default_repo","line":30,"doc":"The repo this folder is in (docs/explorer/), else a codemem checkout next to it."},{"kind":"def","name":"set_repo","line":47,"doc":""},{"kind":"def","name":"git","line":54,"doc":""},{"kind":"def","name":"tracked_files","line":58,"doc":"Files in git, and new files git doesn't ignore."},{"kind":"def","name":"_glob_regex","line":64,"doc":"Glob with `**` (any number of folders), `*` (within one folder) and `?`."},{"kind":"def","name":"assign","line":81,"doc":"file -> component id. Exact paths win; then the pattern with the longest literal prefix."},{"kind":"def","name":"check","line":114,"doc":"Coverage problems: files with no component, unknown paths, broken references."},{"kind":"def","name":"_first_line","line":152,"doc":""},{"kind":"def","name":"python_facts","line":156,"doc":""},{"kind":"def","name":"markdown_facts","line":173,"doc":""},{"kind":"def","name":"file_facts","line":183,"doc":""},{"kind":"def","name":"build","line":201,"doc":""},{"kind":"def","name":"artifact_page","line":246,"doc":"The same page for claude.ai, which adds its own doctype, head and body around it."},{"kind":"def","name":"main","line":254,"doc":""}],"summary":"Builds `index.html` from `template.html`, `content.json` and facts read from the repo (stdlib only).","details":"Lists the repo's files with git, maps each to a component (exact paths win, then the most specific glob), checks coverage and references, reads Python definitions with `ast` and Markdown headings, and inlines everything as JSON. `--check` only checks; `--repo PATH` builds from another checkout.","connects_to":["docs/explorer/template.html","docs/explorer/content.json","docs/explorer/index.html"],"component":"explorer"},"docs/explorer/content.json":{"bytes":360343,"lines":5567,"summary":"All the explorer's text: components and their files, the map layout, the flows, the big picture steps, and a description of every file.","connects_to":["docs/explorer/build.py"],"component":"explorer"},"docs/explorer/index.html":{"bytes":530058,"lines":780,"summary":"The built page (generated by `build.py`; don't edit). Open it in a browser.","connects_to":["docs/explorer/build.py"],"component":"explorer"},"docs/explorer/template.html":{"bytes":50166,"lines":780,"summary":"The app: HTML, CSS and vanilla JS with a `__DATA__` placeholder; no libraries, works offline.","details":"Views: the system map, the big picture walkthrough, component and file pages, data flows with Next/Play, the file tree, and search (`/`). Light and dark themes; routes live in the address hash.","connects_to":["docs/explorer/build.py"],"component":"explorer"},"eval/.python-version":{"bytes":6,"lines":1,"summary":"Pins Python 3.11 for the eval package's uv environment.","details":"A one-line file containing `3.11`. pyproject.toml separately requires Python >= 3.11.","connects_to":["eval/pyproject.toml"],"component":"eval-project"},"eval/README.md":{"bytes":13850,"lines":154,"headings":[[1,"cmeval"],[2,"Install"],[2,"Tasks"],[2,"Commands"],[2,"Watch a long job"],[2,"Systems (the plug)"],[2,"Run files"],[2,"Metrics"],[2,"Runs on other machines"],[2,"Local data"]],"summary":"User guide for cmeval: install, task files and splits, every subcommand, the dashboard, the Retriever plug, run files, metrics, and cross-machine runs.","details":"Explains that a task is one GitHub issue (query) + one base_commit snapshot + gold files/classes/functions changed by the real fix, and that cmeval never depends on codemem (only the adapter imports it). Documents the two task files (swebv-dev50: 50 SWE-bench Verified tasks, all dev; fresh-v1: 2,084 tasks from 7 Python repos merged 2026-07-01 to 2026-10-22, 399 dev / 1,685 test, use tag gold_all_python for the main comparison). Has a command table (validate, import, systems, repo-stats, collect, run, score, report, merge, compare, dashboard; review is not built), the run-folder layout (meta.json, <system>.jsonl, index.jsonl), metric definitions (file/class/function levels, IoU 0.5 with 0.3/0.7 sensitivity, recall/precision/success@k, MRR, tokens_to_first, recall@budget), and how to run on one machine and score on another with `git clone -c core.autocrlf=false`.","connects_to":["eval/pyproject.toml","eval/src/cmeval/cli.py","eval/src/cmeval/retriever.py","eval/src/cmeval/systems.py","eval/src/cmeval/tasks.py","eval/src/cmeval/labels.py","eval/src/cmeval/run.py","eval/src/cmeval/score.py","eval/src/cmeval/metrics/tokens.py","eval/src/cmeval/dashboard.py"],"component":"eval-project"},"eval/configs/baseline-v2.toml":{"bytes":2302,"lines":65,"summary":"Baseline comparison for codemem v2: the three grep baselines plus the seven cm2-* systems of codemem-v2.toml.","details":"Defines grep, grep-fn, grep-fn-plus and cm2-bm25, cm2-bm25-code, cm2-bm25-code-usage (all weights 1.0), cm2-full (test_weight 0.5, class/block weight 0.5), cm2-full-fn (kinds function+method only), cm2-full-no-tests (test_weight 0.0) and cm2-full-v1-bm25 (bm25 weights [10, 5, 1]). The codemem systems differ only at search time, so they share one index.","connects_to":["eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/grep_fn.py","eval/src/cmeval/adapters/codemem.py","eval/configs/codemem-v2.toml"],"component":"eval-configs"},"eval/configs/baseline.toml":{"bytes":987,"lines":39,"summary":"The Week 1 baseline comparison: the three grep baselines plus codemem with signals added one at a time.","details":"Defines grep, grep-fn, grep-fn-plus, and three codemem systems `cm-bm25` (signals ['bm25']), `cm-bm25-code` (['bm25','code']) and `cm-bm25-code-usage` (['bm25','code','usage']), all with config { device = 'auto' } so they share one index. These cm-* names are report.py's default PRIMARY_SYSTEMS.","connects_to":["eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/grep_fn.py","eval/src/cmeval/adapters/codemem.py","eval/src/cmeval/report.py"],"component":"eval-configs"},"eval/configs/codemem-v2-ablations.toml":{"bytes":915,"lines":16,"summary":"Index-time ablations of codemem v2; each system needs its own index (different index_key).","details":"Defines cm2-no-header (code_header = false: embed raw code without the path/scope header) and cm2-no-windows (window_chars = 1000000: one vector per chunk, truncated by the model), both with cm2-full's search-time weights, to compare against cm2-full. The comment suggests running them on a subset first with --repo.","connects_to":["eval/src/cmeval/adapters/codemem.py","eval/configs/codemem-v2.toml"],"component":"eval-configs"},"eval/configs/codemem-v2-weights.toml":{"bytes":1985,"lines":52,"summary":"Search-time weighting sweep for codemem v2's full system (bm25 + code + usage), all on one shared index.","details":"Defines cm2-ref (all weights 1.0), cm2-t05, cm2-t05-c05, cm2-t05-c05-b05 (the v2 defaults since 2026-10-24), cm2-t03-c03-b03, cm2-fn-t05 (functions/methods only, test_weight 0.5), cm2-t0 (tests never returned) and cm2-t05-v1bm25 (test_weight 0.5 with v1 BM25 weights). Names encode test (t), class (c) and block (b) weights.","connects_to":["eval/src/cmeval/adapters/codemem.py"],"component":"eval-configs"},"eval/configs/codemem-v2.toml":{"bytes":2470,"lines":54,"summary":"codemem v2 systems only, all sharing one index and differing only in search-time settings.","details":"Defines cm2-bm25, cm2-bm25-code, cm2-bm25-code-usage (signal ablations with test and class/block weights pinned to 1.0), cm2-full (all signals, test_weight 0.5, class/block 0.5, the v2 defaults), cm2-full-fn (functions and methods only), cm2-full-no-tests (test_weight 0) and cm2-full-v1-bm25 (v1 BM25 field weights [10, 5, 1]). Comments note that every system pins its weights so names keep their meaning if codemem defaults change.","connects_to":["eval/src/cmeval/adapters/codemem.py"],"component":"eval-configs"},"eval/configs/codemem-v3-full.toml":{"bytes":964,"lines":12,"summary":"The one codemem system of the fresh runs, `cm3-full`: BM25 + code + usage, neutral weights, as of 2026-10-25.","details":"Every search-time setting the eval can set is pinned to its value of that day (RRF k 60, 50 candidates per list, BM25 field weights 10/3/5/2/1, all kind and signal weights 1.0), so the name keeps its meaning if codemem's defaults change.","connects_to":["eval/src/cmeval/adapters/codemem.py","eval/configs/main-python.toml"],"component":"eval-configs"},"eval/configs/codemem-v3.toml":{"bytes":1817,"lines":40,"summary":"codemem v3 systems, all on one shared index, each pinning weights and its BM25 query rule.","details":"Defines cm3-bm25, cm3-bm25-code and cm3-full (neutral weights: test_weight 1.0, empty kind_weights, bm25 query_terms 32, common_share 0.0), cm3-full-v2-weights (test/class/block 0.5), cm3-full-all-words (bm25 query_terms 0: keep every word including stopwords) and cm3-full-drop-common (common_share 0.05: long queries drop words found in over 5% of chunks).","connects_to":["eval/src/cmeval/adapters/codemem.py"],"component":"eval-configs"},"eval/configs/fresh-candidates.toml":{"bytes":1360,"lines":67,"summary":"Not a system config: the list of 16 candidate repos for fresh tasks, read by `cmeval repo-stats --candidates`.","details":"Each `[[repo]]` table has a name and a note, e.g. home-assistant/core, vllm-project/vllm, huggingface/transformers, pytorch/pytorch, apache/airflow, ansible/ansible, getsentry/sentry, odoo/odoo, pandas-dev/pandas, ray-project/ray, python/cpython, saltstack/salt, plus non-Python kubernetes/kubernetes, microsoft/vscode, backstage/backstage and godotengine/godot. None is a SWE-bench repo.","connects_to":["eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/cli.py"],"component":"eval-configs"},"eval/configs/fresh-cpp-v1.toml":{"bytes":875,"lines":21,"summary":"Not a system config: the collection config for the fresh C++ tasks (F7), read by `cmeval collect`.","details":"Same rules as `fresh-v1.toml` (Python) so the three languages are comparable: fixes merged 2026-07-01 to 2026-10-22, issue bodies of at least 100 characters, at most 5 changed code files and 200 changed lines. Repos: duckdb, llama.cpp and Godot.","connects_to":["eval/src/cmeval/collect/candidates.py","eval/configs/fresh-v1.toml"],"component":"eval-configs"},"eval/configs/fresh-ts-v1.toml":{"bytes":774,"lines":17,"summary":"Not a system config: the collection config for the fresh TypeScript tasks (F7), read by `cmeval collect`.","details":"Same rules as `fresh-v1.toml` (Python) so the three languages are comparable: fixes merged 2026-07-01 to 2026-10-22, issue bodies of at least 100 characters, at most 5 changed code files and 200 changed lines. Repos: vscode and playwright.","connects_to":["eval/src/cmeval/collect/candidates.py","eval/configs/fresh-v1.toml"],"component":"eval-configs"},"eval/configs/fresh-v1.toml":{"bytes":970,"lines":32,"summary":"Not a system config: the collection config for the first fresh task set, read by `cmeval collect`.","details":"The `[collect]` table sets since 2026-07-01 (the freshness cutoff), until 2026-10-22, min_body_chars 100, extra_bots [], max_code_files 5 and max_code_lines 200. Seven `[[repo]]` tables: home-assistant/core, pandas-dev/pandas, vllm-project/vllm, apache/airflow, ray-project/ray, python/cpython, huggingface/transformers.","connects_to":["eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/tasks_build.py","eval/tasks/fresh-v1.jsonl","eval/tasks/fresh-v1.meta.json"],"component":"eval-configs"},"eval/configs/grep-plus.toml":{"bytes":336,"lines":10,"summary":"grep-fn-plus alone, for a quick run that is merged into an earlier run with `cmeval merge`.","details":"Defines one system, `grep-fn-plus` (grep_fn with types ['py'], idf weighting, clean_keywords, tests_last).","connects_to":["eval/src/cmeval/adapters/grep_fn.py","eval/src/cmeval/merge.py"],"component":"eval-configs"},"eval/configs/grep.toml":{"bytes":411,"lines":19,"summary":"The offline grep baselines alone.","details":"Defines `grep` (adapter grep), `grep-fn` (adapter grep_fn, naive defaults) and `grep-fn-plus` (grep_fn with types ['py'], weighting 'idf', clean_keywords and tests_last). All three share the no-index key.","connects_to":["eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/grep_fn.py"],"component":"eval-configs"},"eval/configs/main-cpp.toml":{"bytes":1131,"lines":28,"summary":"The main C++ comparison: grep, grep-fn, grep-fn-plus and `cm3-full` in one run, on `tasks/fresh-cpp-v1-68.jsonl`.","details":"grep-fn-plus (file types c, cpp, cuda, idf weighting, cleaned keywords, tests last) is the baseline of the primary tests; cm3-full is the same definition as in `codemem-v3-full.toml` (a t
