<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codemem Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5b6573; --line: #d8dde4;
  --accent: #2f6fdf; --accent-soft: #e3ecfc; --hot: #e8590c; --hot-soft: #fff0e6;
  --code-bg: #f0f2f5; --shadow: 0 1px 2px rgba(20,30,40,.06), 0 4px 14px rgba(20,30,40,.06);
  --k-external: #7048e8; --k-frontend: #1c7ed6; --k-core: #2b8a3e; --k-storage: #c2255c;
  --k-model: #e67700; --k-eval: #0c8599; --k-support: #5c677d;
  --lane: #eef1f5; --node: #ffffff; --node-line: #d3d9e1; --edge: #98a3b3; --shadow-c: rgba(20,30,40,.10); --hot-glow: rgba(232,89,12,.40);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151a; --panel: #1a1f26; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2c333d;
    --accent: #6ea0ff; --accent-soft: #1f2d47; --hot: #ff8a3d; --hot-soft: #3a2418;
    --code-bg: #222831; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    --k-external: #9775fa; --k-frontend: #4dabf7; --k-core: #51cf66; --k-storage: #f06595;
    --k-model: #ffa94d; --k-eval: #3bc9db; --k-support: #8d99ae;
    --lane: #161b22; --node: #1f2630; --node-line: #364150; --edge: #5f6b7c; --shadow-c: rgba(0,0,0,.45); --hot-glow: rgba(255,138,61,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151a; --panel: #1a1f26; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2c333d;
  --accent: #6ea0ff; --accent-soft: #1f2d47; --hot: #ff8a3d; --hot-soft: #3a2418;
  --code-bg: #222831; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --k-external: #9775fa; --k-frontend: #4dabf7; --k-core: #51cf66; --k-storage: #f06595;
  --k-model: #ffa94d; --k-eval: #3bc9db; --k-support: #8d99ae;
  --lane: #161b22; --node: #1f2630; --node-line: #364150; --edge: #5f6b7c; --shadow-c: rgba(0,0,0,.45); --hot-glow: rgba(255,138,61,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; font-size: 12.5px; }
code { background: var(--code-bg); padding: 1px 4px; border-radius: 4px; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; line-height: 1.35; margin: 8px 0; }
pre code { background: none; padding: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--panel); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 10px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
header h1 { font-size: 17px; margin: 0; min-width: 0; overflow-wrap: anywhere; }
header h1 span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
nav.tabs { display: flex; gap: 4px; }
nav.tabs a { padding: 6px 12px; border-radius: 6px; color: var(--muted); font-weight: 500; white-space: nowrap; }
nav.tabs a.on { background: var(--accent-soft); color: var(--accent); }
nav.tabs a:hover { text-decoration: none; color: var(--ink); }
.search { position: relative; flex: 1; min-width: 200px; max-width: 460px; margin-left: auto; }
.search input { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--ink); font: inherit; }
.search .results { position: absolute; top: 38px; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; display: none; }
.search .results.open { display: block; }
.search .results a { display: block; padding: 7px 10px; color: var(--ink); border-bottom: 1px solid var(--line); }
.search .results a:hover, .search .results a.sel { background: var(--accent-soft); text-decoration: none; }
.search .results small { color: var(--muted); display: block; }
button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 6px; padding: 5px 10px; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .4; cursor: default; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 16px; padding-block: 16px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); align-items: start; }
.main { min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px 18px; }
.side { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 86px); overflow-y: auto; }
.side:empty { display: none; }
/* The map and the flows use the whole width; component and file pages keep the side panel. */
body.wide .layout { grid-template-columns: minmax(0, 1fr); }
body.wide .side { display: none; }
.intro { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 24px; }
.intro .howto { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 4px 14px 8px; }
@media (max-width: 900px) { .intro { grid-template-columns: minmax(0, 1fr); } }
h2 { font-size: 18px; margin: 0 0 4px; }
h3 { font-size: 14px; margin: 18px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.lead { color: var(--muted); margin: 0 0 10px; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--accent); }
.pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor;
  white-space: nowrap; vertical-align: 1px; }
.prose p { margin: 6px 0; }
.prose ul { margin: 6px 0; padding-left: 20px; }
.prose li { margin: 2px 0; }
/* system map */
.diagram-wrap { position: relative; }
svg.diagram { width: 100%; height: auto; display: block; margin: 0 auto; user-select: none; -webkit-user-select: none; }
svg .lane rect { fill: var(--lane); }
svg .lane text { fill: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .1em; }
svg .node { cursor: pointer; outline: none; }
svg .node .box { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; filter: drop-shadow(0 2px 4px var(--shadow-c)); transition: stroke .15s, fill .15s; }
svg .node .title { fill: var(--ink); font-size: 18px; font-weight: 650; }
svg .node .sub { fill: var(--muted); font-size: 13px; }
svg .node .chev { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
svg .node:hover .box, svg .node:focus-visible .box { stroke: var(--accent); stroke-width: 2.5; }
svg .node:hover .chev { stroke: var(--accent); opacity: 1; }
svg .node.dim { opacity: .5; }
svg .node.hot .box { stroke: var(--hot); stroke-width: 3; fill: var(--hot-soft); filter: drop-shadow(0 0 12px var(--hot-glow)); }
svg .edge path { fill: none; stroke: var(--edge); stroke-width: 2; }
svg .pill rect { fill: var(--panel); stroke: var(--node-line); stroke-width: 1; }
svg .pill text { fill: var(--muted); font-size: 12.5px; font-weight: 500; }
svg .edge.dim, svg .pill.dim { opacity: .3; }
svg .edge.hot path { stroke: var(--hot); stroke-width: 3; stroke-dasharray: 9 7; animation: flow .9s linear infinite; }
svg .pill.hot rect { fill: var(--hot); stroke: var(--hot); }
svg .pill.hot text { fill: #fff; font-weight: 650; }
@keyframes flow { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { svg .edge.hot path { animation: none; } }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin-top: 12px; justify-content: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
/* factory floor: children + files */
.floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.floor.pipeline { display: flex; flex-wrap: wrap; align-items: stretch; gap: 0; row-gap: 12px; }
.floor.pipeline .card { flex: 1 1 200px; max-width: 320px; }
.floor.pipeline .arrow { flex: 0 0 34px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; cursor: pointer;
  position: relative; transition: border-color .15s, transform .15s; overflow: hidden; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.card .k { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.card b { display: block; margin-bottom: 2px; }
.card .meta { color: var(--muted); font-size: 12px; }
.card p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.card .count { position: absolute; right: 10px; top: 10px; font-size: 11px; color: var(--muted); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.file { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; cursor: pointer; background: var(--panel); }
.file:hover { border-color: var(--accent); }
.file.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.file .mono { font-weight: 600; word-break: break-all; }
.file p { margin: 3px 0 0; color: var(--muted); font-size: 12.5px; }
/* detail panel */
.detail h2 { word-break: break-all; }
.detail .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; color: var(--muted); font-size: 12.5px; }
.sym { border-top: 1px solid var(--line); padding: 6px 0; }
.sym:first-child { border-top: 0; }
.sym .mono { font-weight: 600; }
.sym small { color: var(--muted); }
ul.plain { list-style: none; padding: 0; margin: 4px 0; }
ul.plain li { padding: 3px 0; }
.close { float: right; border: 0; background: none; font-size: 18px; color: var(--muted); padding: 0 4px; }
/* flows */
.flowtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.flowtabs a { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-weight: 500; }
.flowtabs a:hover { border-color: var(--accent); text-decoration: none; }
.flowtabs a.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.flowbody { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 16px; align-items: start; }
.steppanel .flowintro { color: var(--muted); font-size: 13px; }
.stepcount { color: var(--muted); font-size: 12.5px; margin-left: auto; }
.mappanel { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); padding: 12px; }
.mapbtn { position: absolute; top: 10px; right: 12px; z-index: 2; font-size: 12.5px; padding: 4px 10px; background: var(--panel); }
.flowbody.big { grid-template-columns: minmax(0, 1fr); }
.flowbody.big .steppanel { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); column-gap: 28px; }
.flowbody.big .steppanel > h2, .flowbody.big .steppanel > .flowintro, .flowbody.big .steppanel > .stepbar, .flowbody.big .steppanel > .step { grid-column: 1; }
.flowbody.big .steppanel > h3, .flowbody.big .steppanel > ol, .flowbody.big .steppanel > .refs { grid-column: 2; }
.flowbody.big .steppanel > h3:first-of-type { grid-row: 1; }
.flowbody.big .steppanel > ol { grid-row: 2 / span 3; align-self: start; }
.flowbody.big .mappanel { position: static; }
.flowbody.big .flowmap svg { max-height: none; }
.flowmap svg { max-height: calc(100vh - 150px); }
ol.steplist { padding-left: 22px; margin: 4px 0; font-size: 13px; }
ol.steplist li { padding: 2px 0; }
ol.steplist li.on a { color: var(--hot); font-weight: 650; }
.refs.parts { color: var(--muted); font-size: 12.5px; align-items: center; }
.stepbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.dots { display: flex; gap: 4px; flex-wrap: wrap; }
.dots a { width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: flex; align-items: center;
  justify-content: center; font-size: 11px; color: var(--muted); }
.dots a.on { background: var(--hot); border-color: var(--hot); color: #fff; }
.dots a:hover { text-decoration: none; border-color: var(--hot); }
.step { border-left: 3px solid var(--hot); padding: 4px 0 4px 14px; }
.step h3 { color: var(--ink); text-transform: none; letter-spacing: 0; font-size: 16px; margin: 0 0 4px; }
.refs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.refs a { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--code-bg); padding: 2px 7px; border-radius: 5px; }
/* big picture: a five-step walkthrough for presenting */
/* A narrow, compact control card and the map as large as the screen allows. */
.bp { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 12px; align-items: start; }
.bp-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; }
.bp-head h2 { font-size: 18px; margin: 0; }
.bp-head p { color: var(--muted); margin: 0; flex: 1 1 300px; min-width: 0; font-size: 13px; }
.bp-head button { font-size: 12.5px; padding: 4px 10px; }
.stepper { grid-column: 1 / -1; display: flex; }
.stepper a { flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 0; }
.stepper a:hover { text-decoration: none; color: var(--ink); }
.stepper a:not(:last-child)::after { content: ""; position: absolute; top: 14px; left: calc(50% + 18px); right: calc(-50% + 18px);
  height: 2px; background: var(--line); }
.stepper a.done::after { background: var(--hot); }
.stepper i { font-style: normal; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--line); background: var(--panel); font-size: 12.5px; transition: background .2s, border-color .2s; }
.stepper a.done i { border-color: var(--hot); color: var(--hot); }
.stepper a.on i { background: var(--hot); border-color: var(--hot); color: #fff; box-shadow: 0 0 0 4px var(--hot-soft); }
.stepper a.on { color: var(--ink); }
.bp-card { position: sticky; top: calc(70px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
.bp-body { display: flex; flex-direction: column; gap: 8px; animation: rise .35s ease-out; }
.bp-body .num { color: var(--hot); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.bp-body h3 { font-size: 18px; line-height: 1.25; color: var(--ink); text-transform: none; letter-spacing: 0; margin: 0; text-wrap: balance; }
.bp-body .say { font-size: 14px; line-height: 1.45; margin: 0; }
.bp-body ul { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.45; display: grid; gap: 5px; color: var(--muted); }
.bp-body code { font-size: 12px; }
.bp-fig { display: flex; align-items: baseline; gap: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.bp-fig b { font-size: 24px; line-height: 1; color: var(--hot); font-variant-numeric: tabular-nums; }
.bp-fig span { color: var(--muted); font-size: 12.5px; }
.bp-nav { display: flex; gap: 6px; flex-wrap: wrap; }
.bp-nav button { padding: 6px 12px; font-size: 13.5px; }
.bp-map { padding: 6px; }
.bp-map .legend { margin-top: 4px; font-size: 12px; }
.bp-map svg { max-height: calc(100vh - 170px); }
body.presenting header, body.presenting footer { display: none; }
body.presenting .bp-card { top: 16px; }
body.presenting .bp-map svg { max-height: calc(100vh - 110px); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .bp-body { animation: none; } }
/* Narrower screens: the card becomes a short strip above the map (title and buttons left, points right). */
@media (max-width: 1100px) {
  .bp { grid-template-columns: minmax(0, 1fr); }
  .bp-card { position: static; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 4px 20px; align-items: start; }
  .bp-body { display: contents; }
  .bp-body .num { grid-column: 1; }
  .bp-body h3 { grid-column: 1; }
  .bp-body .say { grid-column: 1; }
  .bp-body ul { grid-column: 2; grid-row: 1 / span 4; align-self: center; }
  .bp-fig { display: none; }
  .bp-nav { grid-column: 1; margin-top: 4px; }
}
@media (max-width: 700px) {
  .bp-card { grid-template-columns: minmax(0, 1fr); }
  .bp-body ul { grid-column: 1; grid-row: auto; }
}
/* tree */
.tree { font-size: 13px; }
.tree details { margin-left: 14px; }
.tree > details { margin-left: 0; }
.tree summary { cursor: pointer; padding: 2px 0; color: var(--ink); }
.tree summary small { color: var(--muted); }
.tree .leaf { margin-left: 30px; padding: 2px 0; display: flex; gap: 8px; align-items: baseline; }
.tree .leaf a { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.tree .leaf small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
.toolbar input { padding: 6px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); font: inherit; min-width: 240px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 12px 0; }
.stat { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; }
.stat b { font-size: 20px; display: block; }
.stat span { color: var(--muted); font-size: 12px; }
footer { color: var(--muted); font-size: 12px; padding-block: 4px 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
@media (max-width: 1100px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; max-height: none; }
  .flowbody { grid-template-columns: minmax(0, 1fr); }
  .mappanel { position: static; }
}
@media (max-width: 600px) {
  header { padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .layout { padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  footer { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .search { max-width: none; }
  nav.tabs { gap: 0; flex-wrap: wrap; }
  nav.tabs a { padding: 6px 8px; }
}
</style>
</head>
<body>
<header>
  <h1>codemem Explorer <span id="ver"></span></h1>
  <nav class="tabs">
    <a data-tab="map" href="#/">System map</a>
    <a data-tab="big" href="#/big/0">Big picture</a>
    <a data-tab="flows" href="#/flows">Data flows</a>
    <a data-tab="files" href="#/files">All files</a>
  </nav>
  <div class="search">
    <input id="q" type="search" placeholder="Search components, files, functions, flow steps…  ( / )" autocomplete="off">
    <div class="results" id="qres"></div>
  </div>
  <button id="theme" title="Toggle light/dark">◐</button>
</header>
<div class="layout">
  <div class="main" id="main"></div>
  <aside class="side panel" id="side"></aside>
</div>
<footer id="foot"></footer>
<script id="data" type="application/json">{"title":"codemem, end to end","intro":"codemem is a local code search tool for coding agents. It cuts every source file of a repository into functions, classes and blocks, and remembers three things about each: its **words** (keywords), its **meaning** (an embedding of its code) and **who calls it** (an embedding of its callers and tests). An agent asks in plain words over MCP and gets a short ranked list of places in the code.\nThis page maps **every file** in the repo onto the parts of the system. Click a box to open it: parts open into smaller parts and finally into files, each with what it does and what it connects to. The **Data flows** tab walks through what happens, step by step, from setting up an agent to a search.","howto":"- **System map:** each box is a part of the system; arrows show what calls or feeds what. Click a box.\n- **Inside a part:** its sub-parts (in order, when data moves through them), then its files. Click a file for its description, its main functions, and links to the files it connects to.\n- **Data flows:** pick a flow and press Next or Play; the boxes involved light up.\n- **All files:** the whole repo as a tree, with a filter.\n- Press `/` to search everything: components, files, function names, flow steps.","folders":"- `src/codemem/`: the library, the MCP server and the CLI.\n- `src/codemem/languages/`: one tree-sitter spec per language.\n- `tests/`: the codemem test suite; `tests/fixtures/` holds small repos it indexes.\n- `eval/`: `cmeval`, the evaluation harness, a separate uv project with its own tests, configs, task sets and committed results.\n- `docs/`: design docs.\n- `scripts/`: benchmark and comparison scripts.","kinds":{"external":"Outside codemem","frontend":"Front-ends","core":"Core library","model":"Embeddings","storage":"Storage","eval":"Evaluation","support":"Tests, docs, project"},"canvas":[1300,724],"lanes":[{"label":"Who uses it","y":24},{"label":"Front-ends","y":172},{"label":"Engine","y":320},{"label":"Pipelines","y":468},{"label":"Storage","y":616}],"lane_h":84,"edges":[{"from":"agents","to":"mcp","label":"MCP · stdio","both":true},{"from":"setup","to":"agents","label":"writes .mcp.json"},{"from":"people","to":"cli","label":"codemem …"},{"from":"cli","to":"setup","label":"init"},{"from":"mcp","to":"service","label":"tool calls"},{"from":"cli","to":"service","label":"commands"},{"from":"eval","to":"service","label":"update() + search()"},{"from":"repo","to":"service","label":"file events"},{"from":"service","to":"indexer","label":"stage A → B"},{"from":"service","to":"search","label":"catch up → search"},{"from":"config","to":"service","label":"settings"},{"from":"indexer","to":"embeddings","label":"embed texts"},{"from":"search","to":"embeddings","label":"embed query"},{"from":"indexer","to":"store","label":"writes"},{"from":"search","to":"store","label":"reads"}],"flows":[{"id":"setup","name":"Connect an agent","summary":"codemem init → agent configs → the agent launches codemem mcp","intro":"How an agent gets codemem's tools. codemem never runs inside the agent: `init` writes a config entry with a command line, and the agent starts that command itself at the beginning of every session.","files":["src/codemem/cli.py","src/codemem/agents.py","src/codemem/__main__.py","src/codemem/server.py","src/codemem/prompts.py"],"steps":[{"title":"You run `codemem init`","text":"`codemem init [PATH] --agents claude,cursor,codex` (default: `claude`). `cmd_init` finds the repo root (the nearest folder with `.git`) and loads its config, which also gives the **steering** level for the agent-facing text.","nodes":["people","cli"],"edges":[["people","cli"]],"refs":["src/codemem/cli.py::cmd_init","src/codemem/config.py::load_config"]},{"title":"Choose the command agents will run","text":"`launch_command()` uses `codemem` if it is on PATH (a `uv tool` or `pipx` install). Otherwise it falls back to `<this python> -m codemem`, which works through `__main__.py` as long as that environment exists, and `init` warns about it.","nodes":["setup"],"edges":[["cli","setup"]],"refs":["src/codemem/agents.py::launch_command","src/codemem/__main__.py"]},{"title":"Plan one change per agent","text":"`plan()` returns a list of actions:\n- **Claude Code:** add `mcpServers.codemem = {command, args: [..., \"mcp\"]}` to `<repo>/.mcp.json`. No path argument: Claude Code starts project servers in the project root.\n- **Cursor:** the same entry in `<repo>/.cursor/mcp.json`, with `${workspaceFolder}` as the path.\n- **Codex:** only a printed `[mcp_servers.codemem]` snippet for `~/.codex/config.toml`; codemem never edits global files.\nOther servers already in a JSON file are kept; an invalid JSON file makes `init` refuse.","nodes":["setup"],"edges":[],"refs":["src/codemem/agents.py::plan","src/codemem/agents.py::_merge_mcp_json"]},{"title":"Ask, then write","text":"`init` prints the plan and asks `Write N file(s)? [y/N]` (skip with `-y`; `--dry-run` writes nothing). `--write-agent-notes` also appends a short \"Code search\" note to `CLAUDE.md` or `AGENTS.md`, worded at the steering level.","nodes":["setup","agents"],"edges":[["setup","agents"]],"refs":["src/codemem/agents.py::apply","src/codemem/prompts.py::agent_notes"]},{"title":"Build the index (and download the model)","text":"`init` then runs the same work as `codemem index`: a full build, which downloads the ~1 GB embedding model on first use. With `--no-index` it only downloads and warms the model, so the agent's first search doesn't wait for the download.","nodes":["cli","service","indexer","embeddings","store"],"edges":[["cli","service"],["service","indexer"],["indexer","embeddings"],["indexer","store"]],"refs":["src/codemem/cli.py::cmd_index","src/codemem/indexer.py::Indexer.update"]},{"title":"The agent starts `codemem mcp` in each session","text":"From now on, each time a session opens, the agent launches the configured command, `codemem mcp`, and talks MCP to it over stdin/stdout. Continue with the flow {{flow-session|An agent session starts}}.","nodes":["agents","mcp"],"edges":[["agents","mcp"]],"refs":["src/codemem/cli.py::cmd_mcp","src/codemem/server.py::run_stdio"]}]},{"id":"session","name":"An agent session starts","summary":"handshake at once; index check, watcher and model load in the background","intro":"What happens between the agent launching `codemem mcp` and its first search. The rule: never make the agent wait for index work to *start*.","files":["src/codemem/server.py","src/codemem/service.py","src/codemem/watcher.py","src/codemem/prompts.py"],"steps":[{"title":"The agent launches the server","text":"The agent spawns `codemem mcp` with pipes for stdin and stdout. `run_stdio()` sends all logging to **stderr** (stdout carries protocol messages only) and creates a `CodememService` for the repo, which opens the index folder `~/.codemem/indexes/<repo>-<hash>/`.","nodes":["agents","mcp","service"],"edges":[["agents","mcp"],["mcp","service"]],"refs":["src/codemem/server.py::run_stdio","src/codemem/service.py::CodememService"]},{"title":"Background work starts","text":"`service.start()` asks for a full check of the repo against the index (or a first build), starts the single **writer** thread, starts the **watcher** on the repo (and the git folder), and loads the embedding model and the FAISS indexes in a background thread. None of this blocks.","nodes":["service","embeddings","store"],"edges":[["service","search"]],"refs":["src/codemem/service.py::CodememService.start","src/codemem/watcher.py::RepoWatcher"]},{"title":"Tools and instructions are registered","text":"`build_server()` creates `MCPServer(name=\"codemem\", instructions=...)` and registers `search_code`, `get_chunk`, `index_status` and `refresh_index`. Every description and the instructions come from `prompts.py`, at the configured steering level (`none`, `light` or `strong`).","nodes":["mcp"],"edges":[],"refs":["src/codemem/server.py::build_server","src/codemem/prompts.py::server_instructions","src/codemem/prompts.py::tool_description"]},{"title":"The handshake is answered at once","text":"The MCP `initialize` exchange completes immediately. The agent now lists the four tools and reads their descriptions, and from here decides by itself when to call them.","nodes":["agents","mcp"],"edges":[["agents","mcp"]],"refs":["src/codemem/server.py::build_server"]},{"title":"The writer catches the index up","text":"Meanwhile the writer runs the full check: every file's size and date are compared with the index, changed ones are hashed and re-chunked. On a repo seen before this takes well under a second; the first time it is a full build, mostly embedding.","nodes":["repo","service","indexer","store"],"edges":[["service","indexer"],["indexer","store"]],"refs":["src/codemem/indexer.py::Indexer.scan","src/codemem/indexer.py::Indexer.structure"]},{"title":"Searches during the first build","text":"Until the first build finishes, `search_code` answers with what exists so far and a notice (`index is still being built (N% done)`), or says the index is not available yet if there is nothing to search.","nodes":["mcp","service"],"edges":[["agents","mcp"]],"refs":["src/codemem/prompts.py::indexing_notice","src/codemem/server.py::search_code"]}]},{"id":"search","name":"An agent searches","summary":"search_code → catch up → BM25 + vectors → RRF → cards","intro":"Follow the running example: the issue *\"Disabled users stay logged in\"*. The fix belongs in `revoke_session` (`auth/sessions.py`), which shares no word with the query. codemem finds it through its neighbours: `disable_user` and `logout` call it, and `test_disabled_user_loses_sessions` tests it.","files":["src/codemem/server.py","src/codemem/service.py","src/codemem/search.py","src/codemem/store.py","src/codemem/render.py","src/codemem/tokenize.py","src/codemem/embedder.py"],"steps":[{"title":"The agent calls `search_code`","text":"`search_code(query=\"disabled users stay logged in\", k=10)`. The server clamps `k` to 1..50 and checks the optional filters `path_prefix`, `kinds` (function, method, class, block) and `tests` (include, exclude, only).","nodes":["agents","mcp"],"edges":[["agents","mcp"]],"refs":["src/codemem/server.py::search_code"]},{"title":"Catch up: have all earlier saves been seen?","text":"`CodememService.search` gives itself a 4 s budget and calls `catch_up()`. The watcher's **barrier** writes a marker file and waits (≤ 0.25 s) for its own event: file events arrive in order, so once it is back, every earlier save has been noticed. Waiting paths are handed to the writer.","nodes":["service"],"edges":[["mcp","service"]],"refs":["src/codemem/service.py::CodememService.catch_up","src/codemem/watcher.py::RepoWatcher.barrier"]},{"title":"Wait for stage A of those saves","text":"The writer applies stage A (structure) for the handed-over paths: milliseconds per file. After this, keywords, names, line numbers, call links and the code `get_chunk` shows are current.","nodes":["service","indexer"],"edges":[["service","indexer"]],"refs":["src/codemem/service.py::CodememService._step","src/codemem/indexer.py::Indexer.structure"]},{"title":"Embed the newest edits itself","text":"If chunks wait for new vectors (and there are at most 1,000), the search pauses the writer's embedding and runs `embed_pending()` itself, newest edits first, until the queue is empty or the 4 s are up. A one-function edit takes 0.1–0.5 s.","nodes":["indexer","embeddings"],"edges":[["indexer","embeddings"]],"refs":["src/codemem/indexer.py::Indexer.embed_pending"]},{"title":"Ranking 1: keywords (BM25)","text":"The query is split into words the same way code was (identifiers split and kept whole; stopwords like \"in\" dropped) and matched with FTS5 BM25 over five fields, weighted name 10, signature 5, path 3, doc 2, code 1. The top hit is `test_disabled_user_loses_sessions`; `revoke_session` isn't in the list at all: it shares no word.","nodes":["search","store"],"edges":[["service","search"],["search","store"]],"refs":["src/codemem/search.py::bm25_match","src/codemem/store.py::Store.bm25_search","src/codemem/tokenize.py"]},{"title":"Ranking 2 and 3: meaning (vectors)","text":"The query is embedded once (`embed_queries`) and compared with every **code** vector and, separately, every **usage** vector, in FAISS. `revoke_session` ranks low by its code but 2nd by usage: its usage text says *called by disable_user … tested by test_disabled_user_loses_sessions*.","nodes":["search","embeddings","store"],"edges":[["search","embeddings"],["search","store"]],"refs":["src/codemem/embedder.py::Embedder.embed_queries","src/codemem/store.py::Store.vector_search"]},{"title":"Merge by rank (RRF)","text":"Each list contributes its top 50, and each adds `weight / (60 + rank)` to a chunk's score. Ranks are merged, not raw scores, because BM25 scores and vector similarities aren't comparable. Optional kind and test weights apply; equal scores are ordered by location, so every machine gives the same order.","nodes":["search"],"edges":[],"refs":["src/codemem/search.py::rrf","src/codemem/search.py::_pick_top"]},{"title":"Cards and a freshness note go back","text":"`format_results` prints numbered cards: `3. auth/sessions.py:19-20  revoke_session  [id 14]`, the signature, first doc line and a few lines of code (for a long function, its best-matching window). If something couldn't be caught up in time, a last `Note:` names those files so the agent can search again or grep them.","nodes":["search","mcp","agents"],"edges":[["mcp","agents"]],"refs":["src/codemem/render.py::format_results","src/codemem/render.py::freshness_note","src/codemem/search.py::make_card"]},{"title":"The agent opens a result with `get_chunk`","text":"`get_chunk(\"14\")` (or `auth/sessions.py:19`, or `auth/sessions.py::revoke_session`) runs the catch-up without embedding, then returns the full code with its callers and callees from the call graph. A long class is shown as its outline.","nodes":["agents","mcp","service","store"],"edges":[["agents","mcp"],["mcp","service"]],"refs":["src/codemem/service.py::CodememService.get_chunk","src/codemem/render.py::format_chunk"]}]},{"id":"save","name":"A save becomes searchable","summary":"watcher → debounce → stage A (structure) → stage B (meaning)","intro":"The core of the design: an agent searches right after its own edits, so that is exactly when the index must be current. Every update runs in two stages: a fast one for structure that searches always wait for, and a slow one for meaning that runs behind it.","files":["src/codemem/watcher.py","src/codemem/service.py","src/codemem/indexer.py","src/codemem/chunker.py","src/codemem/callgraph.py","src/codemem/texts.py","src/codemem/vectorcache.py","src/codemem/embedder.py","src/codemem/store.py"],"steps":[{"title":"A file is saved","text":"The agent (or you) saves `auth/sessions.py`. The **watcher** gets the OS file event through watchdog and keeps source files, folders and deletions; it ignores the index folder and folders like `.venv`. A change to `.gitignore`, `.codemem.toml` or the git branch asks for a full check instead.","nodes":["repo","service"],"edges":[["repo","service"]],"refs":["src/codemem/watcher.py::RepoWatcher.seen"]},{"title":"Saves are batched","text":"The **debouncer** collects paths until saves stop for 0.5 s, or for at most 2 s while they keep coming, then hands the batch to `notify()`. More than 2,000 paths at once turn into a full check.","nodes":["service"],"edges":[],"refs":["src/codemem/watcher.py::Debouncer","src/codemem/service.py::CodememService.notify"]},{"title":"Stage A: find what really changed","text":"The writer thread takes the batch and runs `Indexer.structure`. `scan_paths` reads and hashes each file; a file whose content hash didn't change is left alone.","nodes":["service","indexer"],"edges":[["service","indexer"]],"refs":["src/codemem/service.py::CodememService._step","src/codemem/indexer.py::Indexer.scan_paths"]},{"title":"Stage A: re-chunk and match by key","text":"The file is parsed with tree-sitter using its **language spec**, and old and new chunks are matched by key (`auth/sessions.py::revoke_session`): same content and lines → untouched; only moved → line numbers shifted; new or changed → rewritten, with its keyword row and calls.","nodes":["chunking","languages","indexer","store"],"edges":[["indexer","store"]],"refs":["src/codemem/chunker.py::chunk_source","src/codemem/languages/__init__.py::get_language","src/codemem/indexer.py::Indexer._apply_file","src/codemem/store.py::Store.upsert_chunk"]},{"title":"Stage A: relink and queue, in one transaction","text":"Only calls that can change are relinked: those made by new or changed chunks, and calls to names that appeared or disappeared. Then every chunk whose texts may have changed is queued in `dirty_texts` with a sequence number, and the transaction commits. Milliseconds in total; the edit is now searchable by keywords.","nodes":["callgraph","store"],"edges":[["indexer","store"]],"refs":["src/codemem/indexer.py::Indexer._relink","src/codemem/callgraph.py::resolve_edges","src/codemem/store.py::Store.mark_dirty"]},{"title":"Stage B: rebuild texts, keep only real changes","text":"The writer takes queued chunks, newest first, builds their **code** and **usage** texts (long code is cut into overlapping windows) and keeps only texts whose hash changed. Texts have no line numbers, so code that only moved keeps its vectors.","nodes":["texts","indexer"],"edges":[],"refs":["src/codemem/indexer.py::Indexer._take","src/codemem/texts.py::build_parts","src/codemem/store.py::Store.caller_refs"]},{"title":"Stage B: get vectors, cheapest first","text":"For each changed text: a vector this index already has for the same text → the machine-wide **vector cache** → only then the embedding model (outside the write lock, in calls of up to 256 texts, longest first). New model outputs go into the cache.","nodes":["embeddings"],"edges":[["indexer","embeddings"]],"refs":["src/codemem/store.py::Store.find_vectors","src/codemem/vectorcache.py::VectorCache","src/codemem/embedder.py::make_embedder","src/codemem/indexer.py::Indexer._compute"]},{"title":"Stage B: store them safely","text":"Vectors are written unless the chunk was edited again meanwhile (its queue sequence changed; then it stays queued for its newest version). The in-memory FAISS index is patched after the commit, and the vector type's epoch is bumped so other processes catch up.","nodes":["store"],"edges":[["indexer","store"]],"refs":["src/codemem/indexer.py::Indexer._put","src/codemem/store.py::Store.put_vectors","src/codemem/store.py::Store.clear_dirty"]},{"title":"Housekeeping","text":"After 30 s without changes the FAISS files are written to disk (not on every save: on a big repo that would block searches for seconds). A safety full check runs every 5 minutes, or every 10 s when file events don't work. A failed stage A is retried and shown in `index_status`.","nodes":["service","store"],"edges":[],"refs":["src/codemem/store.py::Store.save_vectors","src/codemem/service.py::CodememService"]}]},{"id":"build","name":"Build an index from scratch","summary":"codemem index: walk → chunk → link → embed → save","intro":"What `codemem index` (and the eval) does. Unlike the MCP server, it runs stage A and then all of stage B before returning, and writes the search index to disk, so the index is complete when it returns.","files":["src/codemem/cli.py","src/codemem/indexer.py","src/codemem/config.py","src/codemem/chunker.py","src/codemem/callgraph.py","src/codemem/texts.py","src/codemem/embedder.py","src/codemem/store.py"],"steps":[{"title":"Take the write lock","text":"`cmd_index` runs `Indexer.update()`, which takes the in-process lock and the cross-process OS lock on `<index>/write.lock` (one writer at a time; others wait up to 30 s).","nodes":["people","cli","indexer"],"edges":[["people","cli"],["cli","service"],["service","indexer"]],"refs":["src/codemem/cli.py::cmd_index","src/codemem/indexer.py::Indexer.update","src/codemem/store.py::IndexLock"]},{"title":"Compare settings with the index","text":"The index records `Config.index_settings()`. If they changed, only what that setting affects is redone: a new model re-embeds that vector set, a new chunker rebuilds everything. An unknown change means a full rebuild.","nodes":["indexer","config"],"edges":[],"refs":["src/codemem/indexer.py::Indexer._changed_tiers","src/codemem/config.py::Config"]},{"title":"Walk the repo","text":"List every file in a supported language, respecting `.gitignore`, always-skipped folders (`.git`, `.venv`, `node_modules`, …), default ignores (`vendor/`, `*.min.js`, protobuf output) and config ignores. Binary, generated, minified and oversized files are recorded as **skipped, with a reason**: nothing is skipped silently.","nodes":["repo","indexer"],"edges":[],"refs":["src/codemem/indexer.py::Indexer.scan","src/codemem/indexer.py::skip_reason","src/codemem/config.py"]},{"title":"Chunk every file","text":"Each file goes through tree-sitter and its language spec into functions, methods, classes and blocks (at most 200 lines). One file that fails to parse is logged and doesn't stop the build.","nodes":["chunking","languages"],"edges":[["indexer","store"]],"refs":["src/codemem/chunker.py::chunk_source","src/codemem/languages/spec.py::LanguageSpec","src/codemem/schema.py::Chunk"]},{"title":"Link every call","text":"On a full build every call is resolved at once and the whole edge table replaced. Names defined more than 5 times get no links; links stay within a language family.","nodes":["callgraph","store"],"edges":[["indexer","store"]],"refs":["src/codemem/callgraph.py::resolve_edges","src/codemem/store.py::Store.replace_edges"]},{"title":"Queue everything, commit","text":"Every chunk is marked dirty and the structure commits. From this moment the index is searchable by keywords.","nodes":["store"],"edges":[],"refs":["src/codemem/store.py::Store.mark_all_dirty"]},{"title":"Embed in big batches","text":"Stage B runs to the end: 512 queued chunks at a time, model calls of 256 texts sorted longest first to reduce padding, vectors from the cache whenever possible. This is nearly all of the build time: the local model does about 8.5 texts a second on an M1 laptop.","nodes":["texts","embeddings"],"edges":[["indexer","embeddings"]],"refs":["src/codemem/indexer.py::Indexer.embed_pending","src/codemem/texts.py::build_parts","src/codemem/embedder.py::SentenceTransformerEmbedder"]},{"title":"Save the search index","text":"The FAISS indexes (2 bytes per number) are written next to `index.db` with a small note, and the run's statistics are stored in `meta`. If the FAISS files are ever lost they are rebuilt from the vectors table, without the model.","nodes":["store"],"edges":[["indexer","store"]],"refs":["src/codemem/store.py::Store.save_vectors","src/codemem/indexer.py::Indexer.finish"]},{"title":"Optional: verify","text":"`codemem index --verify` builds a fresh index in a temporary folder and compares every link and text with the incremental one; any difference is reported and the command exits 1.","nodes":["indexer"],"edges":[],"refs":["src/codemem/indexer.py::Indexer.verify"]}]},{"id":"eval","name":"Measure retrieval (cmeval)","summary":"tasks → systems at each commit → hits → scores → report","intro":"How the team measures codemem. The eval calls codemem as a library, so every update finishes before any search, and grades results only by location: the returned line ranges against the lines the real fix changed.","files":["eval/src/cmeval/cli.py","eval/src/cmeval/run.py","eval/src/cmeval/adapters/codemem.py","eval/src/cmeval/score.py","eval/src/cmeval/report.py","eval/src/cmeval/labels.py"],"steps":[{"title":"Build tasks","text":"A task is one issue text (the query), the commit it was filed against, and the gold files, classes, functions and lines of its fix. `cmeval import swebench-verified` takes 50 SWE-bench Verified tasks, balanced across repos; `cmeval collect` builds fresh ones from GitHub PRs merged after a cutoff, with the issue text as it was when the fix was opened.","nodes":["eval-tasks"],"edges":[],"refs":["eval/src/cmeval/importers/swebench.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/tasks.py"]},{"title":"Label the gold lines","text":"The fix's diff is aligned to the base commit and each changed line is mapped to the innermost function or class around it, with cmeval's own tree-sitter finder, not codemem's chunker, so a codemem bug can't grade itself. New code that didn't exist before is marked unretrievable.","nodes":["eval-tasks"],"edges":[],"refs":["eval/src/cmeval/labels.py","eval/src/cmeval/patches.py"]},{"title":"Choose the systems","text":"A TOML config lists `[[system]]` tables: codemem with given signals and weights, grep baselines. Systems with the same index settings share one index.","nodes":["eval-configs","eval-run"],"edges":[],"refs":["eval/configs/baseline.toml","eval/src/cmeval/systems.py"]},{"title":"Check out each task's commit","text":"`cmeval run` groups tasks by repo and orders them by commit time. A worktree is moved to each task's base commit, and its HEAD is checked before any index or search, so no future code leaks in.","nodes":["eval-run"],"edges":[],"refs":["eval/src/cmeval/run.py","eval/src/cmeval/repos.py"]},{"title":"Build or update the index","text":"The first system of an index group builds (`CodememService.update(full=True)`), later tasks update incrementally, so only changed files re-embed. The adapter records seconds, size, chunks and items re-embedded.","nodes":["eval-adapters","service","indexer","store"],"edges":[["eval","service"],["service","indexer"],["indexer","store"]],"refs":["eval/src/cmeval/adapters/codemem.py","src/codemem/service.py::CodememService.update"]},{"title":"Search and record the hits","text":"After an untimed warm-up, each system searches with the issue text (k = 50); the time, and each hit's location and the exact text an agent would read, are written to `<system>.jsonl`.","nodes":["eval-adapters","search","embeddings"],"edges":[["eval","service"],["service","search"],["search","store"],["search","embeddings"]],"refs":["eval/src/cmeval/adapters/codemem.py","src/codemem/search.py::search","src/codemem/render.py::format_results"]},{"title":"Score","text":"`cmeval score` grades hits at file, class and function level (function: same path and line overlap ≥ 0.5), computes recall, precision, success and MRR at several k, tokens until the first right answer (Anthropic token counts), and latency and index costs.","nodes":["eval-score"],"edges":[],"refs":["eval/src/cmeval/score.py","eval/src/cmeval/metrics/matching.py","eval/src/cmeval/metrics/accuracy.py","eval/src/cmeval/metrics/tokens.py","eval/src/cmeval/metrics/latency.py"]},{"title":"Report and compare","text":"`cmeval report` writes `report.md` with bootstrap confidence intervals and paired Wilcoxon tests against a baseline, Holm-corrected over the pre-registered primary tests. `cmeval compare` checks that an updated index gives the same results as one rebuilt from scratch.","nodes":["eval-report","eval-results"],"edges":[],"refs":["eval/src/cmeval/report.py","eval/src/cmeval/metrics/stats.py","eval/src/cmeval/compare.py","eval/results/2026-10-23-dev50-final/report.md"]},{"title":"Watch long jobs","text":"Long jobs write a status file every 2 s; `cmeval dashboard` serves a read-only local page (127.0.0.1:8765) with live progress.","nodes":["eval-report"],"edges":[],"refs":["eval/src/cmeval/status.py","eval/src/cmeval/dashboard.py","eval/src/cmeval/static/dashboard.js"]}]}],"overview":{"name":"The big picture","intro":"From an agent's first MCP call to a ranked answer, in five steps. Press **Next** (or →) to walk through it.","steps":[{"label":"Connect","title":"The agent connects over MCP","say":"A coding agent such as Claude Code starts `codemem` as an MCP server and talks to it over stdio.","points":["The handshake is answered at once; loading the model and catching up on the repo run in the background.","Four tools: `search_code`, `get_chunk`, `index_status`, `refresh_index`.","Every call goes to one object, **CodememService**. It owns the index, the file watcher and the one writer thread."],"figure":["4","MCP tools"],"nodes":["agents","mcp","service"],"edges":[["agents","mcp"],["mcp","service"]]},{"label":"Index","title":"Index: stage A reads the structure","say":"When a file is saved, the watcher notices and the writer updates the index's structure.","points":["tree-sitter cuts each file into functions, classes and blocks of top-level code.","Calls are linked by name: who calls what, and which tests reach it.","Only what changed is redone. Chunks whose meaning may have changed are queued for stage B."],"figure":["ms","one SQLite transaction"],"nodes":["repo","service","indexer","store"],"edges":[["repo","service"],["service","indexer"],["indexer","store"]]},{"label":"Embed","title":"Embed: stage B adds the meaning","say":"Each chunk gets two texts, and an embedding model turns each text into a vector.","points":["**Code text:** the code, with its path, class and doc.","**Usage text:** who calls it and which tests reach it. That is how *disabled users stay logged in* finds `revoke_session`.","Vectors come from this index, then a machine-wide cache, and only then the model. Newest edits go first."],"figure":["2","vectors per chunk"],"nodes":["indexer","embeddings","store"],"edges":[["indexer","embeddings"],["indexer","store"]]},{"label":"Search","title":"Search: three rankings, merged","say":"A search first catches up on recent saves, for at most 4 s, then ranks the code three ways.","points":["By keywords (BM25), by the meaning of the code, and by the meaning of its callers and tests.","The three lists are merged by rank (RRF) into short cards: location, name, a few lines.","If the catch-up runs out of time, a note names the files still pending."],"figure":["0.12 s","per search, 102k chunks"],"nodes":["mcp","service","search","embeddings","store"],"edges":[["mcp","service"],["service","search"],["search","embeddings"],["search","store"]]},{"label":"Store","title":"Storage: one SQLite file is the truth","say":"Everything lives in one SQLite database per repo. The fast vector index is a copy built from it.","points":["Files, chunks, keywords (FTS5), call links, vectors at 2 bytes per number, and the queue between the stages.","FAISS in memory, rebuilt from the stored vectors: exact search in about 10 ms.","Readers never wait for the writer; after a crash or with a second session, the index just catches up."],"figure":["1","database per repo"],"nodes":["store","indexer","search"],"edges":[["indexer","store"],["search","store"]]}]},"components":[{"id":"agents","name":"Coding agents","tagline":"Claude Code · Cursor · Codex","summary":"The coding agents codemem serves. Each one starts its own `codemem mcp` process when a session opens and talks to it over **MCP** (Model Context Protocol) on stdin/stdout. The agent sees four tools (`search_code`, `get_chunk`, `index_status`, `refresh_index`) plus server instructions, and decides when to call them, just like grep or file reads.","kind":"external","details":"codemem never runs inside the agent: the agent only knows the command line written into its config by {{setup|agent setup}}. Everything else happens in the {{mcp}} process.\n- **Claude Code** reads a project `.mcp.json`.\n- **Cursor** reads `.cursor/mcp.json`.\n- **Codex** reads `~/.codex/config.toml`; codemem prints the snippet instead of editing that global file.","box":[60,24,230,84],"related":["setup","mcp"],"maptag":"Claude Code · Cursor · Codex","files":[]},{"id":"repo","name":"Your repository","tagline":"the source files being indexed","summary":"The code an agent works on. codemem reads it, never writes to it (apart from the agent config files `codemem init` adds, after asking). The {{service|watcher}} hears every save, and the {{indexer}} re-reads only the files that changed.","kind":"external","details":"Per-repo settings live in `<repo>/.codemem.toml`. Files are skipped, with a recorded reason, when `.gitignore` excludes them, when they sit in folders like `node_modules` or `.venv`, when they are vendored, generated, minified or binary, or when they are bigger than 10 MB. The index itself lives outside the repo, in `~/.codemem/indexes/`.","box":[1050,320,230,84],"related":["service","indexer","config"],"maptag":"the source files being indexed","files":[]},{"id":"people","name":"People & scripts","tagline":"a terminal, CI, benchmark scripts","summary":"Humans and scripts use the same library through the {{cli}}: `codemem init`, `index`, `search`, `status`, `watch`, `mcp`.","kind":"external","box":[720,24,230,84],"related":["cli","docs"],"maptag":"a terminal, CI, benchmark scripts","files":[]},{"id":"mcp","name":"MCP server","tagline":"server.py · prompts.py · stdio","summary":"What an agent talks to. `codemem mcp` builds an MCP server (MCP Python SDK v2, `MCPServer`) with four tools and serves it over stdio. It answers the agent's handshake at once and starts the index work in the background, so a session never waits for indexing to begin.","kind":"frontend","details":"The server is thin: each tool calls one method of {{service|CodememService}} and formats the result with {{search|render.py}}. All wording the agent reads (tool descriptions, server instructions, notes) lives in `prompts.py`, at three steering strengths (`none`, `light`, `strong`), because getting agents to use the tool at all is a research question here. Logs go to stderr only: stdout carries the protocol.","box":[60,172,230,84],"related":["agents","service","search"],"maptag":"server.py · prompts.py · stdio","files":["src/codemem/prompts.py","src/codemem/server.py"]},{"id":"setup","name":"Agent setup","tagline":"codemem init → agent configs","summary":"`codemem init --agents claude,cursor,codex` registers the MCP server with each agent: it plans the config files to write, shows them, asks before writing, then builds the index.","kind":"frontend","box":[390,172,230,84],"related":["cli","agents","mcp"],"maptag":"codemem init → agent configs","files":["src/codemem/agents.py"]},{"id":"cli","name":"CLI","tagline":"cli.py · `codemem …` / `python -m codemem`","summary":"The command line for people, scripts and CI. Every command is a thin wrapper over {{service|CodememService}} or the library, and prints text (or JSON with `--json`).","kind":"frontend","box":[720,172,230,84],"related":["service","setup","search"],"maptag":"codemem … · python -m codemem","files":["src/codemem/__init__.py","src/codemem/__main__.py","src/codemem/cli.py"]},{"id":"eval","name":"Eval harness (cmeval)","tagline":"eval/: tasks → runs → scores","summary":"A separate Python project in `eval/` that measures how well codemem finds the code a fix touches, against baselines like grep. It builds tasks from real issues, runs every configured system on each task at the task's commit, grades the returned line ranges against the lines the fix changed, and writes reports.","kind":"eval","details":"It uses codemem as a **library** through its adapter, not through MCP: an update finishes before any search, so there is nothing to catch up on. Systems that differ only in search settings share one index, keyed by `Config.index_settings()`. The labeler that turns a fix into gold line ranges is its own implementation, so a codemem bug can't grade itself.","box":[1050,172,230,84],"maptag":"cmeval · tasks → runs → scores","pipeline":true,"related":["service","search","config"],"maptitle":"Eval harness","files":[]},{"id":"eval-tasks","name":"Tasks & gold labels","tagline":"issues and fixes → tasks with gold line ranges","summary":"Builds the tasks: imports SWE-bench, or collects fresh GitHub issues and the PRs that fixed them, and labels which functions each fix touched.","parent":"eval","files":["eval/src/cmeval/collect/__init__.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/issues.py","eval/src/cmeval/collect/links.py","eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/collect/search.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/github.py","eval/src/cmeval/importers/__init__.py","eval/src/cmeval/importers/swebench.py","eval/src/cmeval/labels.py","eval/src/cmeval/patches.py","eval/src/cmeval/subset.py","eval/src/cmeval/tasks.py","eval/tasks/fresh-cpp-v1-68.jsonl","eval/tasks/fresh-cpp-v1-68.meta.json","eval/tasks/fresh-cpp-v1.jsonl","eval/tasks/fresh-cpp-v1.meta.json","eval/tasks/fresh-ts-v1-50.jsonl","eval/tasks/fresh-ts-v1-50.meta.json","eval/tasks/fresh-ts-v1.jsonl","eval/tasks/fresh-ts-v1.meta.json","eval/tasks/fresh-v1-py100.jsonl","eval/tasks/fresh-v1-py100.meta.json","eval/tasks/fresh-v1.jsonl","eval/tasks/fresh-v1.meta.json","eval/tasks/swebv-dev50.jsonl","eval/tasks/swebv-dev50.meta.json"]},{"id":"eval-configs","name":"Systems configs","tagline":"which systems to compare","summary":"TOML files that each name a set of systems (codemem with given signals and weights, grep variants) for one run.","parent":"eval","files":["eval/configs/baseline-v2.toml","eval/configs/baseline.toml","eval/configs/codemem-v2-ablations.toml","eval/configs/codemem-v2-weights.toml","eval/configs/codemem-v2.toml","eval/configs/codemem-v3-full.toml","eval/configs/codemem-v3.toml","eval/configs/fresh-candidates.toml","eval/configs/fresh-cpp-v1.toml","eval/configs/fresh-ts-v1.toml","eval/configs/fresh-v1.toml","eval/configs/grep-plus.toml","eval/configs/grep.toml","eval/configs/main-cpp.toml","eval/configs/main-python.toml","eval/configs/main-typescript.toml","eval/configs/smoke.toml"]},{"id":"eval-run","name":"Runner","tagline":"every system × every task, at the task's commit","summary":"Checks out each task's repo at its commit, asks every system for results, times it, and writes one record per system and task.","parent":"eval","files":["eval/src/cmeval/__init__.py","eval/src/cmeval/cli.py","eval/src/cmeval/files.py","eval/src/cmeval/paths.py","eval/src/cmeval/repos.py","eval/src/cmeval/retriever.py","eval/src/cmeval/run.py","eval/src/cmeval/status.py","eval/src/cmeval/systems.py"]},{"id":"eval-adapters","name":"Adapters","tagline":"one per kind of system: codemem, grep, …","summary":"Turn a system into the runner's retriever interface. The codemem adapter builds or updates a per-commit index and calls `search()`.","parent":"eval","files":["eval/src/cmeval/adapters/__init__.py","eval/src/cmeval/adapters/codemem.py","eval/src/cmeval/adapters/fake.py","eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/grep_fn.py","eval/src/cmeval/adapters/keywords.py"]},{"id":"eval-score","name":"Scoring & metrics","tagline":"accuracy, tokens, latency, statistics","summary":"Grades each run record against the gold ranges and computes accuracy, token and latency metrics with significance tests.","parent":"eval","files":["eval/src/cmeval/metrics/__init__.py","eval/src/cmeval/metrics/accuracy.py","eval/src/cmeval/metrics/latency.py","eval/src/cmeval/metrics/matching.py","eval/src/cmeval/metrics/stats.py","eval/src/cmeval/metrics/tokens.py","eval/src/cmeval/score.py"]},{"id":"eval-report","name":"Reports & dashboard","tagline":"report.md, comparisons, live dashboard","summary":"Writes the markdown reports, compares and merges runs, and serves a local dashboard with the progress of long jobs.","parent":"eval","files":["eval/src/cmeval/compare.py","eval/src/cmeval/dashboard.py","eval/src/cmeval/merge.py","eval/src/cmeval/report.py","eval/src/cmeval/static/dashboard.css","eval/src/cmeval/static/dashboard.html","eval/src/cmeval/static/dashboard.js"]},{"id":"eval-results","name":"Results","tagline":"committed runs and their reports","summary":"The runs the team has committed: raw scores, summaries and reports for each experiment.","parent":"eval","files":["eval/results/README.md"]},{"id":"eval-tests","name":"Eval tests","tagline":"pytest suite for cmeval","summary":"Tests for every part of the harness, with small recorded GitHub responses as fixtures.","parent":"eval","aside":true,"files":["eval/tests/conftest.py","eval/tests/fixtures/defs_sample.cpp","eval/tests/fixtures/defs_sample.py","eval/tests/fixtures/defs_sample.ts","eval/tests/fixtures/gh/ha-search-page.json","eval/tests/fixtures/gh/pandas-collect.json","eval/tests/test_candidates.py","eval/tests/test_cli.py","eval/tests/test_codemem_adapter.py","eval/tests/test_compare.py","eval/tests/test_dashboard.py","eval/tests/test_github.py","eval/tests/test_grep.py","eval/tests/test_issues.py","eval/tests/test_keywords.py","eval/tests/test_labels.py","eval/tests/test_links.py","eval/tests/test_merge.py","eval/tests/test_metrics.py","eval/tests/test_patches.py","eval/tests/test_paths.py","eval/tests/test_repo_stats.py","eval/tests/test_report.py","eval/tests/test_repos.py","eval/tests/test_retriever.py","eval/tests/test_run.py","eval/tests/test_score.py","eval/tests/test_stats.py","eval/tests/test_status.py","eval/tests/test_subset.py","eval/tests/test_swebench.py","eval/tests/test_systems.py","eval/tests/test_tasks.py","eval/tests/test_tasks_build.py"]},{"id":"eval-project","name":"Eval project files","tagline":"pyproject, lockfile, README","summary":"The eval is its own uv project with its own dependencies; codemem is an optional extra.","parent":"eval","aside":true,"files":["eval/.python-version","eval/README.md","eval/pyproject.toml","eval/uv.lock"]},{"id":"service","name":"CodememService","tagline":"service.py · watcher.py — owns one index: the watcher, the single writer thread, and the catch-up every search does first","summary":"The one object every front-end drives. It opens the {{store}}, runs the {{indexer}} on a single background **writer** thread (the only thing that writes the index), listens to file events with the **watcher**, and makes every search **catch up** on recent saves first, within 4 seconds.","kind":"core","details":"**Why it exists:** an agent searches right after its own edits, so that is exactly when the index must be current, but embedding is far too slow to redo on every save. So updates run in two stages (fast structure, slow meaning), and each search waits for the fast stage of every earlier save and embeds the newest edits itself, up to its 4 s budget. If it can't finish, the answer ends with a note naming the files still pending, so the agent can search again or grep them.\n- **Watcher** (`watcher.py`): OS file events via watchdog, batched until saves stop for 0.5 s (2 s at most). A change to `.gitignore`, `.codemem.toml` or the git branch, or more than 2,000 paths, asks for a full check instead.\n- **Writer:** runs stage A per batch of paths and stage B in between, in slices; pauses when a search wants the model; saves the search index after 30 s without changes; full check every 5 minutes.\n- **Catch-up:** a marker-file barrier proves every earlier file event has arrived, then the search waits for stage A and embeds queued chunks itself.","box":[60,320,890,84],"maptag":"service.py · watcher.py · owns one index: the watcher, the single writer thread, and the catch-up every search does first","related":["indexer","search","store","mcp","cli"],"files":["src/codemem/service.py","src/codemem/watcher.py"]},{"id":"indexer","name":"Indexer","tagline":"indexer.py — stage A: structure (ms) · stage B: meaning (embedding, in batches)","summary":"Turns files into what search needs. **Stage A** (one SQLite transaction, milliseconds) finds the files that really changed, re-chunks them, updates their keywords and call links, and queues the chunks whose texts may have changed. **Stage B** builds those texts, reuses any vector it already has, embeds the rest, and stores them.","kind":"core","details":"The work follows the edit, not the file: a one-character change in a 50,000-function file queues one chunk. The queue (`dirty_texts`) is committed in the same transaction as the structure, so a crash between the stages loses nothing, and each queued row carries a sequence number so a vector computed for an older version of a chunk is never stored over a newer one. `codemem index --verify` rebuilds from scratch in a temporary folder and reports any difference from the incremental index.","box":[60,468,230,84],"maptag":"stage A: structure · stage B: meaning","pipeline":true,"related":["service","store","embeddings","repo"],"files":["src/codemem/indexer.py"]},{"id":"chunking","name":"Chunker","tagline":"tree-sitter → functions, classes, blocks","summary":"Parses a file with tree-sitter and cuts it into **chunks**: one per function, method and class, plus blocks of at most 200 lines for top-level code. Each chunk gets a key that survives edits (`auth/sessions.py::revoke_session`), its doc text, the names it calls, and whether it is a test.","parent":"indexer","files":["src/codemem/chunker.py","src/codemem/schema.py"]},{"id":"languages","name":"Language specs","tagline":"one small spec per language (the factory)","summary":"The chunker is generic; a **language spec** says which syntax-tree nodes are functions, classes, calls, tests and comments. `get_language(name)` is the factory: the registry maps file extensions to one spec instance per language, and each spec loads its tree-sitter grammar lazily.","parent":"chunking","details":"To add a language, write one spec here and register it. Languages in one **family** may call each other: C with C++, and JavaScript, TypeScript and TSX (family `js`).","files":["src/codemem/languages/__init__.py","src/codemem/languages/spec.py"]},{"id":"lang-python","name":"Python","tagline":"decorators, docstrings, test_* names","summary":"Which Python syntax becomes a chunk: functions and classes with their decorators in range; `if`/`try`/`with`/`for`/`while` wrappers are opened only when they contain a definition; docstrings become doc text, the module docstring goes to the first block; tests are `test_*` names and test files.","parent":"languages","files":["src/codemem/languages/python.py"]},{"id":"lang-js","name":"JavaScript / TypeScript / TSX","tagline":"exports, arrow functions, *.test.* / *.spec.*","summary":"JavaScript, TypeScript and TSX share one spec family (`js`): exported declarations are unwrapped, arrow functions assigned to variables or fields count as functions, `new X()` is a call, TypeScript interfaces, enums and namespaces are handled, and `*.test.*` / `*.spec.*` files are tests.","parent":"languages","files":["src/codemem/languages/javascript.py"]},{"id":"lang-go","name":"Go","tagline":"receiver methods, Test/Benchmark/Fuzz","summary":"Go: methods are qualified by their receiver type (`SessionManager.ExpireOld`), structs and interfaces are classes, grouped type declarations are split, and `Test`/`Benchmark`/`Fuzz`/`Example` functions in `*_test.go` are tests.","parent":"languages","files":["src/codemem/languages/go.py"]},{"id":"lang-java","name":"Java","tagline":"methods, records, enums, JUnit","summary":"Java: methods and constructors, records, enums and annotation types as classes, and JUnit test annotations (`@Test` and friends) mark tests.","parent":"languages","files":["src/codemem/languages/java.py"]},{"id":"lang-c","name":"C / C++ / CUDA","tagline":"declarators, A::b methods, macros, gtest","summary":"C, C++ and CUDA (family `c`): names are found by walking declarators, out-of-line `A::b` methods are attributed to their class, macros, typedef'd records, `extern` and preprocessor blocks, namespaces and templates are handled, and gtest `TEST(...)` macros are tests. A `.h` file is read as C++ only if it uses C++ syntax.","parent":"languages","files":["src/codemem/languages/c_family.py"]},{"id":"lang-rust","name":"Rust","tagline":"mod/impl containers, #[test]","summary":"Rust: `mod` and `impl` are containers whose names become part of qualified names, attributes are in range, structs, enums, unions and traits are classes, and `#[test]`-style attributes mark tests.","parent":"languages","files":["src/codemem/languages/rust.py"]},{"id":"callgraph","name":"Call graph","tagline":"links each called name to its definitions","summary":"Links every called name to the functions, methods and classes that define it, within one language family. A name defined more than 5 times (`get`, `run`) gets no links, since it would connect everything to everything. Deliberately simple, and isolated in `resolve_edges` so a smarter resolver can replace it.","parent":"indexer","files":["src/codemem/callgraph.py"]},{"id":"texts","name":"Texts","tagline":"code text · usage text · windows","summary":"Builds the texts that get embedded. The **code text** is the code with a short header (path, enclosing class, doc). The **usage text** lists who calls the chunk and which tests reach it, which often describes code better than the code does. Long code texts are cut into overlapping windows, each its own vector.","parent":"indexer","files":["src/codemem/texts.py"]},{"id":"tokenize","name":"Keywords","tagline":"splitting code and queries into words","summary":"Splits identifiers into words and also keeps them whole (`revoke_session` → `revoke session revoke_session`), the same way for indexed code and for queries, so BM25 matches both.","parent":"indexer","aside":true,"files":["src/codemem/tokenize.py"]},{"id":"search","name":"Search","tagline":"search.py · render.py — BM25 + vectors → RRF → cards","summary":"Ranks the code three ways and merges the rankings: by **keywords** (BM25 over name, path, signature, doc and code), by the meaning of the **code** and by the meaning of its **usage** (each a vector search). Lists are merged by rank with reciprocal rank fusion (each list adds 1/(60+rank)); ties are ordered by location so every machine gives the same order.","kind":"core","details":"`render.py` turns results into what the agent reads: short **cards** (location, name, id for `get_chunk`, signature, first doc line, a few lines of code, or the best-matching window of a long function), and the freshness note when something is still pending. The eval counts tokens of exactly this text.","box":[720,468,230,84],"maptag":"BM25 + vectors → RRF → cards","related":["store","embeddings","service","mcp"],"files":["src/codemem/render.py","src/codemem/search.py"]},{"id":"embeddings","name":"Embeddings","tagline":"embedder.py · vectorcache.py — local model, API or plugin","summary":"Turns texts into vectors (lists of numbers where similar meanings lie close together). The default is the local model `jinaai/jina-code-embeddings-0.5b`, on the GPU when there is one. It can also be any OpenAI-compatible API, a Python class of your own, or a fake hashed model for tests.","kind":"model","details":"Before the model runs, a vector is looked for in this index (same text, same model) and then in the machine-wide **vector cache** (`~/.codemem/cache/vectors.db`), so rebuilds, branch switches and undos cost no model calls. Vectors from different models never mix: each set is named by its model and the settings that shape it.","box":[390,468,230,84],"maptag":"local model, API or plugin · cache","related":["indexer","search","config"],"files":["src/codemem/embedder.py","src/codemem/vectorcache.py"]},{"id":"store","name":"Store","tagline":"store.py — SQLite is the source of truth · FAISS search index in memory (2 bytes per number) · one writer at a time","summary":"Everything the index knows, in one SQLite database per repo: files, chunks, keywords (FTS5), calls and links, vectors, the stage-B queue and the settings it was built with. The vector search index (FAISS) is a derived copy kept in memory and saved next to the database; it can always be rebuilt from the stored vectors without the model.","kind":"storage","details":"```\n~/.codemem/indexes/<repo>-<hash>/\n├── index.db ........ SQLite (WAL): files · chunks · fts · calls · edges ·\n│                     vectors · dirty_texts · meta\n├── vec_code.faiss .. saved search index per text type (+ vec_code.json note)\n├── vec_usage.faiss\n└── write.lock ...... one writer at a time (OS byte lock)\n~/.codemem/cache/vectors.db ... vector cache shared by every index\n```\nReaders never wait for writes (SQLite WAL). Every commit that changes a type's vectors bumps its **epoch** in `meta`; an in-memory index that is behind (another process wrote) catches up by comparing vector ids, since vectors are only ever added and deleted, never changed in place.","box":[60,616,890,84],"maptag":"store.py · SQLite is the source of truth · in-memory FAISS search index (2 bytes per number) · one writer at a time","related":["indexer","search","embeddings"],"files":["src/codemem/store.py"]},{"id":"config","name":"Config & plugins","tagline":"config.py · plugins.py","summary":"Every setting and its default, loaded in order: built-in defaults, `~/.codemem/config.toml`, `<repo>/.codemem.toml`, then environment variables (`CODEMEM_HOME`, `CODEMEM_MODEL`, `CODEMEM_DEVICE`, `CODEMEM_STEERING`, `CODEMEM_VECTOR_CACHE`). `plugins.py` loads `\"module:Class\"` embedders and vector backends named in the config.","kind":"core","details":"`Config.index_settings()` lists every setting that changes an index. The indexer compares it with what the index was built with and redoes only what changed (a new model re-embeds that vector set, a new chunker rebuilds); the eval uses it to share indexes between systems.","box":[1050,468,230,84],"related":["service","embeddings","store"],"maptag":"config.py · plugins.py","files":["src/codemem/config.py","src/codemem/plugins.py"]},{"id":"tests","name":"Tests & fixtures","tagline":"tests/ — pytest, fake model by default","summary":"The codemem test suite. `uv run pytest` runs the fast suite with a fake hashed embedder (no model download); `-m model` runs real-model tests and `-m api` the embedding-API smoke test. Every test gets its own `CODEMEM_HOME`, so your real `~/.codemem` is never touched.","kind":"support","related":["indexer","search","service"],"files":["tests/conftest.py","tests/test_api_embedder.py","tests/test_chunker.py","tests/test_freshness_stress.py","tests/test_frontends.py","tests/test_incremental.py","tests/test_indexer.py","tests/test_languages.py","tests/test_model.py","tests/test_platform.py","tests/test_plugins.py","tests/test_search.py","tests/test_store.py","tests/test_texts_embedder.py","tests/test_tokenize.py"]},{"id":"fixtures","name":"Fixture repos","tagline":"small repos with planted cases","summary":"Tiny repositories the tests index. The running example lives here: `revoke_session`, which the query \"disabled users stay logged in\" can only reach through its callers.","parent":"tests","files":["tests/fixtures/chunk_sample.py"]},{"id":"fx-sample","name":"sample_repo","tagline":"Python: the revoke_session story + ignore cases","summary":"A tiny Python app. `disable_user` and `logout` call `revoke_session`, and a test covers it; plus files that must be skipped (gitignored, generated, build output, non-code).","parent":"fixtures","files":["tests/fixtures/sample_repo/.gitignore","tests/fixtures/sample_repo/api/routes.py","tests/fixtures/sample_repo/auth/README.txt","tests/fixtures/sample_repo/auth/__init__.py","tests/fixtures/sample_repo/auth/db.py","tests/fixtures/sample_repo/auth/schema_generated.py","tests/fixtures/sample_repo/auth/sessions.py","tests/fixtures/sample_repo/auth/users.py","tests/fixtures/sample_repo/build/out.py","tests/fixtures/sample_repo/scratch/notes.py","tests/fixtures/sample_repo/tests/test_users.py"]},{"id":"fx-poly","name":"poly_repo","tagline":"the same story in Go, TypeScript and C","summary":"The same revoke/disable/test story in three more languages, with a vendored decoy and generated files that must be skipped.","parent":"fixtures","files":["tests/fixtures/poly_repo/gen/api.pb.go","tests/fixtures/poly_repo/gen/types_gen.go","tests/fixtures/poly_repo/go/auth/sessions.go","tests/fixtures/poly_repo/go/auth/users.go","tests/fixtures/poly_repo/go/auth/users_test.go","tests/fixtures/poly_repo/native/session.c","tests/fixtures/poly_repo/native/session.h","tests/fixtures/poly_repo/native/users.c","tests/fixtures/poly_repo/vendor/github.com/x/lib.go","tests/fixtures/poly_repo/web/src/sessions.ts","tests/fixtures/poly_repo/web/src/users.test.ts","tests/fixtures/poly_repo/web/src/users.ts"]},{"id":"fx-lang","name":"Language samples","tagline":"one file per language, every definition form","summary":"One small file per non-Python language, packed with that language's definition forms; the language tests check exact chunks and line ranges.","parent":"fixtures","files":["tests/fixtures/lang/SessionManager.java","tests/fixtures/lang/session.c","tests/fixtures/lang/session_manager.cc","tests/fixtures/lang/sessions.go","tests/fixtures/lang/sessions.js","tests/fixtures/lang/sessions.rs","tests/fixtures/lang/sessions.ts"]},{"id":"docs","name":"Docs & scripts","tagline":"README, design docs, benchmark scripts","summary":"How to install and configure codemem, how it works and why, research directions, and the scripts used for benchmarks.","kind":"support","related":["people"],"files":["README.md"]},{"id":"guides","name":"Design docs","tagline":"architecture, data model, decisions","summary":"Long-form explanations: how the system works end to end, the exact formats and interfaces, operational decisions, and research ideas.","parent":"docs","files":["docs/advanced-design.md","docs/architecture.md","docs/data-model.md","docs/decisions.md","docs/exa.md"]},{"id":"scripts","name":"Scripts","tagline":"benchmarks and comparisons","summary":"One-off tools run by hand: freshness benchmarks, score comparisons and a real-model smoke test.","parent":"docs","files":["scripts/bench_freshness.py","scripts/compare_scores.py","scripts/smoke_real_model.py"]},{"id":"explorer","name":"Explorer","parent":"docs","tagline":"This page: an interactive map of every file in the repo","summary":"The page you are reading. `build.py` fills `templat
