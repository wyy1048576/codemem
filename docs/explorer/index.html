rs (dev50-final, b4b, repo-stats, subset-v2, subset-weights, subset-b4, subset-v3, subset-v3-b4) with their configs and codemem commits, and says hit texts stay in CMEVAL_HOME/runs outside git. It explains report.md, summary.csv, scores.jsonl.gz, meta.json/score-meta.json and index.jsonl, and how to regenerate a report: unpack scores.jsonl.gz and run `cmeval report <folder>` with tasks/swebv-dev50.jsonl at the same sha256.","connects_to":["eval/results/"],"component":"eval-results"},"eval/src/cmeval/__init__.py":{"bytes":94,"lines":3,"auto_summary":"cmeval: evaluation suite for repository-level code retrieval.","symbols":[],"summary":"Package marker for cmeval; defines `__version__ = \"0.1.0\"`.","details":"The version string is printed by `cmeval --version` and written into run meta.json, score-meta.json, task meta files and import meta.","key_symbols":["__version__: package version string 0.1.0"],"connects_to":["eval/src/cmeval/cli.py","eval/src/cmeval/run.py","eval/src/cmeval/score.py","eval/src/cmeval/importers/swebench.py","eval/src/cmeval/collect/tasks_build.py"],"component":"eval-run"},"eval/src/cmeval/adapters/__init__.py":{"bytes":95,"lines":1,"auto_summary":"Retrieval systems that plug into cmeval through the Retriever interface (retriever.py).","symbols":[],"summary":"Package marker for the retrieval-system adapters.","details":"Only a docstring; adapters are loaded by name through the ADAPTERS registry in systems.py, not imported here.","connects_to":["eval/src/cmeval/systems.py"],"component":"eval-adapters"},"eval/src/cmeval/adapters/codemem.py":{"bytes":9307,"lines":204,"auto_summary":"The codemem adapter: the only file in cmeval that imports codemem.","symbols":[{"kind":"def","name":"_codemem_git","line":45,"doc":"The codemem commit the run used, and whether its source had uncommitted changes."},{"kind":"def","name":"_dir_size","line":62,"doc":""},{"kind":"class","name":"CodememRetriever","line":66,"doc":"","methods":["__init__","_index_settings","index_key","describe","_service","_index","build","update","search","_release","close"]}],"summary":"The codemem adapter, the only cmeval file that imports codemem: wraps CodememService for build/update and codemem.search.search for queries, sharing one service per index folder.","details":"Config comes only from `config_from_dict(config)` (no user config files or env vars). If `signals` is given, each must be 'bm25' or an enabled vector type, checked at creation and again after every search because codemem silently drops signals with no vectors. index_key is stable_hash of codemem's version, the resolved device (GPU vs CPU round differently), and `Config.index_settings()` when codemem provides it, else a fallback list INDEX_TIME_FIELDS plus per-vector model ids. A module-level `_SHARED` dict maps a resolved index folder to one CodememService plus its key and a user count, because each Store loads vectors into memory once; a second system with a different key on the same folder, or a different repo, is refused, and `repo_root` is pinned to the worktree the runner gives. build/update call `service.update(full=True/False)` and raise if `last_error` is set (codemem's update swallows exceptions); files codemem could not chunk are logged and counted as files_failed in the IndexReport. search asks codemem with debug=True and renders each result card with codemem's `format_results` exactly as the MCP tool shows it (renumbered to its rank) as the hit text; extra holds per-signal ranks, kind, chunk_id and optional language/subkind/best_lines. describe() records codemem version, git sha and dirty flag, device, signals and the full config.","key_symbols":["CodememRetriever: Retriever for codemem (granularity 'line')","CodememRetriever._index_settings / index_key: hash of index-time settings + device + version","CodememRetriever._service: get or create the shared CodememService for an index folder","CodememRetriever._index: run service.update and build an IndexReport","CodememRetriever.search: codemem search -> Hits with MCP-style card text","_SHARED: index_dir -> {service, key, users}","_codemem_git: codemem commit sha and dirty flag","INDEX_TIME_FIELDS: fallback index-time settings for codemem 0.1"],"connects_to":["eval/src/cmeval/retriever.py","eval/src/cmeval/systems.py","eval/src/cmeval/run.py","src/codemem/__init__.py","src/codemem/config.py","src/codemem/embedder.py","src/codemem/render.py","src/codemem/search.py","src/codemem/service.py","eval/configs/baseline.toml","eval/configs/codemem-v3.toml"],"component":"eval-adapters"},"eval/src/cmeval/adapters/fake.py":{"bytes":3395,"lines":81,"auto_summary":"A fake system for tests and dry runs. No real search: deterministic and fast.","symbols":[{"kind":"class","name":"FakeRetriever","line":20,"doc":"","methods":["__init__","describe","index_key","_index","build","update","search","close"]}],"summary":"A fake, deterministic system for tests and dry runs: indexes files with one suffix and ranks them by how often query words occur, or returns scripted hits for known queries.","details":"build/update read every `*.py` (configurable suffix) file outside .git into memory and write a small fake-index.json listing them; `calls` records build/update/search so tests can count calls. search returns scripted hits if the query is in `script`, else scores each file by occurrences of 3+ char words; 'line' granularity hits span the whole file (1..line count), 'file' hits have no lines. The text is the first 3 lines of the file.","key_symbols":["FakeRetriever: test stand-in Retriever","FakeRetriever.search: scripted or word-count ranking","FakeRetriever.calls: list of method calls for tests"],"connects_to":["eval/src/cmeval/retriever.py","eval/src/cmeval/systems.py","eval/configs/smoke.toml"],"component":"eval-adapters"},"eval/src/cmeval/adapters/grep.py":{"bytes":7188,"lines":167,"auto_summary":"The offline grep baseline (Decision 4): ripgrep over keywords from the issue, files ranked by match count.","symbols":[{"kind":"def","name":"find_rg","line":22,"doc":"The rg binary: a configured path or command name, else rg on PATH."},{"kind":"def","name":"rg_version","line":31,"doc":""},{"kind":"def","name":"_run_rg","line":41,"doc":""},{"kind":"def","name":"_patterns","line":50,"doc":""},{"kind":"def","name":"_type_args","line":57,"doc":"rg file-type filters, for example [\"py\"] for Python files only."},{"kind":"def","name":"rg_count","line":62,"doc":"Matches of any keyword in each file of the repo (respects .gitignore; skips hidden and binary files)."},{"kind":"def","name":"rg_files","line":73,"doc":"Files that contain any of the keywords; with no keywords, every searchable file."},{"kind":"def","name":"preview_line","line":80,"doc":"A long line cut as `rg --max-columns MAX_COLUMNS --max-columns-preview` shows it."},{"kind":"def","name":"rg_lines","line":87,"doc":"Matching lines (line number, content) in the given files; long lines cut unless max_columns is None."},{"kind":"def","name":"rank_files","line":107,"doc":"Files by match count, highest first; ties by path."},{"kind":"def","name":"format_lines","line":112,"doc":"Lines in `rg -n` form, as an agent would see them."},{"kind":"class","name":"GrepRetriever","line":117,"doc":"","methods":["__init__","describe","index_key","build","update","_keywords","search","close"]}],"summary":"The offline grep baseline: ripgrep for keywords taken from the issue, files ranked by total match count (granularity 'file'), plus shared rg helpers used by grep_fn.","details":"Every rg call uses `--no-config --fixed-strings --ignore-case --path-separator / --no-messages --null`, stdin from /dev/null and an explicit path, so results do not depend on the user's ripgrep config or OS; exit code 1 means no match and exit 2 with no output raises. There is no index: build/update just remember the repo and return a zero-second IndexReport, and all grep systems share one index_key (NO_INDEX_KEY). search extracts up to 20 keywords, counts matches per file with `--count-matches` (respects .gitignore, skips hidden/binary), ranks by count then path, and makes each hit's text from up to max_lines (10) matching lines per file in `path:line:content` form, with long lines cut at 300 bytes like `rg --max-columns`. The first hit's extra records the keywords.","key_symbols":["GrepRetriever: file-level grep baseline","find_rg / rg_version: locate rg and record its version","rg_count: matches per file","rg_files: files containing any keyword (or all files)","rg_lines: matching lines per file","rank_files / format_lines / preview_line: ranking and hit text formatting","NO_INDEX_KEY / MAX_COLUMNS: shared key and line cut"],"connects_to":["eval/src/cmeval/retriever.py","eval/src/cmeval/adapters/keywords.py","eval/src/cmeval/adapters/grep_fn.py","eval/src/cmeval/systems.py","eval/configs/grep.toml"],"component":"eval-adapters"},"eval/src/cmeval/adapters/grep_fn.py":{"bytes":8364,"lines":156,"auto_summary":"grep-fn (Decision 4): the grep baseline plus the step an agent takes next.","symbols":[{"kind":"class","name":"GrepFnRetriever","line":44,"doc":"","methods":["__init__","describe","_keywords","_idf","_functions","build","search","close"]}],"summary":"grep-fn: the grep baseline plus the step an agent takes next, mapping each matching line to its innermost function so grep can be graded at function level (granularity 'line').","details":"It takes the top_files (50) files by grep ranking, gets their matching lines (whole lines, no column cut, for counting), parses each file with labels.find_definitions (cached by path, mtime and size, cleared on build), and assigns each line to the innermost named function; matches outside functions or in files without a grammar are dropped. Defaults reproduce the naive ranking: raw match count, then file rank, then start line. Four options (used by grep-fn-plus): `types` limits rg file types (e.g. ['py']); `weighting='idf'` ranks files and functions by the sum of log(N/(1+df))+1 over the distinct keywords they contain (one rg call per keyword in an 8-thread pool); `clean_keywords` drops keywords that look like hashes, paths, URLs or file names (taking 10 spare keywords first); `tests_last` puts functions in test files (patches.classify_path) after all others. Each hit is a function span with its symbol and up to max_lines matching lines as text. Files are read as bytes so a lone \\r does not shift line numbers versus rg.","key_symbols":["GrepFnRetriever: function-level grep (subclass of GrepRetriever)","GrepFnRetriever.search: file ranking -> per-function scores -> Hits","GrepFnRetriever._idf: keyword weights and per-file idf scores","GrepFnRetriever._functions: cached function definitions of a file","GrepFnRetriever._keywords: optional noise cleaning","NOISE_RE / WEIGHTINGS / SPARE_KEYWORDS: options and keyword filter"],"connects_to":["eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/keywords.py","eval/src/cmeval/labels.py","eval/src/cmeval/patches.py","eval/src/cmeval/retriever.py","eval/src/cmeval/systems.py","eval/configs/grep.toml","eval/configs/grep-plus.toml"],"component":"eval-adapters"},"eval/src/cmeval/adapters/keywords.py":{"bytes":4589,"lines":98,"auto_summary":"Search words for the offline grep baselines, taken from an issue the way an agent would pick them.","symbols":[{"kind":"def","name":"_looks_like_identifier","line":42,"doc":""},{"kind":"def","name":"_candidates","line":51,"doc":"(identifier-like tokens, plain words) in order of appearance."},{"kind":"def","name":"extract_keywords","line":71,"doc":"Search words for a query, best first, lowercase, no duplicates, at most max_keywords."}],"summary":"Extracts search words from an issue for the grep baselines, the way an agent would pick them: backtick spans first, then identifier-like tokens, then other meaningful words.","details":"Backtick spans are stripped of call arguments and punctuation (`make_user(name)` -> make_user) and, for dotted names, the last part (if 4+ chars) is added too; spans with spaces are tokenized instead. A token counts as an identifier if it has a dot (not an abbreviation like e.g. or a version like v2.0), an underscore, an inner capital, or is followed by `(`. Plain words need 4+ letters and must not be stop words. Everything is lowercased, de-duplicated, at least 3 characters, filtered against a large STOP_WORDS set (English filler, bug-report words, Python keywords and generic code words), and capped at max_keywords (20).","key_symbols":["extract_keywords: ordered, lowercase, unique keywords for a query","STOP_WORDS: words that say nothing about code location","MAX_KEYWORDS: default cap of 20","_candidates / _looks_like_identifier: token classification"],"connects_to":["eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/grep_fn.py"],"component":"eval-adapters"},"eval/src/cmeval/cli.py":{"bytes":24900,"lines":487,"auto_summary":"`cmeval` command line. Results on stdout, problems on stderr.","symbols":[{"kind":"def","name":"cmd_validate","line":22,"doc":""},{"kind":"def","name":"cmd_import","line":45,"doc":""},{"kind":"def","name":"cmd_systems","line":68,"doc":""},{"kind":"def","name":"_printer","line":87,"doc":"Progress on stderr, as before, and the same lines in the job's status file."},{"kind":"def","name":"cmd_run","line":95,"doc":""},{"kind":"def","name":"cmd_score","line":122,"doc":""},{"kind":"def","name":"cmd_report","line":153,"doc":""},{"kind":"def","name":"cmd_merge","line":179,"doc":""},{"kind":"def","name":"cmd_compare","line":197,"doc":""},{"kind":"def","name":"cmd_repo_stats","line":219,"doc":""},{"kind":"def","name":"cmd_collect","line":273,"doc":""},{"kind":"def","name":"cmd_subset","line":333,"doc":""},{"kind":"def","name":"cmd_dashboard","line":349,"doc":""},{"kind":"def","name":"cmd_planned","line":360,"doc":""},{"kind":"def","name":"build_parser","line":365,"doc":""},{"kind":"def","name":"main","line":477,"doc":""}],"summary":"The `cmeval` command line: an argparse parser with one `cmd_*` function per subcommand that lazily imports the module doing the work.","details":"Results go to stdout and problems to stderr; each command returns 0 or 1 (the planned-but-unbuilt `review` returns 2). Long jobs (run, score, collect, repo-stats) are wrapped in `JobStatus(...)` so the dashboard can show them, and `_printer` sends every progress line both to stderr and to the status file's log. Expected errors (RunError, ScoreError, TaskError, RepoError, GitHubError, etc.) are caught, printed, and recorded with `status.fail`. `main` uses parse_known_args so the planned `review` command accepts any arguments while built commands reject unknown ones. Defaults worth knowing: run --split dev, --index-mode update, --k 50; score --tokens anthropic and IoUs 0.5/0.3/0.7; report --baseline grep-fn-plus and --cutoff 2026-07-01; repo-stats --since 2026-07-01, --until yesterday, --min-python-share 0.3; dashboard port 8765.","key_symbols":["build_parser: defines all subcommands and their flags","main: parses argv, rejects extra args for built commands, dispatches to args.func","cmd_validate: load_tasks and print counts by source, split, repo","cmd_import: calls importers.swebench.import_swebench_verified","cmd_systems: load_systems + make_system, prints adapter, granularity, index_key","cmd_run: run.run inside JobStatus('run', run_id)","cmd_score: score.score inside JobStatus and prints a summary table (file R@10, MRR, fn R@10, fn MRR, tokens to first, search ms)","cmd_report / cmd_merge / cmd_compare: wrappers over report.report, merge.merge, compare.compare","cmd_collect: per repo collect_candidates then build_tasks, then write_task_set","cmd_repo_stats: collect_stats, writes stats.md and stats.json under eval/results/<today>-repo-stats","cmd_dashboard: dashboard.serve","PLANNED: {'review': ...} commands that exist only as stubs"],"connects_to":["eval/src/cmeval/tasks.py","eval/src/cmeval/importers/swebench.py","eval/src/cmeval/systems.py","eval/src/cmeval/run.py","eval/src/cmeval/score.py","eval/src/cmeval/report.py","eval/src/cmeval/merge.py","eval/src/cmeval/compare.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/github.py","eval/src/cmeval/status.py","eval/src/cmeval/dashboard.py","eval/src/cmeval/paths.py","eval/src/cmeval/files.py","eval/pyproject.toml"],"component":"eval-run"},"eval/src/cmeval/collect/__init__.py":{"bytes":80,"lines":1,"auto_summary":"Fresh task collection from GitHub issues and the PRs that fix them (F4).","symbols":[],"summary":"Package marker for fresh-task collection from GitHub issues and the PRs that fix them (phase F4).","details":"Only a docstring.","connects_to":["eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/tasks_build.py"],"component":"eval-tasks"},"eval/src/cmeval/collect/candidates.py":{"bytes":12005,"lines":251,"auto_summary":"From merged PRs to candidates: a PR, its one linked issue, and the query (F4 B1).","symbols":[{"kind":"class","name":"CollectError","line":48,"doc":"A bad collection config.","methods":[]},{"kind":"class","name":"Settings","line":53,"doc":"","methods":[]},{"kind":"class","name":"Candidate","line":65,"doc":"","methods":[]},{"kind":"class","name":"Funnel","line":87,"doc":"","methods":["drop","drop_reasons"]},{"kind":"def","name":"load_settings","line":103,"doc":""},{"kind":"def","name":"collect_candidates","line":138,"doc":""},{"kind":"def","name":"write_candidates","line":220,"doc":""},{"kind":"def","name":"_table","line":227,"doc":""},{"kind":"def","name":"render_funnel","line":244,"doc":"The GitHub steps, and the git steps when B2 ran. Each count is the PRs left after that step."}],"summary":"Collection step B1: turns a repo's merged PRs into candidates (a PR, its one linked issue, and the query) and records a yield funnel with a drop reason for every PR.","details":"`load_settings` reads a collection config: a `[collect]` table (since, until, min_body_chars default 100, extra_bots, max_code_files default 5, max_code_lines default 200; unknown keys rejected) and `[[repo]]` tables parsed by repo_stats.load_candidates; the config name is the file stem. `collect_candidates` fetches the default branch via REST, searches merged PRs, then drops in order: PRs opened before `since`, bot authors, PRs with zero or several linked issues, links that are missing or are PRs, issues opened after the PR, missing or short bodies (as of PR creation), and leaking queries. Each survivor becomes a Candidate with PR metadata, merge commit, commit oids and subjects (used later to detect rebase merges), issue info, query, hints, link method, and tags body_edited_after_fix / title_edited_after_fix. The Funnel has 13 steps: 8 GitHub steps here and 5 git steps filled by tasks_build. `write_candidates` stores candidates.jsonl and funnel.json; `render_funnel` prints the Markdown funnel tables.","key_symbols":["GITHUB_STEPS / GIT_STEPS / FUNNEL_STEPS: the 8 + 5 funnel step keys and texts","Settings: collection config values","Candidate: PR + linked issue + query before task building","Funnel: per-repo counts after each step and drop records","load_settings: parse and validate a collection TOML","collect_candidates: GitHub-only filtering for one repo","write_candidates: candidates.jsonl + funnel.json","render_funnel: Markdown funnel tables (git steps only once B2 ran)"],"connects_to":["eval/src/cmeval/github.py","eval/src/cmeval/collect/search.py","eval/src/cmeval/collect/links.py","eval/src/cmeval/collect/issues.py","eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/tasks.py","eval/src/cmeval/files.py","eval/src/cmeval/cli.py","eval/configs/fresh-v1.toml"],"component":"eval-tasks"},"eval/src/cmeval/collect/issues.py":{"bytes":5243,"lines":118,"auto_summary":"Issues as they were when the fix PR was opened (Decision 8), and the query built from them.","symbols":[{"kind":"def","name":"issues_query","line":40,"doc":""},{"kind":"def","name":"fetch_issues","line":47,"doc":"Number -> issue (or a {\"__typename\": \"PullRequest\"} for a PR), None when GitHub has nothing."},{"kind":"def","name":"body_at","line":62,"doc":"(body at `when`, edited after `when`, that version's text is missing). Times are ISO 8601 UTC strings."},{"kind":"def","name":"title_at","line":79,"doc":"(title at `when`, renamed after `when`)."},{"kind":"def","name":"hints_before","line":88,"doc":"Comments by people (not bots) created before `when`, hidden comments removed. Stored, not used."},{"kind":"def","name":"build_query","line":96,"doc":"The issue title and body in the task format (\"<title>\\n\\n<body>\"), hidden comments removed."},{"kind":"def","name":"leak","line":101,"doc":"Why the query gives away the fix, or None: it names the fix PR or a commit of the fix."}],"summary":"Fetches linked issues with their edit history and rebuilds the title, body and comments as they were when the fix PR was opened, then builds the query and checks it for leaks.","details":"Issues are fetched 50 per GraphQL query (sorted numbers, so batches and cache hits repeat), each with userContentEdits (up to 100 body versions), RENAMED_TITLE_EVENT timeline items, and up to 100 comments; a number can come back as a PullRequest or None. `body_at` returns the current body if nothing was edited after the PR's creation time; otherwise it takes the last version at or before that time (or the oldest version), and flags it missing when GitHub did not store that version's text (deleted or null diff, as for edits before about 2018). `title_at` uses the previousTitle of the first rename after that time. `build_query` is `<title>\\n\\n<cleaned body>`. `leak` rejects a query that mentions the fix PR (`#N` or `/pull/N`) or a 7-40 hex word that prefixes any PR commit or the merge commit. `hints_before` keeps non-bot comments created before the PR (stored, not used in the main eval).","key_symbols":["fetch_issues: number -> issue dict, PR stub, or None, batched GraphQL","body_at: body at a time, edited-after flag, missing-version flag","title_at: title at a time and renamed-after flag","hints_before: human comments before the fix PR","build_query: title + cleaned body","leak: reason the query gives away the fix, or None","ISSUE_FIELDS / BATCH_SIZE: GraphQL fields and batch size"],"connects_to":["eval/src/cmeval/github.py","eval/src/cmeval/tasks.py","eval/src/cmeval/collect/search.py","eval/src/cmeval/collect/candidates.py"],"component":"eval-tasks"},"eval/src/cmeval/collect/links.py":{"bytes":2488,"lines":52,"auto_summary":"Which issue does a PR fix? Two methods, both run on every PR.","symbols":[{"kind":"def","name":"issues_pattern","line":22,"doc":"SWE-bench's pattern: a word, white space, then \"#\" or the repo's issue URL, then the number."},{"kind":"def","name":"pr_text","line":28,"doc":"Title, body, and commit messages, as SWE-bench joins them, without HTML comments."},{"kind":"def","name":"regex_links","line":37,"doc":""},{"kind":"def","name":"list_links","line":42,"doc":"Issues in GitHub's closing list that are in the same repo."},{"kind":"def","name":"find_links","line":48,"doc":"Issue number -> \"list\", \"regex\", or \"both\", over the union of the two methods."}],"summary":"Finds which issue(s) a PR fixes with two methods: GitHub's closingIssuesReferences list and SWE-bench's closing-keyword regex.","details":"The regex method joins the PR title, body and all commit messages, removes HTML comments, and keeps `<word> #N` or `<word> https://github.com/<repo>/issues/N` where the word is one of close/closes/closed/fix/fixes/fixed/resolve/resolves/resolved. The list method keeps only closing issues in the same repo. `find_links` returns the union, tagging each number 'list', 'regex' or 'both' so a strict SWE-bench subset is one filter.","key_symbols":["find_links: issue number -> 'list' | 'regex' | 'both'","regex_links: SWE-bench's extract_resolved_issues rule","list_links: GitHub closing list, same repo only","issues_pattern / pr_text: regex and the text it reads","PR_KEYWORDS: SWE-bench's closing words"],"connects_to":["eval/src/cmeval/collect/candidates.py"],"component":"eval-tasks"},"eval/src/cmeval/collect/repo_stats.py":{"bytes":12081,"lines":272,"auto_summary":"Numbers that help us pick the repos for fresh tasks (`cmeval repo-stats`, F4 B0).","symbols":[{"kind":"class","name":"RepoStatsError","line":55,"doc":"A bad candidates file, or a clone or count that failed.","methods":[]},{"kind":"class","name":"Candidate","line":60,"doc":"","methods":[]},{"kind":"class","name":"RepoStats","line":66,"doc":"","methods":[]},{"kind":"class","name":"CodeStats","line":80,"doc":"","methods":[]},{"kind":"def","name":"load_candidates","line":97,"doc":""},{"kind":"def","name":"api_stats","line":117,"doc":""},{"kind":"def","name":"pr_funnel","line":130,"doc":"Count of PRs left after each step of FUNNEL_STEPS, in order."},{"kind":"def","name":"code_stats","line":157,"doc":"Shallow-clone the branch, count what codemem would index, and delete the clone."},{"kind":"def","name":"collect_stats","line":212,"doc":""},{"kind":"def","name":"_top_languages","line":237,"doc":""},{"kind":"def","name":"render_markdown","line":242,"doc":""}],"summary":"`cmeval repo-stats` (step B0): numbers for choosing fresh-task repos: GitHub size and languages, a cheap PR funnel after the cutoff, and optionally what codemem would index from a shallow clone.","details":"`api_stats` reads the default branch, packed size, archived flag and per-language bytes from REST, and computes the Python share. `pr_funnel` counts PRs left after 6 loose steps: merged, not bot, exactly one closing issue in the same repo, issue opened before merge, at most 10 changed files, issue body of 100+ characters; the last count is an upper estimate of tasks. With `--functions` and a Python share of at least 0.3, `code_stats` shallow-clones the default branch into CMEVAL_HOME/tmp, walks Python files with codemem's `walk_source_files`, skips files over codemem's max_file_size, chunks the rest with codemem's `chunk_source`, counts functions/methods/classes/blocks/chunks, estimates embedding hours at 31 chunks/s, and deletes the clone. `render_markdown` builds three tables (size and languages, PR funnel, code numbers). `load_candidates` (also used by collect) parses `[[repo]]` tables with name and note and rejects duplicates.","key_symbols":["Candidate: repo name and note from a [[repo]] table","load_candidates: parse [[repo]] tables","RepoStats / CodeStats: per-repo results","api_stats: REST size and language numbers","pr_funnel: 6-step loose funnel counts","code_stats: shallow clone + codemem chunk counts","collect_stats: all of the above per candidate repo","render_markdown: stats.md tables","CHUNKS_PER_SECOND / LOOSE_MAX_FILES / DEFAULT_MIN_PYTHON_SHARE: constants"],"connects_to":["eval/src/cmeval/github.py","eval/src/cmeval/collect/search.py","eval/src/cmeval/repos.py","eval/src/cmeval/paths.py","eval/src/cmeval/status.py","eval/src/cmeval/tasks.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/cli.py","src/codemem/chunker.py","src/codemem/config.py","src/codemem/indexer.py","eval/configs/fresh-candidates.toml"],"component":"eval-tasks"},"eval/src/cmeval/collect/search.py":{"bytes":4461,"lines":117,"auto_summary":"Merged PRs of a repo in a date range, through the GitHub GraphQL search.","symbols":[{"kind":"def","name":"date_windows","line":55,"doc":"Windows of `days` days from since to until, both included. The last window can be shorter."},{"kind":"def","name":"search_string","line":68,"doc":""},{"kind":"def","name":"is_bot","line":73,"doc":"True for GitHub Apps, \"[bot]\" logins, and known bot accounts (plus `extra` logins)."},{"kind":"def","name":"_pages","line":85,"doc":""},{"kind":"def","name":"_window_prs","line":95,"doc":""},{"kind":"def","name":"search_merged_prs","line":110,"doc":"Every PR merged into `base` from since to until (both included), oldest window first."}],"summary":"Lists every merged PR of a repo in a date range with the GitHub GraphQL search, working around the 1,000-result cap, and identifies bot authors.","details":"The range is cut into 7-day windows (both ends inclusive, whole UTC days); a window whose issueCount exceeds 1,000 is split in half recursively, and a single day over the cap raises GitHubError. The search string is `repo:R is:pr is:merged base:B merged:start..end sort:created-asc` so pages are stable, with 50 results per page (100 made GitHub time out on long bodies). Each PR node carries number, url, title, body, createdAt, mergedAt, baseRefName, changedFiles, mergeCommit oid, author, up to 100 commits with messages, and up to 5 closingIssuesReferences. `is_bot` is true for __typename Bot, logins ending in [bot], a built-in list (dependabot, renovate, pre-commit-ci, github-actions, codecov, mergify, ...) and extra logins; a deleted author (None) is not a bot.","key_symbols":["search_merged_prs: all merged PRs into base between since and until","date_windows: split a date range into N-day windows","search_string: the GitHub search query","is_bot: bot-author test","KNOWN_BOTS / SEARCH_CAP / PAGE_SIZE / PR_FIELDS: constants"],"connects_to":["eval/src/cmeval/github.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/collect/issues.py"],"component":"eval-tasks"},"eval/src/cmeval/collect/tasks_build.py":{"bytes":13359,"lines":266,"auto_summary":"From candidates to gradable tasks (F4 B2): base commit, patch, checks, labels, split.","symbols":[{"kind":"class","name":"Skip","line":37,"doc":"This candidate does not become a task. args: (funnel step, reason).","methods":[]},{"kind":"def","name":"pr_files_query","line":41,"doc":""},{"kind":"def","name":"fetch_pr_files","line":48,"doc":"PR number -> the paths GitHub lists for the PR, or None for more than MAX_PR_FILES files."},{"kind":"def","name":"merge_base","line":61,"doc":"(base commit, merge type) for a merged PR (Decision 7)."},{"kind":"def","name":"patch_paths","line":83,"doc":"The paths a patch touches, as GitHub lists them: the new path, or the old path of a deleted file."},{"kind":"def","name":"gold_file_stats","line":88,"doc":"(bytes, lines) of the largest gold file at the base commit."},{"kind":"def","name":"candidate_to_task","line":97,"doc":"One task, or Skip with the funnel step and the reason."},{"kind":"def","name":"count_py_files","line":113,"doc":"Python files in the repo at a commit (the repo size tag)."},{"kind":"def","name":"count_code_files","line":118,"doc":"Files of these languages in the repo at a commit, tests included (the repo size tag)."},{"kind":"def","name":"_candidate_to_task","line":123,"doc":""},{"kind":"def","name":"build_tasks","line":198,"doc":"Tasks for one repo's candidates. Fills the git steps of the funnel."},{"kind":"def","name":"write_task_set","line":243,"doc":"The task file (all repos, oldest fix first within a repo) and its meta file next to it."}],"summary":"Collection step B2: turns candidates into gradable tasks using the full clone: base commit from the merge type, our own patch, file-list and apply checks, size limits, gold labels, and split.","details":"`merge_base` (Decision 7) uses the first parent of a merge commit with two or more parents ('merge'); for a single-parent merge commit with N>1 PR commits whose subjects equal the last N first-parent subjects it walks back N commits ('rebase'); otherwise the first parent ('squash'). The patch is `git diff -M base merge_commit`; its touched paths must equal GitHub's PR file list exactly (PRs with over 100 files are skipped before diffing), the code part must pass `git apply --check` at base, and it must have 1 to max_code_files code files and at most max_code_lines added+removed code lines. It is then labeled with label_at_commit and must have at least one gold file existing at base. Any RepoError becomes a Skip at the current step so one bad candidate does not stop collection. Tasks get id `<owner>__<name>-<pr>`, source 'fresh', split from assign_split, and extra tags such as link_method, fix_opened_at, n_code_files, code_lines_changed, gold_languages, gold_all_python, max_gold_file_bytes/lines and repo_py_files (cached per base commit). `write_task_set` sorts tasks by repo, merge time, id, saves them, and writes the .meta.json with settings, cmeval git, labeler, funnel steps, per-repo counts/link methods/drop reasons, and stats.","key_symbols":["merge_base: (base commit, 'merge'|'rebase'|'squash') for a merged PR","fetch_pr_files: GitHub's file list per PR (None over 100 files)","candidate_to_task: Candidate -> Task or Skip(step, reason)","build_tasks: all candidates of one repo, fills the git funnel steps","write_task_set: task JSONL + meta.json for a collection","Skip: candidate rejected at a funnel step","count_py_files / gold_file_stats: repo size and biggest gold file tags"],"connects_to":["eval/src/cmeval/repos.py","eval/src/cmeval/github.py","eval/src/cmeval/labels.py","eval/src/cmeval/patches.py","eval/src/cmeval/tasks.py","eval/src/cmeval/status.py","eval/src/cmeval/files.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/importers/swebench.py","eval/src/cmeval/run.py","eval/src/cmeval/cli.py","eval/tasks/fresh-v1.jsonl","eval/tasks/fresh-v1.meta.json"],"component":"eval-tasks"},"eval/src/cmeval/compare.py":{"bytes":14387,"lines":276,"auto_summary":"The update vs. rebuild check (F3 B4, Decision 5): compare two scored runs of the same tasks.","symbols":[{"kind":"class","name":"CompareError","line":41,"doc":"The two runs cannot be compared (not scored, other tasks, other systems).","methods":[]},{"kind":"class","name":"SystemResult","line":46,"doc":"","methods":["share_same_top","passed"]},{"kind":"class","name":"CompareResult","line":65,"doc":"","methods":["passed"]},{"kind":"def","name":"_location","line":77,"doc":""},{"kind":"def","name":"_load","line":81,"doc":""},{"kind":"def","name":"_means","line":93,"doc":""},{"kind":"def","name":"in_code","line":104,"doc":"True if the hit's file exists at the commit and has the hit's lines."},{"kind":"def","name":"_hint","line":113,"doc":""},{"kind":"def","name":"_top_difference","line":125,"doc":"Hits in one top 10 and not the other, with ranks and scores in both runs and a hint."},{"kind":"def","name":"compare","line":147,"doc":""},{"kind":"def","name":"code","line":209,"doc":"The code a run used: cmeval's commit, and codemem's commit if a codemem system ran."},{"kind":"def","name":"_warnings","line":218,"doc":"Reasons why the comparison may not be the update vs. rebuild check for the reported code."},{"kind":"def","name":"_num","line":233,"doc":""},{"kind":"def","name":"render","line":237,"doc":""}],"summary":"`cmeval compare`: the update-vs-rebuild check, comparing two scored runs of the same tasks (one with --index-mode update, one with rebuild) to show that incremental updates find the same code as fresh builds.","details":"Both runs must have the same tasks sha256, the same system names in order, and the same k; the tasks file is sha256-checked. For each system and each shared scored task, the top-10 hit sets are compared by location (path, start, end), never by text, since codemem card text includes chunk ids that differ by design. A system passes if at least 95% of tasks have the same top 10 and every metric mean differs by less than 0.01 (token metrics by less than 1% relative); a metric present in one run only also fails. Each differing hit gets a hint: 'stale' if its file or lines do not exist at that commit (a real update bug), 'near tie' if it is within rank 20 in the other run with a score within 1% of rank 10 there, else 'check'. It warns if the runs are not one update and one rebuild, use different codemem commits, or had uncommitted code, and writes compare-<run B>.md into run A's folder.","key_symbols":["compare: run the check and write the Markdown report","SystemResult: per-system tasks, same_top, metric diffs, differences, passed","CompareResult: all systems, report path, warnings, passed","in_code: does a hit's file and line range exist at a commit","_hint / _top_difference: classify hits that differ between runs","render: Markdown report","TOP / MIN_SAME_TOP / MAX_DIFF / MAX_RELATIVE_DIFF: 10, 0.95, 0.01, 1%"],"connects_to":["eval/src/cmeval/score.py","eval/src/cmeval/repos.py","eval/src/cmeval/files.py","eval/src/cmeval/cli.py","eval/src/cmeval/run.py"],"component":"eval-report"},"eval/src/cmeval/dashboard.py":{"bytes":4813,"lines":107,"auto_summary":"`cmeval dashboard`: a local web page with the live progress of long jobs.","symbols":[{"kind":"def","name":"job_view","line":37,"doc":"The job as the page shows it. A \"running\" job that is over (status.is_over: its process is"},{"kind":"def","name":"jobs_payload","line":46,"doc":"Running jobs (newest start first), then the RECENT newest of the others (newest end first)."},{"kind":"def","name":"make_server","line":57,"doc":"A server on 127.0.0.1:port (port 0: any free port). Call serve_forever() on it."},{"kind":"def","name":"serve","line":94,"doc":"Serve until Ctrl-C."}],"summary":"`cmeval dashboard`: a read-only local HTTP server on 127.0.0.1 that serves the static page and a JSON view of the status files.","details":"Routes are GET / (dashboard.html), /dashboard.css, /dashboard.js and /api/jobs; there is no route that writes, so it cannot change a job. Requests whose Host header is not 127.0.0.1 or localhost get 403, which blocks DNS-rebinding pages from reading it. /api/jobs returns now, the status folder, running jobs (newest start first) and the 10 most recent other jobs (newest end first); a 'running' job that status.is_over says is over is shown as 'stopped' without changing its file. Responses use Cache-Control: no-store, request logging is silenced, and `serve` optionally opens a browser and runs until Ctrl-C.","key_symbols":["serve: start the server on a port, optionally open the browser","make_server: ThreadingHTTPServer with the read-only handler","jobs_payload: running and recent jobs for /api/jobs","job_view: mark stale running jobs as stopped","DEFAULT_PORT / RECENT / LOCAL_HOSTS / FILES: 8765, 10, allowed hosts, static routes"],"connects_to":["eval/src/cmeval/status.py","eval/src/cmeval/paths.py","eval/src/cmeval/static/dashboard.html","eval/src/cmeval/static/dashboard.css","eval/src/cmeval/static/dashboard.js","eval/src/cmeval/cli.py"],"component":"eval-report"},"eval/src/cmeval/files.py":{"bytes":3656,"lines":113,"auto_summary":"Small file helpers shared by the runner and the scorer.","symbols":[{"kind":"def","name":"sha256_file","line":12,"doc":""},{"kind":"def","name":"now","line":16,"doc":""},{"kind":"def","name":"write_text_atomic","line":20,"doc":"Write to a temp file, then rename: a stopped process never leaves a half-written file."},{"kind":"def","name":"write_json","line":27,"doc":""},{"kind":"def","name":"append_jsonl","line":31,"doc":""},{"kind":"def","name":"drop_unfinished_line","line":37,"doc":"Cut a last line that has no newline (a write stopped by a power loss). True if cut."},{"kind":"class","name":"FileLock","line":54,"doc":"An exclusive lock on a file, so two processes never work on one run at the same time.","methods":["__init__","acquire","release"]},{"kind":"def","name":"read_jsonl","line":102,"doc":"Rows of a JSON-lines file ([] if missing). A bad line raises ValueError naming the file and line."}],"summary":"Small shared file helpers: sha256 of a file, UTC timestamps, atomic text/JSON writes, crash-safe JSONL append/read, and a cross-platform exclusive file lock.","details":"`write_text_atomic` writes `<name>.tmp` then replaces, always with LF line endings. `append_jsonl` writes a record and its newline in one write and flushes, so `drop_unfinished_line` can safely truncate a last line with no newline left by a crash (the runner then redoes that task). `FileLock` uses msvcrt.locking on Windows and fcntl.flock elsewhere; the OS releases it when the process dies, so a killed run can always be resumed. `read_jsonl` returns [] for a missing file and raises ValueError naming file and line for bad JSON.","key_symbols":["sha256_file: hex digest of a file","now: UTC ISO timestamp to the second","write_text_atomic / write_json: temp-file-then-rename writes","append_jsonl: one-record append with flush","drop_unfinished_line: cut a partial last line","FileLock: non-blocking exclusive lock (acquire/release)","read_jsonl: parse a JSONL file with line-numbered errors"],"connects_to":["eval/src/cmeval/run.py","eval/src/cmeval/score.py","eval/src/cmeval/report.py","eval/src/cmeval/compare.py","eval/src/cmeval/merge.py","eval/src/cmeval/status.py","eval/src/cmeval/github.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/cli.py"],"component":"eval-run"},"eval/src/cmeval/github.py":{"bytes":7643,"lines":155,"auto_summary":"GitHub API access through the `gh` command line, with an on-disk response cache.","symbols":[{"kind":"class","name":"GitHubError","line":39,"doc":"A gh call failed, GitHub returned errors, or the rate limit is almost used up.","methods":[]},{"kind":"def","name":"gh_runner","line":43,"doc":"Run `gh` with args and return its stdout."},{"kind":"def","name":"cache_key","line":64,"doc":""},{"kind":"class","name":"GitHub","line":69,"doc":"","methods":["__init__","graphql","rest","_cached","_call"]}],"summary":"GitHub API access through the `gh` CLI (which holds the login) with an on-disk response cache, pacing, and retries for transient failures.","details":"Each request (GraphQL or REST GET) is cached as one JSON file in CMEVAL_HOME/gh-cache named by sha256 of [kind, request, variables]; `refresh=True` bypasses the cache, and error answers are never cached. Live calls are spaced at least 0.25 s apart; failures matching 502/503/504, secondary rate limit, time-outs, connection reset, or unexpected EOF are retried up to 4 tries with waits of 15, 60 and 120 s, and every retry is reported via progress. `gh_runner` returns stdout even on exit code 1 when the answer still has `data`, because gh exits 1 for partial GraphQL errors. `graphql(..., allow_missing=True)` ignores NOT_FOUND errors (missing parts become None) and raises if a live answer reports fewer than 200 rate-limit points left. It counts api_calls, cache_hits and retries for the CLI and dashboard.","key_symbols":["GitHub: client with graphql(), rest(), caching and retry counters","GitHub.graphql: data part of a GraphQL answer, rate-limit guard","GitHub.rest: parsed JSON of a REST GET","gh_runner: run the gh binary","cache_key: sha256 of the request","GitHubError: failed call, GraphQL errors, or rate limit almost used","MIN_REMAINING / RETRY_WAITS / DEFAULT_MIN_INTERVAL: guard and pacing constants"],"connects_to":["eval/src/cmeval/paths.py","eval/src/cmeval/files.py","eval/src/cmeval/collect/search.py","eval/src/cmeval/collect/issues.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/cli.py"],"component":"eval-tasks"},"eval/src/cmeval/importers/__init__.py":{"bytes":62,"lines":1,"auto_summary":"Importers that turn public datasets into cmeval tasks.","symbols":[],"summary":"Package marker for importers that turn public datasets into cmeval tasks.","details":"Only a docstring.","connects_to":["eval/src/cmeval/importers/swebench.py"],"component":"eval-tasks"},"eval/src/cmeval/importers/swebench.py":{"bytes":8046,"lines":201,"auto_summary":"Import SWE-bench Verified as dev tasks, labeled with cmeval's own rules.","symbols":[{"kind":"def","name":"download","line":37,"doc":"The dataset file at a pinned revision, downloaded once into CMEVAL_HOME/datasets."},{"kind":"def","name":"load_rows","line":50,"doc":""},{"kind":"def","name":"row_to_task","line":56,"doc":""},{"kind":"def","name":"balanced_order","line":89,"doc":"Rows in a fixed order that takes about the same number fr d files) from the run files.","details":"`index_costs` uses only rows of the system that does the real work for a shared index group, keeps the first row per task (a resumed run can write a build then a no-op update), and skips rows marked `resumed`. It reports mean build seconds, median update seconds, mean items re-embedded, max bytes on disk, and files_failed_max (the largest count in one report, so a file that keeps failing is not counted at every update).","key_symbols":["percentile: nearest-rank percentile","search_latency: search_ms_median and search_ms_p95","index_costs: build/update/re-embed/size/failed-file numbers for one system"],"connects_to":["eval/src/cmeval/score.py","eval/src/cmeval/run.py"],"component":"eval-score"},"eval/src/cmeval/metrics/matching.py":{"bytes":2786,"lines":65,"auto_summary":"Which hits find which gold items (Decisions 2, 3, 4).","symbols":[{"kind":"def","name":"level_gold","line":19,"doc":"Gold items at a level: paths for \"file\", spans for \"class\" and \"function\"."},{"kind":"def","name":"excluded","line":24,"doc":"Why a (task, system, level) is left out of the scores, or None if it is scored."},{"kind":"def","name":"line_iou","line":35,"doc":"Lines shared by both ranges / lines covered by either range."},{"kind":"def","name":"hit_matches","line":42,"doc":""},{"kind":"def","name":"raw_relevance","line":50,"doc":"For each hit, in rank order, the indexes of the gold items it matches."},{"kind":"def","name":"file_units","line":57,"doc":"The ranked file list: one entry for each unique path, at its first appearance."}],"summary":"Decides which hits find which gold items at file, class and function level, and which (task, system, level) combinations are left out.","details":"File level: a hit matches a gold file if the paths are equal, and ranks are over unique paths in order of first appearance (`file_units`). Class/function level: a hit matches a gold span if it is in the same file, has line numbers, and either lies fully inside me":"wilcoxon","line":101,"doc":"Two-sided Wilcoxon signed-rank test of paired differences d (zeros are dropped, as scipy)."},{"kind":"def","name":"holm","line":139,"doc":"Holm-adjusted p-values, in the input order. A missing p counts as 1, so the family size"}],"summary":"Standard-library statistics for the report: percentile bootstrap intervals, the two-sided Wilcoxon signed-rank test matching scipy's defaults, and Holm correction.","details":"Bootstrap uses 10,000 resamples with seed 20261023; the resample index sets are generated from a string seed (independent of PYTHONHASHSEED), cached per n, and stored as compact arrays. `quantile` interpolates linearly like numpy. Paired differences are rounded to 9 digits so float noise is not counted as a difference. Wilcoxon drops zeros, ranks absolute differences with average ranks for ties, and uses the exact distribution when n <= 50 with no ties or zeros, or n <= 13 in any case; otherwise a normal approximation with tie correction and no continuity correction. All-zero differences give p = 1. `holm` returns step-down adjusted p-values in input order and treats a missing p as 1 so the family size stays fixed.","key_symbols":["bootstrap_ci: percentile CI of the mean","paired_bootstrap_ci / differences: paired CI and rounded differences","wilcoxon: two-sided signed-rank test returning WilcoxonResult","WilcoxonResult: n, n_nonzero, statistic, p, method","holm: Holm-adjusted p-values","resample_indexes / quantile: cached resamples and numpy-style quantile","SEED / RESAMPLES / CONFIDENCE: 20261023, 10000, 0.95"],"connects_to":["eval/src/cmeval/report.py"],"component":"eval-score"},"eval/src/cmeval/metrics/tokens.py":{"bytes":10587,"lines":248,"auto_summary":"Token cost of search results (Decision 6).","symbols":[{"kind":"def","name":"configured_rpm","line":39,"doc":""},{"kind":"class","name":"TokenCountError","line":46,"doc":"count_tokens failed (no key accepted, no network, API error). Scoring stops.","methods":[]},{"kind":"class","name":"TokenCounter","line":50,"doc":"","methods":["count"]},{"kind":"class","name":"EstimateCounter","line":57,"doc":"","methods":["count"]},{"kind":"def","name":"find_api_key","line":65,"doc":"ANTHROPIC_API_KEY, else the macOS Keychain entry. None if neither exists."},{"kind":"def","name":"_sha","line":80,"doc":""},{"kind":"class","name":"_RateLimiter","line":84,"doc":"Spaces calls so at most rpm start in any minute. Shared by all worker threads.","methods":["__init__","wait"]},{"kind":"class","name":"AnthropicCounter","line":101,"doc":"","methods":["__init__","_count_raw","overhead","count","close"]},{"kind":"def","name":"make_counter","line":208,"doc":"\"anthropic\" (needs an API key) or \"estimate\" (rough, only when asked for by name)."},{"kind":"def","name":"token_metrics","line":229,"doc":"tokens_to_first, found, and recall@budget<B>, over the raw hits in rank order."}],"summary":"Token cost of hits: counts each hit text with Anthropic's count_tokens for the agent-study model (minus the fixed request overhead), caches counts in SQLite, and computes tokens_to_first and recall@budget.","details":"DEFAULT_MODEL is claude-opus-5-5. The API key comes from ANTHROPIC_API_KEY or, on macOS, the Keychain entry anthropic-api-key; with no key, scoring stops rather than silently estimating. `--tokens estimate` uses ceil(len/3.5) and is marked as never reportable. AnthropicCounter stores counts in CMEVAL_HOME/token-cache/<model>.sqlite keyed by the text's sha256, measures the overhead once as count('a') - 1 and caches it, and counts missing texts with 4 worker threads behind a shared rate limiter (CMEVAL_TOKEN_RPM, default 3000/min; the SDK retries 429/5xx up to 5 times). Counts are saved as they arrive and committed every 50, and after a failure the already-finished requests are still saved. Whitespace-only text is counted after a leading 'a' (the API refuses it) and 1 is subtracted; empty text is 0. `token_metrics` gives tokens_to_first (sum of hit tokens up to and including the first matching hit, None if not found), found (0/1), and recall@budget<B> for B in 500/1000/2000/4000/8000 using whole hits only.","key_symbols":["AnthropicCounter: cached, rate-limited count_tokens client","EstimateCounter: rough chars/3.5 estimate","make_counter: 'anthropic' (needs key) or 'estimate'","find_api_key: env var or macOS Keychain","token_metrics: tokens_to_first, found, recall@budget","DEFAULT_MODEL / BUDGETS / DEFAULT_RPM: claude-opus-5-5, budgets, 3000 rpm","TokenCountError: counting failed, scoring stops"],"connects_to":["eval/src/cmeval/paths.py","eval/src/cmeval/status.py","eval/src/cmeval/score.py","eval/src/cmeval/cli.py"],"component":"eval-score"},"eval/src/cmeval/patches.py":{"bytes":11849,"lines":270,"auto_summary":"Read a unified diff: which base-side lines each file change touches, and what kind of file it is.","symbols":[{"kind":"class","name":"FileChange","line":66,"doc":"","methods":["path"]},{"kind":"def","name":"classify_path","line":86,"doc":"(file class, language) for a repo-relative path. Class is code, test, or other."},{"kind":"def","name":"_strip_prefix","line":104,"doc":""},{"kind":"def","name":"_touched_lines","line":110,"doc":"Base-side changed lines and pure-insertion points for one file."},{"kind":"def","name":"_file_change","line":138,"doc":""},{"kind":"def","name":"parse_patch","line":167,"doc":"One FileChange for each file in a unified diff (git format, a/ and b/ prefixes)."},{"kind":"def","name":"split_patch","line":172,"doc":"The diff text for each file class. Each file appears in exactly one part, with its text unchanged."},{"kind":"class","name":"PatchMismatch","line":180,"doc":"A diff does not fit the base text: its context or removed lines differ from the base.","methods":[]},{"kind":"def","name":"_strip_eol","line":184,"doc":""},{"kind":"def","name":"split_lines","line":188,"doc":"Lines with their endings, split on \"\\n\" only, the way git, unidiff, and tree-sitter count."},{"kind":"class","name":"AppliedDiff","line":202,"doc":"","methods":[]},{"kind":"def","name":"_find_hunk","line":210,"doc":"Index where the hunk's base lines match exactly: the stated index if it matches, else the nearest one."},{"kind":"def","name":"align_file_diff","line":222,"doc":"Apply a one-file diff to its base text the way `git apply` does, and find the real lines."},{"kind":"def","name":"apply_file_diff","line":268,"doc":"The file after the fix. See align_file_diff."}],"summary":"Parses unified diffs: classifies each changed file as code/test/other with a language, finds base-side changed lines and insertion points, and re-applies a one-file diff to its base text like `git apply` to get real line numbers.","details":"`classify_path` maps extensions to ~16 languages (including .pyx/.pxd as cython) and marks a file as test if any directory is tests/testdata/__tests__/spec/specs, if test/ or testing/ is at the repo top or directly under src/ (so django/test/ stays code), or if the file name matches a per-language pattern such as test_*.py, *_test.py, conftest.py. Binary files are 'other'. `_touched_lines` records removed lines as changed and an added run not preceded by removed/added lines as a pure insertion after the last base line. `align_file_diff` finds each hunk at the stated position or the nearest exact match (no fuzz), records the per-hunk offset, builds the fixed file, and lists the added lines of the new file; no exact match raises PatchMismatch. `split_lines` splits on `\\n` only (not str.splitlines) so form feeds and other separators do not shift line numbers. `split_patch` keeps each file's diff text unchanged in exactly one of code/test/other.","key_symbols":["FileChange: one file of a diff (paths, status, class, language, changed, insert_after, diff)","classify_path: (code|test|other, language) for a path","parse_patch: list of FileChange from a git-format diff","split_patch: diff text per file class","align_file_diff: apply a one-file diff with exact hunk matching get","vector"]},{"kind":"def","name":"_mean","line":164,"doc":""},{"kind":"def","name":"_fmt","line":168,"doc":""},{"kind":"def","name":"_fmt_ci","line":175,"doc":""},{"kind":"def","name":"_fmt_p","line":179,"doc":""},{"kind":"def","name":"_label","line":183,"doc":""},{"kind":"def","name":"_compare","line":187,"doc":""},{"kind":"def","name":"default_primary","line":203,"doc":"(label, systems) for the primary tests when --primary is not given."},{"kind":"def","name":"_check_definitions","line":223,"doc":"Each system of the family must be defined in the run as in configs/<config_file>."},{"kind":"def","name":"parse_where","line":239,"doc":"tasks.parse_where, with its errors as ReportError."},{"kind":"def","name":"_select","line":247,"doc":"The scored tasks that match every condition. Unknown keys and an empty result are errors."},{"kind":"def","name":"_groups","line":262,"doc":"Group name -> {group value -> task ids}. Size groups keep their natural order (small, medium,"},{"kind":"def","name":"report","line":335,"doc":""},{"kind":"def","name":"_warnings","line":400,"doc":""},{"kind":"def","name":"_group_table","line":429,"doc":"Means and counts for each group, one table for each group metric."},{"kind":"def","name":"_render","line":444,"doc":""}],"summary":"`cmeval report`: writes report.md for a scored run with bootstrap intervals, paired comparisons against a baseline (Wilcoxon, Holm for the pre-registered primary tests), group tables, the IoU check, latency, and task counts.","details":"It reads only meta.json, score-meta.json, scores.jsonl, summary.csv and the run's tasks file (sha256-checked), with no search or network, and the output has no timestamp of its own so the same inputs give the same report. The split must match the run's split. Main tables show, per level and system, the mean and 95% CI of recall@1/5/10, MRR, success@10, recall@budget1000/4000, tokens_to_first and not_found_share (file-only systems show n/a below file level; under 20 tasks a note says intervals are too narrow). Paired comparisons are system minus baseline (default grep-fn-plus) on shared tasks; the primary family is function-level MRR and function-level tokens_to_first for each PRIMARY_SYSTEMS member (default cm-bm25, cm-bm25-code, cm-bm25-code-usage, or --primary), Holm-corrected; all other comparisons are exploratory with raw p. For tokens_to_first it also counts tasks found by both/system only/baseline only/neither. Groups split tasks by identifier_in_query, repo, language, and issue date before/after the cutoff (default 2026-07-01). Warnings cover unfinished runs, estimate tokens, files that failed to index, sessions with different code or machines, a run changed after scoring, and task-count mismatches.","key_symbols":["report: build and write report.md, return ReportResult","Scores: per-task values keyed by (system, level, iou, metric)","Comparison: one paired test result (diff, CI, Wilcoxon, Holm p, found counts)","_compare: paired comparison of a system with the baseline","_groups: task groupings for group tables","_warnings / _render: warning list and Markdown output","PRIMARY / PRIMARY_SYSTEMS: pre-registered primary metrics and systems","DEFAULT_BASELINE / DEFAULT_CUTOFF / HEADLINE: grep-fn-plus, 2026-07-01, headline metrics"],"connects_to":["eval/src/cmeval/metrics/stats.py","eval/src/cmeval/metrics/matching.py","eval/src/cmeval/score.py","eval/src/cmeval/files.py","eval/src/cmeval/merge.py","eval/src/cmeval/cli.py"],"component":"eval-report"},"eval/src/cmeval/repos.py":{"bytes":11186,"lines":248,"auto_summary":"Repo clones and snapshots.","symbols":[{"kind":"class","name":"RepoError","line":29,"doc":"A git command failed, or a repo or worktree is not in the expected state.","methods":[]},{"kind":"def","name":"_git","line":33,"doc":""},{"kind":"def","name":"slug","line":42,"doc":""},{"kind":"def","name":"clone_path","line":47,"doc":""},{"kind":"def","name":"ensure_clone","line":51,"doc":"Clone the repo once (bare) and return the clone path."},{"kind":"def","name":"shallow_clone","line":77,"doc":"Check out only the newest commit of one branch into dest (no history). Returns its sha."},{"kind":"def","name":"has_commit","line":88,"doc":""},{"kind":"def","name":"ensure_commit","line":95,"doc":"Make sure the clone has the commit: fetch branches, then the commit itself by sha."},{"kind":"def","name":"commit_time","line":109,"doc":"Committer time of a commit (Unix seconds). The runner sorts tasks by it."},{"kind":"def","name":"read_file","line":115,"doc":"File content at a commit, or None if the file does not exist there. Needs no worktree."},{"kind":"def","name":"parents","line":128,"doc":"The parent commits of a commit, first parent first."},{"kind":"def","name":"ancestor","line":134,"doc":"The full sha of `sha~n` (n first-parent steps back)."},{"kind":"def","name":"subjects","line":139,"doc":"First lines of the messages of `sha` and its n - 1 first-parent ancestors, oldest first."},{"kind":"def","name":"diff","line":145,"doc":"Unified diff from old to new (renames found), the way git prints it. Needs no worktree."},{"kind":"def","name":"tracked_files","line":154,"doc":"Every file path in the tree of a commit (no worktree needed)."},{"kind":"def","name":"apply_check","line":161,"doc":"None if the patch applies cleanly to the tree of `base`, else git's message."},{"kind":"def","name":"head","line":178,"doc":""},{"kind":"def","name":"is_clean","line":182,"doc":""},{"kind":"def","name":"live_path","line":186,"doc":"Folder of the movable worktree \"name\" for this repo."},{"kind":"def","name":"discard_live","line":193,"doc":"Remove the movable worktree \"name\" if it exists, in any state."},{"kind":"def","name":"checkout","line":209,"doc":"A clean worktree at the commit."},{"kind":"def","name":"move_to","line":232,"doc":"Move a movable worktree to another commit. Refuses if the worktree has local changes."},{"kind":"def","name":"remove_worktree","line":244,"doc":""}],"summary":"Git plumbing: one bare clone per repo, worktree snapshots (fixed or movable), and read-only queries (file at a commit, diff, parents, tracked files, apply check).","details":"Clones go to CMEVAL_HOME/repos/<owner>__<name>.git via a `.partial` temp folder that is renamed when done, with core.autocrlf=false and an info/attributes file `* -text -ident -filter -working-tree-encoding` so checkouts keep the commit's exact bytes (needed because some repos, e.g. home-assistant, commit CRLF files their .gitattributes says are LF). `ensure_commit` fetches all branches and tags, then the sha itself, before giving up. `checkout(repo, commit, name)` makes either a fixed snapshot `<slug>@<sha12>` or a movable worktree `<slug>@live-<name>` that `move_to` steps to another commit, refusing if it has local changes. `read_file` and `diff` read bytes to avoid line-ending translation; `apply_check` runs `git apply --check --cached` against a temporary index so it works in the bare clone without changing anything. All git calls set GIT_TERMINAL_PROMPT=0 and LC_ALL=C.","key_symbols":["ensure_clone: bare clone once, force raw attributes and autocrlf false","ensure_commit: make sure a sha is present, fetching if needed","checkout: fixed snapshot or movable worktree at a commit","move_to: move a live worktree to another commit (clean only)","discard_live / remove_worktree: delete worktrees, falling back to rmtree + prune","commit_time: committer time used to order tasks","read_file / tracked_files / diff / parents / ancestor / subjects: read-only git queries","apply_check: does a patch apply at base (temp index)","shallow_clone: depth-1 clone for repo-stats","slug: owner/name -> owner__name"],"connects_to":["eval/src/cmeval/paths.py","eval/src/cmeval/run.py","eval/src/cmeval/labels.py","eval/src/cmeval/compare.py","eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/collect/repo_stats.py","eval/src/cmeval/cli.py"],"component":"eval-run"},"eval/src/cmeval/retriever.py":{"bytes":4689,"lines":109,"auto_summary":"The plug: the interface every retrieval system implements, and the types it returns.","symbols":[{"kind":"class","name":"RetrieverError","line":18,"doc":"A system returned something that breaks the contract (for example a hit without lines).","methods":[]},{"kind":"class","name":"Hit","line":23,"doc":"","methods":["to_dict","from_dict"]},{"kind":"class","name":"IndexReport","line":41,"doc":"","methods":["to_dict"]},{"kind":"class","name":"Retriever","line":53,"doc":"","methods":["describe","index_key","build","update","search","close"]},{"kind":"def","name":"stable_hash","line":76,"doc":"A short hash of JSON-like data, the same for equal data. Use it for index_key."},{"kind":"def","name":"check_hits","line":82,"doc":"Check a system's hits against the contract. Returns the hits; raises RetrieverError."}],"summary":"The plug: the `Retriever` protocol every search system implements, the `Hit` and `IndexReport` types, and the hit-contract checker.","details":"Retriever is a runtime-checkable Protocol with name, granularity ('file' or 'line'), describe(), index_key(), build(repo, index_dir), update(repo, index_dir), search(query, k) and close(). A Hit is graded by location only: repo-relative path, optional 1-based start_line/end_line, symbol, score, the exact `text` an agent would see (token metrics count it), and a free `extra` dict for debug data. `check_hits` enforces the contract after every search: at most k hits, forward-slash relative paths, a 'line' system must give valid line ranges on every hit and a 'file' system must give none, so a missing range can never silently become a file-level hit. `stable_hash` is a 16-hex-char sha256 of sorted JSON, used by adapters for index_key.","key_symbols":["Retriever: protocol for build/update/search/describe/index_key/close","Hit: one search result (path, lines, symbol, score, text, extra)","IndexReport: seconds, bytes_on_disk, items, items_reembedded, extra","check_hits: validate hits against granularity and k, raise RetrieverError","stable_hash: short deterministic hash of JSON-like data","GRANULARITIES: ('file', 'line')","RetrieverError: a system broke the contract"],"connects_to":["eval/src/cmeval/systems.py","eval/src/cmeval/run.py","eval/src/cmeval/score.py","eval/src/cmeval/adapters/codemem.py","eval/src/cmeval/adapters/grep.py","eval/src/cmeval/adapters/grep_fn.py","eval/src/cmeval/adapters/fake.py","eval/src/cmeval/metrics/matching.py"],"component":"eval-run"},"eval/src/cmeval/run.py":{"bytes":15806,"lines":321,"auto_summary":"The runner: every system in a config on every task, with raw hits and timings saved to files.","symbols":[{"kind":"class","name":"RunError","line":50,"doc":"The run cannot continue (leak check, broken hit contract, other inputs under one run id).","methods":[]},{"kind":"class","name":"RunSummary","line":55,"doc":"","methods":[]},{"kind":"def","name":"_eval_git","line":66,"doc":""},{"kind":"def","name":"_read_run_file","line":75,"doc":""},{"kind":"def","name":"order_tasks","line":82,"doc":"Tasks grouped by repo (sorted), each group in commit-date order of base_commit, ties by ID."},{"kind":"def","name":"run","line":93,"doc":""},{"kind":"def","name":"_code","line":177,"doc":"The code of a run: cmeval's commit and, for each system, its index settings and commit."},{"kind":"def","name":"_run_tasks","line":194,"doc":""},{"kind":"def","name":"_index_group","line":288,"doc":"Build or update the index of one group of systems for one task, and write index.jsonl."}],"summary":"The runner behind `cmeval run`: runs every system of a config on every task, stepping one worktree per repo forward through commits, sharing indexes by index_key, and saving raw hits and timings for later scoring.","details":"Tasks are loaded, filtered by split and optional repos, grouped by repo (sorted) and ordered by the committer time of base_commit, then id; --limit-per-repo keeps the first N per repo. A FileLock on run.lock stops two processes using one run id. If meta.json exists, the run resumes only if tasks/config sha256, split, index_mode, k, cmeval's commit/dirty flag and each system's name, index_key and codemem git sha are unchanged; it appends a session (start time, cmeval git, machine). Per repo it discards any old live worktree `run-<run_id>`, checks out the first task's commit, and for each task moves the worktree and verifies HEAD equals base_commit (leak check) before any search. For each index group (systems with the same index_key) in folder indexes/<run_id>/<slug>/<key>, `_index_group` builds (first member, first time, or every task in rebuild mode) or updates, using cmeval-built and cmeval-started marker files so a stopped build is wiped and redone and a stopped update's row is marked `resumed`; every call appends a row to index.jsonl. Each system's first search is an untimed warm-up ('warm up', k=1); the timed search uses perf_counter, passes check_hits, and appends {task_id, commit, search_ms, hits} to <system>.jsonl. Systems are closed and the worktree removed after each repo; index folders are deleted at the end unless --keep-indexes. Failures set meta status 'failed' with the error.","key_symbols":["run: validate inputs, write or resume meta.json, run all tasks","_run_tasks: main loop over repos, tasks, index groups and systems","_index_group: build or update one shared index for one task, write index.jsonl rows","order_tasks: group by repo and sort by base_commit time","_code: code identity checked on resume","_eval_git: cmeval commit sha and dirty flag","RunSummary: counts and timing returned to the CLI","RESUME_KEYS / BUILT_MARK / STARTED_MARK / WARMUP_QUERY: resume and marker constants","RunError: leak check, bad hits, or changed inputs"],"connects_to":["eval/src/cmeval/repos.py","eval/src/cmeval/systems.py","eval/src/cmeval/retriever.py","eval/src/cmeval/tasks.py","eval/src/cmeval/files.py","eval/src/cmeval/paths.py","eval/src/cmeval/status.py","eval/src/cmeval/cli.py","eval/src/cmeval/adapters/codemem.py","eval/src/cmeval/score.py","eval/src/cmeval/merge.py","eval/src/cmeval/collect/tasks_build.py"],"component":"eval-run"},"eval/src/cmeval/score.py":{"bytes":11158,"lines":227,"auto_summary":"Score a saved run: accuracy, tokens, and latency, written next to the run files.","symbols":[{"kind":"class","name":"ScoreError","line":37,"doc":"The run cannot be scored (missing files, tasks file changed since the run).","methods":[]},{"kind":"class","name":"ScoreSummary","line":42,"doc":"","methods":[]},{"kind":"def","name":"resolve_run","line":52,"doc":""},{"kind":"def","name":"run_tasks","line":61,"doc":"The run's tasks by id, from the tasks file the run used."},{"kind":"def","name":"_check_ious","line":79,"doc":""},{"kind":"def","name":"score","line":87,"doc":""}],"summary":"`cmeval score`: reads a run's files and writes per-task scores (scores.jsonl), means (summary.csv) and score-meta.json for every level, IoU threshold and metric.","details":"`resolve_run` accepts a run folder path or a run id under CMEVAL_HOME/runs. `run_tasks` loads the tasks file named in meta.json (or --tasks) and refuses if its sha256 differs from the run's, since labels must match the hits. Only tasks finished by every system are scored, with warnings for left-out tasks or a run not 'done'; k values above the run's k are dropped. All unique hit texts are token-counted once (Anthropic or estimate). For each system, task and level (file/class/function) it either writes an 'excluded' row with the reason or computes relevance per hit (file level ignores IoU; class/function at each IoU, 0.5 always first), turns file-level hits into unique-path units, and writes accuracy and token metrics rounded to 6 digits. summary.csv has the mean and n of each metric (plus not_found_share = 1 - found) and latency rows at level '-' where index costs come from the first system of each index group (the one that builds). score-meta.json records the token counter, estimate flag, overhead, API calls, IoUs, ks, budgets and texts counted; the CLI table shows file R@10/MRR, function R@10/MRR/tokens-to-first and median search ms.","key_symbols":["score: score a run and write scores.jsonl, summary.csv, score-meta.json","resolve_run: run id or path -> run folder","run_tasks: load the run's tasks with the sha256 check","DEFAULT_IOUS / MAIN_IOU: (0.5, 0.3, 0.7) and 0.5","ScoreSummary: rows, counter, estimate flag, CLI table, warnings","ScoreError: unscorable run"],"connects_to":["eval/src/cmeval/metrics/matching.py","eval/src/cmeval/metrics/accuracy.py","eval/src/cmeval/metrics/tokens.py","eval/src/cmeval/metrics/latency.py","eval/src/cmeval/files.py","eval/src/cmeval/paths.py","eval/src/cmeval/retriever.py","eval/src/cmeval/status.py","eval/src/cmeval/tasks.py","eval/src/cmeval/cli.py","eval/src/cmeval/report.py","eval/src/cmeval/compare.py","eval/src/cmeval/merge.py","eval/src/cmeval/run.py"],"component":"eval-score"},"eval/src/cmeval/static/dashboard.css":{"bytes":5708,"lines":92,"summary":"Styles for the dashboard in the 'eval-viz' palette (theme C, 'factory floor'): cards, state badges, progress meters, stats grid, per-repo bars, log box and the recent-jobs table.","details":"Colors are CSS variables on :root (cream background, ink, terra, mustard, teal, indigo, pass/reject). Fonts fall back to system fonts and nothing is loaded from other servers. The running badge pulses unless reduced motion is requested, and a 700px breakpoint narrows the grids.","connects_to":["eval/src/cmeval/static/dashboard.html","eval/src/cmeval/static/dashboard.js"],"component":"eval-report"},"eval/src/cmeval/static/dashboard.html":{"bytes":1639,"lines":35,"summary":"The dashboard page skeleton: a header with a connection indicator, a Running section for job cards, a Recent table, and a footer naming the status folder.","details":"It links /dashboard.css and /dashboard.js and uses an inline SVG data-URI favicon; empty-state messages are hidden and shown by the script.","connects_to":["eval/src/cmeval/dashboard.py","eval/s "fail","_speed","write"]},{"kind":"def","name":"read_all","line":247,"doc":"Every status file that can be read, newest start first. A file in the middle of a write is skipped."},{"kind":"def","name":"is_over","line":263,"doc":"True if the job will not change again: it ended, its process is gone, or it has not written"},{"kind":"def","name":"prune","line":277,"doc":"Delete finished status files beyond the newest `keep`, and old temp files from stopped writes."}],"summary":"Status files for long jobs: each run/score/collect/repo-stats job writes a small JSON file to CMEVAL_HOME/status every 2 seconds from a background thread, for the dashboard.","details":"The file is named `<job>-<UTC start to the ms>-<pid>.json` and holds job, name, argv, pid, timestamps, state (running/done/failed), error, stage, done/total/unit, rate per minute and ETA (measured over the last 5 minutes of this session; work already done before a resume is counted as done but not in the speed), per-part progress, retries, result values and the last 10 log lines. JobStatus is a context manager: on exit the state becomes done, or failed with the exception (also Ctrl-C); `fail()` marks failure when the CLI handles the error itself. Writes are atomic and every write error is swallowed, so status can never stop a job. `prune` keeps the newest 20 finished files and deletes temp files older than an hour; running jobs are never deleted. `is_over` treats a running job as over if its pid is gone (always assumed alive on Windows, since os.kill(pid, 0) would end the process there) or it has not written for 60 seconds. NullStatus is the no-op default used by library functions and tests.","key_symbols":["JobStatus: per-job status writer (stage, total, part, advance, log, result, fail)","NullStatus: no-op status interface","read_all: all readable status files, newest first","is_over: finished, dead pid, or stale for 60 s","prune: keep the newest 20 finished files","pid_alive: process check (True on Windows)","WRI :276,"doc":""}],"summary":"Tests the git side of fresh task collection (B2): finding the base commit, labeling the fix, filtering, and writing the task set.","details":"merge_base finds the commit before the fix for squash merges, merge commits (first parent) and rebase merges (back n commits, decided by matching commit subjects), and skips unknown merge commits. candidate_to_task builds a task with gold from code files only, test files in test_patch, docs dropped, and tags such as gold_languages, max_gold_file_bytes, link_method, code_lines_changed and repo_py_files. Candidates are skipped when GitHub's file list does not match the diff, there are no code files, too many code files or changed lines, or only new files; non-Python gold is kept with partial_labels. build_tasks fills the git funnel steps, drops only the candidate that hits a git error, reports progress per repo, and write_task_set saves tasks plus a meta file with counts and stats.","key_symbols":["test_squash_merge: base is the parent","test_merge_commit_uses_the_first_parent: merge commits","test_rebase_merge_goes_back_n_commits: rebase detection","test_candidate_to_task: gold, patches and tags","test_size_filters: no code files, too many files or lines","test_only_new_files_has_nothing_to_find: labeled step drop","test_build_tasks_fills_the_git_steps_and_writes_the_set: funnel counts and meta","test_a_git_error_drops_only_that_candidate: isolated failure"],"connects_to":["eval/src/cmeval/collect/tasks_build.py","eval/src/cmeval/collect/candidates.py","eval/src/cmeval/repos.py","eval/src/cmeval/github.py","eval/src/cmeval/tasks.py"],"component":"eval-tests"},"eval/uv.lock":{"bytes":521590,"lines":2674,"summary":"uv's lock file pinning the exact versions of every package in the eval environment (about 109 packages), including the optional codemem extra.","details":"Generated by uv, not edited by hand. It records codemem as an editable path dependency on `../` under the `codemem` extra.","connects_to":["eval/pyproject.toml"],"component":"eval-project"},"pyproject.toml":{"bytes":1428,"lines":47,"summary":"Package metadata and dependencies for codemem 0.2.0, the `codemem` console script, the hatchling build, and pytest settings.","details":"It requires Python >= 3.11 and pins tree-sitter >=0.25,<0.27 plus one official grammar per language (python, javascript, typescript, go, java, c, cpp, rust), along with pathspec, faiss-cpu >= 1.9, numpy, watchdog >= 5.0 and mcp >=2.3,<3. sentence-transformers >= 5.0 and torch >= 2.4 are core dependencies, with a comment that they are imported lazily so tests and the FakeEmbedder never load them. [project.scripts] maps `codemem` to codemem.cli:main. The only dev dependency group is pytest >= 8, and the wheel packages src/codemem with hatchling. pytest uses testpaths = ['tests'], declares the markers 'model' (needs the real jina model, about 1 GB) and 'api' (calls a real embedding API), and deselects both by default with addopts \"-m 'not model and not api'\".","key_symbols":["[project] dependencies: tree-sitter + 8 grammars, pathspec, faiss-cpu, numpy, watchdog, mcp, sentence-transformers, torch","[project.scripts] codemem = 'codemem.cli:main'","[dependency-groups] dev = pytest","[tool.pytest.ini_options]: markers model and api, deselected by default"],"connects_to":["src/codemem/cli.py","uv.lock",".python-version","README.md"],"component":"project"},"scripts/bench_freshness.py":{"bytes":4838,"lines":116,"auto_summary":"How long until an edit is searchable: the cost of an update on a big repo, without the model.","symbols":[{"kind":"def","name":"config","line":32,"doc":""},{"kind":"def","name":"edit_inside_a_function","line":38,"doc":"Append `_codemem_bench_edit = 1` after the last line of a mid-file function. Returns the"},{"kind":"def","name":"main","line":53,"doc":""}],"summary":"A benchmark of how long an edit takes to become searchable on a large repo, measuring codemem's own update work with the fake embedder rather than the model.","details":"Usage: python scripts/bench_freshness.py REPO INDEX_DIR FILE_TO_EDIT [--model fake:896] [--out JSON]. It builds a Config with vector_cache off and code and usage vectors on the given model, runs a full build if the index is empty, then times a no-op update, loading the search indexes once, a one-function edit (it appends `_codemem_bench_edit = 1` inside a mid-file function of at least 5 lines, chosen with chunk_source), and the undo, then saving the search indexes. It inspects Indexer.update's signature so it works on older codemem versions: it uses the paths= argument (the watcher's way) and save=False when available, else a full scan. The original file bytes are always restored in a finally block. Results (wall time, files changed, embedded counts, chunk counts, timings) are printed and optionally written as JSON with machine and version metadata. To get real save-to-searchable time you add the model's per-text cost, measured separately.","key_symbols":["config(model): Config with vector_cache='off' and code/usage vectors on one model","edit_inside_a_function(path, rel): inserts one line inside a mid-file function; returns the original bytes","main(): runs and times full build, no-op, load, edit, undo, save"],"connects_to":["src/codemem/indexer.py","src/codemem/store.py","src/codemem/chunker.py","src/codemem/config.py","src/codemem/__init__.py"],"component":"scripts"},"scripts/compare_scores.py":{"bytes":3454,"lines":73,"auto_summary":"Compare one system of one scored cmeval run against one system of another, task by task.","symbols":[{"kind":"def","name":"load","line":26,"doc":"(level, metric) -> task id -> value, for one system."},{"kind":"def","name":"main","line":42,"doc":""}],"summary":"Compares one system from one scored cmeval run against one system from another, task by task, with the same statistics as `cmeval report`.","details":"It is meant to run from the eval environment (cd eval && uv run python ../scripts/compare_scores.py SCORE
