S_A SYSTEM_A SCORES_B SYSTEM_B), since it imports paired_bootstrap_ci and wilcoxon from cmeval.metrics.stats. load() reads a scores.jsonl or scores.jsonl.gz file, keeps rows of the chosen system with numeric values, and for class and function levels keeps only rows at the requested IoU (default 0.5). For each level (file, class, function) and each accuracy metric (mrr, recall@1/5/10/20, success@10), it uses only tasks scored in both runs and prints n, the two means, B minus A, a paired bootstrap 95% interval and a two-sided Wilcoxon p-value. Token metrics (tokens_to_first, recall@budget1000/4000) are included only with --tokens, because the two runs may have counted tokens differently.","key_symbols":["load(path, system, iou): (level, metric) -> task id -> value","main(): prints the comparison table","ACCURACY and TOKENS: the metric names compared"],"connects_to":["eval/src/cmeval/metrics/stats.py","eval/results/2026-10-23-dev50-final"],"component":"scripts"},"scripts/smoke_real_model.py":{"bytes":3739,"lines":102,"auto_summary":"Smoke test with the real embedding model on a medium repo; records timings.","symbols":[{"kind":"def","name":"main","line":34,"doc":""}],"summary":"A smoke test and benchmark with the real embedding model: clones a medium repo (psf/requests v2.32.3 by default), indexes it from scratch, runs five queries and prints a JSON timing report.","details":"It clones with --depth 1 into a work dir (default <CODEMEM_HOME>/smoke) only if the folder does not exist, and uses a separate index folder next to it. It runs a full Indexer.update with progress on stderr every 5 s, then a no-op update to time catch-up, a warm-up search, and five fixed queries (for example 'retry a request when the connection fails') at k=5, recording median and max latency. The report includes the platform, device, model ids per vector type, store counts, full-index timings, embedded counts, no-op time and embeddings, query latency and the top results per query; --out also writes it to a file and --device overrides the configured device. It calls the library (Indexer, search) directly, not the service or MCP.","key_symbols":["QUERIES: the five fixed requests queries","main(): clone, full index, no-op update, timed queries, JSON report"],"connects_to":["src/codemem/indexer.py","src/codemem/search.py","src/codemem/store.py","src/codemem/config.py"],"component":"scripts"},"src/codemem/__init__.py":{"bytes":581,"lines":14,"auto_summary":"codemem: local hybrid code search for coding agents.","symbols":[],"summary":"Package marker for codemem. It sets the version string and applies a macOS-only OpenMP workaround before anything heavy is imported.","details":"It defines __version__ = '0.2.0', which the MCP server reports in its handshake, the CLI prints for --version, and the eval adapter imports as CODEMEM_VERSION. On macOS (sys.platform == 'darwin') it sets KMP_DUPLICATE_LIB_OK=TRUE and OMP_NUM_THREADS=1 with os.environ.setdefault, so any value the user already set wins. The comment explains why: the faiss-cpu and torch wheels each ship their own libomp, and starting both aborts the process ('OMP: Error #15'). Allowing the duplicate alone segfaults, so threads are also limited to one. This has to run before faiss or torch is imported, which is why it sits in the package __init__. On Windows and Linux the file does nothing beyond setting the version.","key_symbols":["__version__: '0.2.0', used by server.py, cli.py and the eval adapter","macOS OpenMP guard: setdefault of KMP_DUPLICATE_LIB_OK and OMP_NUM_THREADS before faiss/torch load"],"connects_to":["src/codemem/server.py","src/codemem/cli.py","eval/src/cmeval/adapters/codemem.py","scripts/bench_freshness.py"],"component":"cli"},"src/codemem/__main__.py":{"bytes":156,"lines":7,"auto_summary":"`python -m codemem ...`: the `codemem` command line, for when the command is not on PATH.","symbols":[],"summary":"Lets you run the CLI as `python -m codemem ...` when the `codemem` command is not on PATH.","details":"It imports main from cli.py and exits with its return code. This is not just a convenience: agents.launch_command() falls back to `<sys.executable> -m codemem mcp` when shutil.which('codemem') finds nothing, so agent configs written by `codemem init` from inside a virtualenv depend on this file. That fallback keeps working only while that Python environment exists.","key_symbols":["sys.exit(main()): runs cli.main() with the process arguments"],"connects_to":["src/codemem/cli.py","src/codemem/agents.py"],"component":"cli"},"src/codemem/agents.py":{"bytes":4171,"lines":110,"auto_summary":"Agent registration (`codemem init`): plan the config changes, then apply after confirmation.","symbols":[{"kind":"class","name":"Action","line":18,"doc":"","methods":["writes"]},{"kind":"def","name":"launch_command","line":29,"doc":"How an agent starts codemem: the `codemem` command when it is on PATH (uv tool, pipx),"},{"kind":"def","name":"_merge_mcp_json","line":37,"doc":""},{"kind":"def","name":"plan","line":48,"doc":""},{"kind":"def","name":"apply","line":98,"doc":""},{"kind":"def","name":"command_on_path","line":109,"doc":""}],"summary":"Registration with coding agents for `codemem init`: it plans the config file changes as a list of Actions, and applies them only after the CLI gets confirmation.","details":"Supported agents are claude, cursor and codex; any other name raises ValueError. launch_command() returns ('codemem', []) when the command is on PATH (uv tool, pipx), else (sys.executable, ['-m', 'codemem']). For Claude Code it merges an 'mcpServers.codemem' entry with command and args [..., 'mcp'] into <repo>/.mcp.json; no path argument is needed because Claude Code starts project servers in the project root, and the description also shows the equivalent `claude mcp add codemem -- ...` command. For Cursor it merges the same kind of entry into <repo>/.cursor/mcp.json with args [..., 'mcp', '${workspaceFolder}']. For Codex it only produces a printed TOML snippet for ~/.codex/config.toml ([mcp_servers.codemem] with the command and the repo's absolute POSIX path), because codemem never edits global files. _merge_mcp_json keeps other servers already in the file and refuses with ValueError if the existing file is not valid JSON. With --write-agent-notes (and steering not 'none') it appends the note to CLAUDE.md for claude and AGENTS.md for codex or cursor, skipping a file that already contains the marker. apply() creates parent folders and writes each file as UTF-8 with LF newlines.","key_symbols":["AGENTS = ('claude', 'cursor', 'codex')","Action: one planned change (agent, description, path or None for print-only, content)","launch_command(): 'codemem' if on PATH, else '<python> -m codemem'","plan(repo_root, agents, write_agent_notes=False, steering='light'): list of Actions","_merge_mcp_json(path, entry): adds mcpServers.codemem without dropping other servers","apply(actions): writes the files that have a path; returns written paths","command_on_path(): used by init to warn about the python -m fallback"],"connects_to":["src/codemem/cli.py","src/codemem/prompts.py","src/codemem/__main__.py","tests/test_frontends.py"],"component":"setup"},"src/codemem/callgraph.py":{"bytes":2080,"lines":51,"auto_summary":"Call-graph resolution: baseline name-matching heuristic.","symbols":[{"kind":"def","name":"is_test_path","line":18,"doc":"A Python-only heuristic, for Refs built without an `is_test` flag. Chunks carry their own"},{"kind":"def","name":"is_test_caller","line":25,"doc":""},{"kind":"def","name":"resolve_edges","line":29,"doc":"Link each call to every chunk defining that name."}],"summary":"The baseline call-graph resolver: links each call by name to every chunk that defines that name, within the same language family. Kept separate so a smarter, import-aware resolver can replace it later.","details":"resolve_edges() takes definitions as (chunk_id, name[, family]) and calls as (caller_id, callee_name[, family]) and returns a set of (caller_id, callee_id) edges. A call links to all definitions with the same name and family; a name defined more than max_defs_per_name times (default 5 in config) is ignored entirely, which keeps generic names like get or run from creating huge fan-out. Self-recursion edges are dropped. There is no import or scope analysis, so same-named functions in unrelated files are all linked. is_test_path() and is_test_caller() are a Python-only fallback used by the usage text builder only when a caller reference carries no is_test flag; chunks normally carry their own language-aware is_test.","key_symbols":["resolve_edges(definitions, calls, max_defs_per_name): name-matching edges within a language family","is_test_path(path): Python-style test file/directory heuristic","is_test_caller(path, name): test path or a test_* function name"],"connects_to":["src/codemem/indexer.py","src/codemem/texts.py","src/codemem/store.py"],"component":"callgraph"},"src/codemem/chunker.py":{"bytes":17475,"lines":386,"auto_summary":"tree-sitter chunking for every supported language, plus call extraction.","symbols":[{"kind":"def","name":"split_lines","line":36,"doc":"Lines as tree-sitter counts them: split on \"\\n\" only. str.splitlines() also splits on form"},{"kind":"def","name":"_one_line","line":42,"doc":""},{"kind":"class","name":"_Walker","line":47,"doc":"","methods":["__init__","unique_key","definition","container","has_definition","items","open","attached","calls_in","call_sites","module","members","nested","emit","flush","piece_bounds","block"]},{"kind":"class","name":"Chunks","line":361,"doc":"The chunks of one file; `parse_errors` says tree-sitter could only partly parse it.","methods":[]},{"kind":"def","name":"chunk_source","line":367,"doc":"Chunk one file. `path` is repo-relative with forward slashes; the language comes from its"}],"summary":"Turns one source file into chunks (functions, methods, classes and blocks of top-level code) using tree-sitter, and records which names each chunk calls. The walker is language-neutral; all syntax knowledge comes from a LanguageSpec.","details":"chunk_source() picks the language from the file extension (or the caller), parses the bytes with that language's tree-sitter parser and runs a _Walker over the tree. Each named function or method becomes a chunk spanning from its first decorator/annotation/attribute line to the end of its body; nested named functions get their own chunks with parent_key set, while anonymous functions (lambdas, callbacks) stay inside the enclosing chunk. A class-like type becomes one chunk covering the whole type, plus a 'skeleton' (header, field lines and member signatures, each cut to 200 chars) that is what gets embedded instead of the full code. Code between definitions is grouped into 'block' chunks of at most max_block_lines (default 200) lines; a single statement longer than that is cut by lines, with cut points chosen by content (a line whose crc32 has its 5 low bits clear, once a piece has a quarter of the maximum), so inserting a line only moves nearby cuts. Calls are collected per chunk in first-occurrence order with the line of each first call; calls in decorators count for the decorated function, calls in field initializers count for the class, and classes themselves get no direct calls. Keys are 'path::qualname', with '#2', '#3' for duplicates; block keys are 'path::<block>@<first 8 chars of content hash>'. Files with parse errors are still chunked from what tree-sitter recovered, and the returned Chunks list carries parse_errors=True. Lines are split on newline only (not str.splitlines) so line numbers match the parse tree.","key_symbols":["chunk_source(source, path, language=None, max_block_lines=200): chunks one file; raises ValueError for an unsupported language","Chunks: list subclass with a parse_errors flag","_Walker: generic tree walker that emits chunks for one file","_Walker.module: top level or namespace body; definitions become chunks, the statements between them become blocks","_Walker.members: class or impl body; member definitions become chunks, other statements become skeleton lines","_Walker.emit: builds a Chunk for one definition (range, qualname, kind, class_name, calls, is_test) and recurses into its body","_Walker.attached: comments and decorators directly above a definition (no blank line between)","_Walker.calls_in / call_sites: collect callee names and their lines, skipping nested named definitions when asked","_Walker.flush / block / piece_bounds: group top-level statements into block chunks and cut over-long runs by content-defined boundaries","split_lines: splits on newline only so line numbers match tree-sitter","MAX_BLOCK_LINES = 200: default maximum lines per block chunk"],"connects_to":["src/codemem/languages/__init__.py","src/codemem/languages/spec.py","src/codemem/schema.py","src/codemem/indexer.py"],"component":"chunking"},"src/codemem/cli.py":{"bytes":11514,"lines":278,"auto_summary":"`codemem` command line. Human output on stdout, logs/progress on stderr, `--json` for scripts.","symbols":[{"kind":"def","name":"_progress_printer","line":17,"doc":""},{"kind":"def","name":"_service","line":31,"doc":""},{"kind":"def","name":"_print_stats","line":38,"doc":""},{"kind":"def","name":"cmd_index","line":53,"doc":""},{"kind":"def","name":"cmd_init","line":79,"doc":""},{"kind":"def","name":"_download_model","line":118,"doc":""},{"kind":"def","name":"cmd_search","line":126,"doc":""},{"kind":"def","name":"cmd_status","line":154,"doc":""},{"kind":"def","name":"cmd_watch","line":164,"doc":""},{"kind":"def","name":"cmd_languages","line":186,"doc":""},{"kind":"def","name":"cmd_mcp","line":195,"doc":""},{"kind":"def","name":"build_parser","line":202,"doc":""},{"kind":"def","name":"main","line":254,"doc":""}],"summary":"The `codemem` command line (entry point codemem.cli:main): init, index, search, status, watch, mcp and languages. Human output goes to stdout, logs and progress to stderr, and --json gives machine output.","details":"main() first reconfigures stdout and stderr to UTF-8 with errors='replace', because Windows consoles default to cp1252 and code previews can contain any character. It configures stderr logging (WARNING, or DEBUG with -v) for every command except mcp, which sets up its own logging, resolves --index-dir to an absolute path, and turns a TimeoutError into exit code 1. `init` plans agent config changes with agents.plan, prints them (the Codex snippet is printed, never written), asks 'Write N file(s)? [y/N]' unless -y, honours --dry-run, warns on stderr if `codemem` is not on PATH, and then builds the index by calling cmd_index, or with --no-index just downloads and warms the embedding model (skipped for a remote API). `index` builds an Indexer directly on the service's store and runs update(full=...); --no-cache sets vector_cache='off' and --verify compares the result with a fresh build and exits 1 on any difference. `search` refuses with exit 2 when there is no index, supports --signals, --path-prefix, --kinds, --language, --tests/--exclude-tests, --json, --debug (per-signal ranks on each card, timings in ms on stderr) and --no-preview, and finds the repo with --repo rather than a positional path. `watch` runs a blocking update, then start(prewarm=False), and prints new stats whenever the background writer produces them until Ctrl+C.","key_symbols":["main(argv=None): UTF-8 streams, logging, dispatch, TimeoutError -> exit 1","build_parser(): argparse with the seven subcommands and their flags","cmd_init(args): agents.plan/apply with confirmation, PATH note, then index or model download","cmd_index(args): Indexer(...).update(full), optional --verify via Indexer.verify()","cmd_search(args): CodememService.search then format_results or JSON","cmd_status(args): CodememService.status(check_staleness=True) then format_status or JSON","cmd_watch(args): update(), start(prewarm=False), print stats loop","cmd_mcp(args): server.run_stdio(path, index_dir)","cmd_languages(args): prints languages.LANGUAGES with their extensions","_download_model(config): loads the code model once so an agent's first search doesn't wait for a download","_progress_printer(enabled): throttled 'phase: done/total' progress on stderr"],"connects_to":["src/codemem/service.py","src/codemem/agents.py","src/codemem/server.py","src/codemem/render.py","src/codemem/indexer.py","src/codemem/config.py","src/codemem/embedder.py","src/codemem/languages","src/codemem/__main__.py","pyproject.toml","tests/test_frontends.py"],"component":"cli"},"src/codemem/config.py":{"bytes":20489,"lines":413,"auto_summary":"Settings, paths and per-vector-type model config.","symbols":[{"kind":"class","name":"VectorConfig","line":55,"doc":"","methods":[]},{"kind":"class","name":"EmbeddingConfig","line":66,"doc":"Where embeddings come from (docs/decisions.md §2). `local` runs the model on this machine:","methods":["remote","index_settings"]},{"kind":"def","name":"_default_vectors","line":96,"doc":""},{"kind":"class","name":"Config","line":101,"doc":"","methods":["enabled_vec_types","model_id","effective_window_chars","bm25_weights5","index_settings"]},{"kind":"def","name":"codemem_home","line":207,"doc":""},{"kind":"def","name":"model_version","line":218,"doc":"The weights version of a vector type's model: its `version`, else a hash of a local"},{"kind":"def","name":"_model_files","line":227,"doc":""},{"kind":"def","name":"model_folder_hash","line":236,"doc":"sha256 over every file's relative path and content, first 12 hex characters. Content, not"},{"kind":"def","name":"default_index_dir","line":280,"doc":""},{"kind":"def","name":"find_repo_root","line":286,"doc":"Walk up from `start` to the nearest directory containing .git; else `start` itself."},{"kind":"def","name":"_deep_merge","line":295,"doc":""},{"kind":"def","name":"_read_toml","line":305,"doc":""},{"kind":"def","name":"_env_overrides","line":312,"doc":""},{"kind":"def","name":"config_from_dict","line":334,"doc":""},{"kind":"def","name":"load_config","line":408,"doc":""}],"summary":"All settings, their defaults and validation, the per-vector-type model config, paths (codemem home, default index folder, repo root), and the content-hash versioning of local model folders.","details":"load_config() merges, later winning: built-in defaults, ~/.codemem/config.toml (or under CODEMEM_HOME), <repo>/.codemem.toml, then environment variables (CODEMEM_DEVICE, CODEMEM_STEERING, CODEMEM_MODEL for every vector type, CODEMEM_VECTOR_CACHE). config_from_dict() reads flat keys plus the [vectors.<type>], [bm25], [rrf], [usage] and [embedding] tables, and rejects unknown vector or embedding keys, unknown devices, dtypes, steering modes, kinds, languages, vector types without a text builder, and bad plugin specs. Settings are either index-time (index_settings() lists them; the indexer and the eval harness compare them to decide whether an index can be reused) or search-time (RRF, candidates, filters, weights, steering, previews). model_id() names a vector type's embedding space as model[@dim][#version][+embedder] and stays the old plain string when no version or plugin is set. A local model folder's version defaults to the first 12 hex chars of a SHA-256 over every non-dot file's relative path and content hash, with per-file hashes cached by size and mtime in <CODEMEM_HOME>/model_hashes.json. The [embedding] table switches to a remote OpenAI-compatible provider, whose settings are added to index_settings only when remote, so local indexes keep their settings. default_index_dir() is <CODEMEM_HOME>/indexes/<repo folder name>-<first 8 hex chars of SHA-1 of the normalized absolute path>.","key_symbols":["Config: dataclass of every setting with defaults","Config.index_settings(): every setting that changes what an index stores","Config.model_id(vec_type): identity of a vector type's embedding space","Config.effective_window_chars(): window_chars or max(3*(max_seq_length-32), 1000)","VectorConfig: model, enabled, embedder plugin, version for one vector type","EmbeddingConfig: local vs openai provider, base_url, api_key_env, prefixes, batching","load_config(repo_root) / config_from_dict(raw): merge layers and validate","model_version / model_folder_hash: weights version for local model folders","codemem_home(): CODEMEM_HOME or ~/.codemem","default_index_dir(repo_root) / find_repo_root(start): index location and nearest .git ancestor","ALWAYS_SKIP_DIRS / DEFAULT_IGNORE: directories and patterns never or by default not indexed","TEXT_FORMAT_VERSION = 3 / CHUNKER_VERSION = 2: bumped to invalidate texts or force rebuilds"],"connects_to":["src/codemem/indexer.py","src/codemem/embedder.py","src/codemem/service.py","src/codemem/search.py","src/codemem/cli.py","src/codemem/texts.py","src/codemem/languages/__init__.py","src/codemem/schema.py","src/codemem/watcher.py"],"component":"config"},"src/codemem/embedder.py":{"bytes":19234,"lines":452,"auto_summary":"Embedder interface: the local sentence-transformers (jina) embedder, any OpenAI-compatible","symbols":[{"kind":"def","name":"l2_normalize","line":47,"doc":""},{"kind":"class","name":"Embedder","line":53,"doc":"","methods":["dim","key","embed_documents","embed_queries","ready"]},{"kind":"class","name":"FakeEmbedder","line":78,"doc":"Deterministic hashed bag-of-tokens vectors. No downloads, ~instant.","methods":["__init__","dim","key","_embed","embed_documents","embed_queries"]},{"kind":"def","name":"resolve_device","line":115,"doc":""},{"kind":"def","name":"resolve_dtype","line":139,"doc":"auto = float16 on GPUs (cuda, mps), float32 elsewhere."},{"kind":"class","name":"SentenceTransformerEmbedder","line":146,"doc":"jina-code-embeddings (or any sentence-transformers model), loaded lazily.","methods":["__init__","ready","device","dtype","key","model","dim","_encode","embed_documents","embed_queries"]},{"kind":"class","name":"OpenAIEmbedder","line":256,"doc":"Any OpenAI-compatible `/embeddings` endpoint: Nebius, OpenAI, Together, a self-hosted vLLM","methods":["__init__","host","key","dim","_http","_headers","_request","_embed","embed_documents","embed_queries"]},{"kind":"def","name":"_retry_after","line":370,"doc":"The server's Retry-After, in seconds (capped at a minute), when it sends one."},{"kind":"class","name":"PluginEmbedder","line":378,"doc":"An embedder class named in config (`vectors.<type>.embedder = \"module:Class\"`), built","methods":["__init__","dim","key","ready","embed_documents","embed_queries"]},{"kind":"def","name":"make_embedder","line":415,"doc":"Build (or reuse) the embedder for a vector type's settings (or a bare model name), in this"}],"summary":"The embedding layer: a common Embedder interface with four implementations (local sentence-transformers model, any OpenAI-compatible API, a plugin class named in config, and a fake for tests) and a cached factory that picks one.","details":"Every embedder returns float32, L2-normalized vectors at the model's full dimension; Matryoshka truncation is left to the store, so changing embedding_dim never re-embeds. Each embedder has a 'key' naming its document-vector space, and vectors with equal keys are reused across chunks, indexes and the shared cache. SentenceTransformerEmbedder loads the model lazily on first use (default jinaai/jina-code-embeddings-0.5b), resolves the device (auto picks cuda, then mps, else cpu; xpu is used only if torch.xpu is available, otherwise it falls back to cpu with a warning) and dtype (auto means float16 on cuda/mps, float32 otherwise), caps max_seq_length, and uses the model's nl2code_query / nl2code_document prompts or built-in fallback prefixes. Rows that come out non-finite in float16 are recomputed in float32. OpenAIEmbedder posts to <base_url>/embeddings in batches with up to max_concurrency requests in flight, retries 429, 5xx and connection errors up to 6 times with doubling backoff (honouring Retry-After, capped at 60 s), and reads the API key from the named environment variable on every request. PluginEmbedder wraps a user class loaded from 'module:Class', checks that it subclasses Embedder, and normalizes its output. Both real embedders keep an LRU cache of the last 512 query vectors. make_embedder() caches instances by settings; a model named 'fake' or 'fake:<dim>' always wins (default dim 64), then a plugin, then the remote API, then the local model.","key_symbols":["Embedder: abstract interface (dim, key, embed_documents, embed_queries, ready)","SentenceTransformerEmbedder: lazy local model with prompts, device/dtype resolution and float16 overflow retry","OpenAIEmbedder: OpenAI-compatible /embeddings client with batching, concurrency and retries","PluginEmbedder: wraps a config-named 'module:Class' embedder and names its vectors","FakeEmbedder: deterministic hashed bag-of-tokens vectors, not semantic","make_embedder(spec, config): cached factory choosing fake, plugin, API or local","resolve_device / resolve_dtype: turn 'auto' and requested devices into what is available","l2_normalize: row-wise normalization, safe for zero rows","QUERY_PROMPT / DOCUMENT_PROMPT: 'nl2code_query' / 'nl2code_document'"],"connects_to":["src/codemem/config.py","src/codemem/plugins.py","src/codemem/tokenize.py","src/codemem/indexer.py","src/codemem/search.py","src/codemem/service.py"],"component":"embeddings"},"src/codemem/indexer.py":{"bytes":48780,"lines":999,"auto_summary":"Indexing: one update function for the first build, a reconcile and a single save.","symbols":[{"kind":"class","name":"FileState","line":74,"doc":"","methods":[]},{"kind":"class","name":"ScanResult","line":82,"doc":"","methods":["is_clean"]},{"kind":"class","name":"IndexStats","line":96,"doc":"","methods":["to_dict","add_time"]},{"kind":"class","name":"IgnoreRules","line":128,"doc":".gitignore files (root and nested) + always-skip dirs + config extras.","methods":["__init__","load_dir","ensure_dir","ignored","skip_dir","allows"]},{"kind":"def","name":"_rules_for","line":181,"doc":""},{"kind":"def","name":"indexed_extensions","line":186,"doc":"File extensions to read, for the configured languages (`.h` serves both C and C++)."},{"kind":"def","name":"walk_repo","line":195,"doc":"Every file the index should read (repo-relative path -> absolute path), and the coverage:"},{"kind":"def","name":"walk_source_files","line":238,"doc":"Repo-relative (forward slash) path -> absolute path for every file in a supported language."},{"kind":"def","name":"skip_reason","line":243,"doc":"Why a readable source file is kept out of the index, or None."},{"kind":"def","name":"git_head","line":255,"doc":""},{"kind":"def","name":"git_commit_subjects","line":267,"doc":"Commit subjects touching `rel`, only up to `commit` (no future leakage for evals)."},{"kind":"def","name":"_exists_exactly","line":279,"doc":"`path` exists with exactly this name. On a case-insensitive disk, `stat(\"Foo.py\")` still"},{"kind":"def","name":"_content_fields","line":291,"doc":"Every chunk field the store keeps except its id and its position. A chunk whose parent (a"},{"kind":"def","name":"_moved_by","line":301,"doc":"How many lines a chunk moved (0: not at all), when moving is all that changed; None if more"},{"kind":"def","name":"_order","line":310,"doc":""},{"kind":"def","name":"_model_calls","line":314,"doc":"Consecutive runs of at most `size` texts and, if set, `chars` characters (a longer text"},{"kind":"def","name":"_family","line":330,"doc":""},{"kind":"def","name":"_definitions","line":335,"doc":"(language family, name) -> ids of the chunks a call by that name can resolve to."},{"kind":"class","name":"_TypeWork","line":345,"doc":"One vector type's part of a stage-B batch.","methods":[]},{"kind":"class","name":"_Batch","line":360,"doc":"","methods":[]},{"kind":"class","name":"Indexer","line":366,"doc":"","methods":["__init__","_seconds_for","_observe_speed","searching","searches_waiting","_locked","ignore_rules","reset_rules","allows","_classify","scan","scan_paths","_relative","_files_under","_changed_tiers","_embedders","_commits_moved","_vector_cache","structure","_relink","_wipe","_apply_file","embed_pending","_build_context","_take","_compute","_put","update","finish","verify"]}],"summary":"Runs index updates, both the first full build and incremental ones: finds changed files, re-chunks them, applies the chunk changes and call links (stage A), then embeds the queued texts (stage B). Also checks that an incremental index equals a fresh build.","details":"Stage A, structure(), runs under an in-process write lock plus the cross-process write.lock file and in one SQLite transaction. It compares the stored index settings with the config: a changed setting outside the known tiers wipes and rebuilds the index, 'links' (max_defs_per_name) re-resolves every call, and the other tiers mark every chunk for a text check. Files come from a full scan (walk, then mtime+size pre-check, then SHA-256) or from scan_paths() for watcher-reported paths, which always reads and hashes. Each re-chunked file is diffed by chunk key: identical chunks are left alone, chunks that only moved get their line numbers shifted (unless definitions were reordered), and new or changed chunks are rewritten. Only calls that can have new targets are relinked: calls made by changed chunks, and calls anywhere to names whose definition set changed. Changed chunks, the chunks they call, what deleted chunks called and chunks whose callers changed are queued in dirty_texts with a sequence number. Stage B, embed_pending(), takes batches of up to 512 queued chunks newest edits first, rebuilds their texts, and for each changed text hash tries this index's stored vectors, then the shared vector cache, and only then the model, which runs outside the write lock in calls of up to 256 texts (longest first, code before usage). A batch only stores chunks whose sequence number is unchanged since it was claimed, so edits made meanwhile stay queued, and the deadline and stop hooks let a search interrupt background embedding after at most one model call. Files are skipped and recorded with a reason when larger than max_file_size, binary (a NUL byte in the first 8 KB), generated ('Code generated ... DO NOT EDIT' or '@generated' in the first 2 KB), or minified JS/TS (a line over 5000 chars).","key_symbols":["Indexer: owns one index update pipeline for a repo, store and config","Indexer.update(full, paths, save): stage A, stage B until empty, then save the search index files","Indexer.structure: stage A; scan, chunk, diff by key, relink, queue dirty texts, write meta","Indexer.embed_pending: stage B; drain the queue in batches with optional deadline and stop","Indexer._take / _compute / _put: claim a batch and find reusable vectors; run the model; store complete chunks","Indexer._apply_file: write one file's chunk diff (added, changed, moved, deleted)","Indexer._relink: re-resolve only the calls that can have changed targets","Indexer.scan / scan_paths / _classify: decide which files are unchanged, touched, skipped, changed or deleted","Indexer.verify: builds a fresh index in a temp folder and diffs snapshots","IgnoreRules / walk_repo: .gitignore files (root and nested), always-skip dirs and config patterns","skip_reason: binary, generated or minified detection","IndexStats: counters and timings for one update"],"connects_to":["src/codemem/store.py","src/codemem/chunker.py","src/codemem/texts.py","src/codemem/embedder.py","src/codemem/callgraph.py","src/codemem/vectorcache.py","src/codemem/config.py","src/codemem/languages/__init__.py","src/codemem/schema.py","src/codemem/service.py","src/codemem/cli.py"],"component":"indexer"},"src/codemem/languages/__init__.py":{"bytes":1469,"lines":43,"auto_summary":"Language registry: which files codemem reads, and how each language's syntax maps to chunks.","symbols":[{"kind":"def","name":"supported_languages","line":21,"doc":""},{"kind":"def","name":"get_language","line":25,"doc":""},{"kind":"def","name":"language_for_path","line":32,"doc":"The language of a file by its extension (`.h` is sniffed from its content), else None."}],"summary":"The language registry: builds one instance of every LanguageSpec and maps file extensions to language names. It decides which files codemem reads and which spec chunks them.","details":"LANGUAGES is a dict from language name to spec instance for python, javascript, typescript, tsx, go, java, c, cpp and rust, built once at import time. EXTENSIONS maps every extension listed by a spec to its language name. language_for_path() lowercases the file suffix and looks it up, except for '.h', which is sniffed from the file's bytes by header_language() (C++ if C++-only syntax appears, else C). get_language() raises a ValueError listing the supported names for an unknown language. There is no plugin mechanism for languages: adding one means writing a LanguageSpec subclass and adding it to the tuple here.","key_symbols":["LANGUAGES: name -> LanguageSpec instance for the nine supported languages","EXTENSIONS: file extension -> language name","language_for_path(path, data=None): language by extension, with '.h' sniffed from content; None if unsupported","get_language(name): the spec, or ValueError with the supported list","supported_languages(): list of language names"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/python.py","src/codemem/languages/javascript.py","src/codemem/languages/go.py","src/codemem/languages/java.py","src/codemem/languages/c_family.py","src/codemem/languages/rust.py","src/codemem/chunker.py","src/codemem/indexer.py","src/codemem/texts.py","src/codemem/store.py","src/codemem/config.py"],"component":"languages"},"src/codemem/languages/c_family.py":{"bytes":8354,"lines":173,"auto_summary":"C and C++ (including CUDA): functions, methods (in-class and out-of-line `A::b`), function-like","symbols":[{"kind":"class","name":"C","line":22,"doc":"","methods":["definition","_record","_declarator_name","_test_macro","signature","callee","is_test_definition"]},{"kind":"class","name":"Cpp","line":129,"doc":"","methods":["definition","container"]},{"kind":"def","name":"header_language","line":170,"doc":""}],"summary":"LanguageSpecs for C and C++ (including CUDA): functions, in-class and out-of-line methods, function-like macros, structs/unions/enums/classes, namespaces, templates and gtest-style TEST macros. Also decides whether a '.h' header is C or C++.","details":"C handles .c and .h; Cpp handles .cc, .cpp, .cxx, .c++, .hpp, .hh, .hxx, .h++, .ipp, .tpp, .inl, .cu and .cuh. A function's name is found by walking pointer, reference, attributed and parenthesized declarators down to the function declarator; an out-of-line 'SessionManager<T>::ExpireOld' becomes name ExpireOld with scope SessionManager (template arguments stripped). Destructors (~Name) and C++ constructors (name equal to the last scope part) get subkinds. Function-like #define macros become function chunks with subkind 'macro'; struct/union/enum (and class in C++) become class-like chunks, including 'typedef struct {...} name_t;' and 'struct x {...} instance;'. Preprocessor #if/#ifdef/#else/#elif blocks are transparent, and C++ adds extern \"C\" linkage blocks and namespaces (as containers, '<anonymous>' if unnamed); a template_declaration is unwrapped so the template line is part of the range. gtest TEST(Suite, Name) and similar macros parse as a function named TEST and become a function named 'Suite.Name' with subkind 'test_macro', which marks it as a test. header_language() returns 'cpp' when the first 64 KB of a .h file show C++-only syntax (template<, namespace, class with a body, using namespace, access specifiers, std::, or a ::name( call), else 'c'.","key_symbols":["C: spec for C files (.c, .h)","Cpp: C subclass for C++ and CUDA extensions, with classes, namespaces, templates and extern blocks","C.definition: functions, macros, records, typedef'd records and declared records","C._declarator_name: (name, qualifiers) through nested declarators","C._test_macro: names a gtest TEST(Suite, Name) chunk 'Suite.Name'","C.callee: identifier, field name, or last part of a qualified/template name","Cpp.container: namespace_definition as a Container","header_language(data): sniffs C vs C++ for .h files"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/__init__.py"],"component":"lang-c"},"src/codemem/languages/go.py":{"bytes":3492,"lines":81,"auto_summary":"Go: functions, methods (qualified by their receiver type) and struct/interface types.","symbols":[{"kind":"class","name":"Go","line":14,"doc":"","methods":["definition","_type_spec","_receiver_type","signature","callee","is_test_definition"]}],"summary":"The Go LanguageSpec: functions, methods qualified by their receiver type, and struct and interface types.","details":"Handles .go with tree_sitter_go. Methods get their receiver's type name (pointer star and generic parameters removed, so 'List[T]' becomes 'List') as a scope, which makes their qualname 'Type.method' and their kind 'method'. A 'type X struct {...}' or interface becomes a class-like chunk with subkind struct or interface, and its signature is written as 'type X struct' or 'type X interface'. A grouped 'type ( A struct{}; B interface{} )' declaration is transparent, so each spec inside becomes its own chunk; a single-spec type declaration keeps the 'type' keyword line in its range. Imports and the package clause count as import statements for block labels. Test files are *_test.go, and functions named Test*, Benchmark*, Fuzz* or Example* (followed by an uppercase letter, digit, underscore or nothing) are tests.","key_symbols":["Go: spec for .go files","Go.definition: functions, methods with receiver scope, and struct/interface type specs","Go._type_spec: builds a class-like Definition for struct or interface types","Go._receiver_type: receiver type name without pointer or generic arguments","Go.signature: 'type Name struct|interface' for types","Go.is_test_definition: Test/Benchmark/Fuzz/Example name rule"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/__init__.py"],"component":"lang-go"},"src/codemem/languages/java.py":{"bytes":2456,"lines":55,"auto_summary":"Java: classes, interfaces, enums, records, methods and constructors. Annotations are part of","symbols":[{"kind":"class","name":"Java","line":15,"doc":"","methods":["definition","callee","is_test_definition"]}],"summary":"The Java LanguageSpec: classes, interfaces, enums, records, annotation types, methods and constructors, with annotations included in a definition's lines.","details":"Handles .java with tree_sitter_java. Methods, constructors and compact (record) constructors are functions; constructors get subkind 'constructor' and annotation type declarations get subkind 'annotation'. Annotations sit inside the definition's modifiers node, so they are already part of its line range. Enum bodies are opened through enum_body_declarations so methods inside enums are found. Comments are line_comment and block_comment, and import and package declarations count as imports. Calls are method invocations (by method name) and object creations ('new Foo<T>()' resolves to 'Foo', the last part of a dotted name). Test files match *Test.java, *Tests.java, *IT.java or Test*.java, and methods annotated @Test, @ParameterizedTest, @RepeatedTest, @TestFactory or @TestTemplate are tests.","key_symbols":["Java: spec for .java files","Java.definition: adds constructor and annotation subkinds","Java.callee: method name, or the created class's simple name for 'new'","Java.is_test_definition: JUnit-style test annotations in the method's modifiers"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/__init__.py"],"component":"lang-java"},"src/codemem/languages/javascript.py":{"bytes":5717,"lines":114,"auto_summary":"JavaScript, TypeScript and TSX: functions, methods, classes, interfaces, enums and named","symbols":[{"kind":"class","name":"JavaScript","line":14,"doc":"","methods":["definition","callee"]},{"kind":"class","name":"TypeScript","line":88,"doc":"","methods":["class_subkind","container"]},{"kind":"class","name":"TSX","line":111,"doc":"","methods":[]}],"summary":"LanguageSpecs for JavaScript, TypeScript and TSX: functions, methods, classes, interfaces, enums, and named function values such as 'const f = () => {}' or 'exports.f = function () {}'.","details":"JavaScript covers .js, .jsx, .mjs and .cjs; TypeScript (.ts, .mts, .cts) and TSX (.tsx) subclass it with the tree_sitter_typescript grammar, and all three share the family 'js' so calls resolve across them. An export statement is unwrapped so the exported declaration is the definition and the 'export' line is part of its range; an anonymous exported function value is named 'default'. A const/let/var declaration with exactly one declarator whose value is a function becomes a function chunk with subkind 'arrow', as do class fields holding functions; an assignment of a function to an identifier or member (exports.f = ...) gets subkind 'assigned'. A method named constructor gets subkind 'constructor'. TypeScript adds abstract classes, interfaces and enums as class-like types and treats 'namespace X { ... }' as a container. Calls include both call_expression and new_expression, and callee() returns the identifier or the member property name. Test files are *.test.* and *.spec.*, and __mocks__ is an extra test directory.","key_symbols":["JavaScript: spec for .js/.jsx/.mjs/.cjs","TypeScript: subclass for .ts/.mts/.cts with interfaces, enums, abstract classes and namespaces","TSX: subclass for .tsx using the tsx grammar","JavaScript.definition: handles export statements, arrow-function variables, function-valued fields and assignments","JavaScript.callee: identifier or member property for calls and 'new' expressions","TypeScript.container: 'namespace Auth { }' (expression_statement > internal_module) as a Container"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/__init__.py"],"component":"lang-js"},"src/codemem/languages/python.py":{"bytes":3354,"lines":86,"auto_summary":"Python: functions, methods, classes; decorators are part of the definition's lines.","symbols":[{"kind":"def","name":"_docstring","line":13,"doc":""},{"kind":"class","name":"Python","line":30,"doc":"","methods":["definition","callee","docstring","lead_comment","module_docstring","is_test_definition"]}],"summary":"The Python LanguageSpec: functions, methods and classes, with decorators included in a definition's line range and the in-code docstring used as the docstring.","details":"Handles .py and .pyi files with tree_sitter_python and uses '#' as the comment prefix for embedded-text headers. A decorated_definition is unwrapped so the inner function or class is the definition while the decorators' lines form its outer range. Control-flow statements (if/elif/else, try/except/finally, with, for, while) are transparent: they are opened only when they contain a definition, so code under 'if TYPE_CHECKING:' or a try/except import fallback is chunked. The docstring is the first string statement of the body, evaluated with ast.literal_eval and cleaned with inspect.cleandoc; the file's module docstring is attached to the first block chunk. Comments above a definition go to lead_comment, but a comment that trails code on its own line is excluded. Test files are test_*.py, *_test.py, conftest.py and test_*.pyi, and a function named test_* or 'test' is a test definition. callee() returns the bare name for 'f()' and the attribute name for 'a.b.f()'.","key_symbols":["Python: LanguageSpec for .py and .pyi","Python.definition: unwraps decorated_definition and keeps the decorators in the outer range","Python.callee: name for identifiers, attribute name for a.b.c()","Python.docstring / _docstring: first string statement of a body, cleaned","Python.lead_comment: comments above the definition, excluding trailing comments of code","Python.module_docstring: the module's own docstring","Python.is_test_definition: names starting with test_ or equal to test"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/__init__.py"],"component":"lang-python"},"src/codemem/languages/rust.py":{"bytes":2489,"lines":56,"auto_summary":"Rust: functions, methods (qualified by their impl type), structs, enums, unions and traits.","symbols":[{"kind":"class","name":"Rust","line":15,"doc":"","methods":["container","callee","is_test_definition"]}],"summary":"The Rust LanguageSpec: functions, methods qualified by their impl type, structs, enums, unions and traits, with #[...] attributes included in a definition's lines.","details":"Handles .rs with tree_sitter_rust. Attribute items directly above a definition are treated like decorators, so they extend its line range. 'mod name { ... }' is a namespace container, and 'impl Type { ... }' is a member container: its functions become methods with the impl type (template arguments and path removed) as their class and qualifier, and an impl produces no block chunks of its own. Structs, enums, unions and traits are class-like chunks. callee() handles plain identifiers, method calls via field expressions, scoped paths like a::b() and generic calls like f::<T>(). Test files are *_test.rs, and a function with a #[test], #[rstest], #[test_case] or #[quickcheck] attribute (optionally path-qualified, like tokio::test) is a test.","key_symbols":["Rust: spec for .rs files","Rust.container: mod blocks as namespaces, impl blocks as member scopes","Rust.callee: identifier, field, scoped or generic function names","Rust.is_test_definition: test attributes on functions"],"connects_to":["src/codemem/languages/spec.py","src/codemem/languages/__init__.py"],"component":"lang-rust"},"src/codemem/languages/spec.py":{"bytes":8596,"lines":197,"auto_summary":"How one programming language maps onto codemem's chunks.","symbols":[{"kind":"def","name":"text_of","line":21,"doc":""},{"kind":"def","name":"end_row","line":27,"doc":"0-based last row of a node. A node that ends at column 0 ends on the row before: tree-sitter"},{"kind":"def","name":"strip_template_args","line":37,"doc":"`SessionManager<T>::ExpireOld` -> `SessionManager::ExpireOld` (nested brackets too)."},{"kind":"def","name":"clean_comment","line":49,"doc":"Comment text without its markers: `/** a\\n * b */` -> `a\\nb`, `/// a` -> `a`."},{"kind":"class","name":"Definition","line":62,"doc":"A named function or class found by a LanguageSpec.","methods":[]},{"kind":"class","name":"Container","line":75,"doc":"A namespace-like node: adds a qualifier and holds definitions, but is not a chunk itself.","methods":[]},{"kind":"class","name":"LanguageSpec","line":83,"doc":"","methods":["language","parser","definition","name_of","class_subkind","container","callee","signature","docstring","lead_comment","module_docstring","is_test_path","is_test_definition","__repr__"]}],"summary":"Defines LanguageSpec, the base class that describes how one language's tree-sitter nodes map onto codemem chunks, plus the Definition and Container records and small text helpers.","details":"A LanguageSpec is mostly data: sets of tree-sitter node types for functions, classes, transparent wrappers (like 'if TYPE_CHECKING:' or '#ifdef'), blocks, comments, decorators, imports and calls, plus candidate sets that let the walker skip other node types cheaply. Hook methods (definition, container, callee, signature, docstring, lead_comment, module_docstring, is_test_definition) have generic defaults that languages override where their syntax is unusual. The grammar is loaded lazily from the module named in grammar_module (cached per spec), and parser() returns a fresh tree-sitter Parser. The default signature is the definition text up to its body, joined onto one line with a trailing '{' removed. The doc rule is shared: the comment block directly above a definition is its docstring, unless docstring_in_code is set (Python), in which case those comments go to lead_comment. is_test_path() marks files under tests/__tests__/testdata/spec/specs anywhere, test/testing only at the top level or under src/, or matching the language's file patterns. 'family' groups languages that can call each other by name for call resolution.","key_symbols":["LanguageSpec: base class; node-type sets plus overridable hooks","LanguageSpec.definition(node): returns a Definition for a function or class node that has a name and a body","LanguageSpec.signature(defn): definition text before its body, on one line","LanguageSpec.docstring / lead_comment: where the comments above a definition go","LanguageSpec.is_test_path(path): test-directory and file-pattern rules","LanguageSpec.language / parser(): lazily loaded tree-sitter grammar and a new parser","Definition: kind, name, node, outer (lines of the chunk), body, subkind, scope qualifiers","Container: a namespace-like node (namespace, mod, impl) that adds a qualifier but is not a chunk","end_row(node): last row, treating an end at column 0 as the previous row","strip_template_args(name): removes <...> template arguments, nested ones too","clean_comment(text): strips /* */, *, //, ///, # markers from comment text"],"connects_to":["src/codemem/chunker.py","src/codemem/languages/__init__.py","src/codemem/languages/python.py","src/codemem/languages/javascript.py","src/codemem/languages/go.py","src/codemem/languages/java.py","src/codemem/languages/c_family.py","src/codemem/languages/rust.py","src/codemem/texts.py"],"component":"languages"},"src/codemem/plugins.py":{"bytes":809,"lines":22,"auto_summary":"Load plugin classes named in config as \"module:attr\" (e.g. \"mypkg.embed:MyEmbedder\").","symbols":[{"kind":"def","name":"load_object","line":9,"doc":""}],"summary":"A tiny loader that imports an object named in config as 'module:attr', used for plugin embedders and plugin vector backends.","details":"load_object() splits the spec at the first colon, imports the module and then follows dotted attributes after the colon (so 'pkg.mod:Outer.Inner' works). A spec without a module or attribute raises ValueError. Import failures and missing attributes are both raised as ImportError with a message naming the plugin spec. It does no type checking itself; callers check that the result subclasses Embedder or VectorStore.","key_symbols":["load_object(spec): import 'module:attr' and return the attribute"],"connects_to":["src/codemem/embedder.py","src/codemem/store.py"],"component":"config"},"src/codemem/prompts.py":{"bytes":6033,"lines":130,"auto_summary":"ALL agent-facing text lives here so it can be edited and varied for the agent study.","symbols":[{"kind":"def","name":"tool_description","line":98,"doc":""},{"kind":"def","name":"server_instructions","line":106,"doc":""},{"kind":"def","name":"agent_notes","line":110,"doc":"Snippet for AGENTS.md / CLAUDE.md, or None when steering is off."},{"kind":"def","name":"models_loading_notice","line":118,"doc":""},{"kind":"def","name":"indexing_notice","line":125,"doc":""}],"summary":"All agent-facing wording in one place: tool descriptions, MCP server instructions, the optional CLAUDE.md/AGENTS.md note and the loading notices, each at three steering levels (none, light, strong).","details":"The steering level comes from config (default 'light', or CODEMEM_STEERING) and controls how hard agents are pushed toward codemem over grep, which the agent study varies. search_code's description goes from a neutral 'Search this repository's code...' (none), to 'Find the code for a task described in plain words... Prefer this over grep for exploring' (light), to 'Use search_code FIRST... Always try this before grep/find... Then call get_chunk' (strong); all levels list the path_prefix, kinds and tests filters. get_chunk's text gains the accepted ref formats at light and the 'follow the call graph instead of opening whole files' advice at strong. index_status and refresh_index have the same text at every level; refresh_index tells the agent the index follows its edits and to call it after git checkout, pull or rebase. The server instructions are one line at none, a bullet list of the four tools at light, and an imperative 'Start every code-location task with search_code' paragraph at strong. agent_notes() returns None for 'none', else a short '## Code search' section wrapped in '<!-- codemem -->' markers so init can append it only once. There are no MCP prompt objects registered; 'prompts' here means text constants.","key_symbols":["SERVER_NAME = 'codemem': the MCP server name and config key","tool_description(tool, steering='light'): description for search_code, get_chunk, index_status, refresh_index","server_instructions(steering='light'): the MCP 'instructions' field","agent_notes(steering='light'): marker-wrapped note for CLAUDE.md/AGENTS.md, None when steering is 'none'","AGENT_NOTES_MARKER = '<!-- codemem -->': makes note appending idempotent","indexing_notice(percent): notice while the first build runs","models_loading_notice(): notice when results are keywords only"],"connects_to":["src/codemem/server.py","src/codemem/agents.py","src/codemem/config.py","tests/test_frontends.py"],"component":"mcp"},"src/codemem/render.py":{"bytes":7178,"lines":149,"auto_summary":"Compact plain-text rendering shared by the MCP tools and the CLI.","symbols":[{"kind":"def","name":"card_label","line":14,"doc":""},{"kind":"def","name":"format_results","line":22,"doc":""},{"kind":"def","name":"freshness_note","line":45,"doc":"One line for the agent when a search could not include everything yet; \"\" when it could."},{"kind":"def","name":"format_refresh","line":65,"doc":"The result of a full check (`CodememService.refresh`), for the agent."},{"kind":"def","name":"format_chunk","line":77,"doc":""},{"kind":"def","name":"format_status","line":87,"doc":""},{"kind":"def","name":"_size","line":123,"doc":""},{"kind":"def","name":"_files","line":127,"doc":""},{"kind":"def","name":"format_coverage","line":131,"doc":"What the index leaves out, and why, so nothing is missed silently."}],"summary":"Plain-text rendering shared by the MCP tools and the CLI: result cards, the freshness note, chunk views, refresh results and the status report.","details":"format_results() prints each result as 'N. path:start-end  label  [id X]', adding 'best a-b' when a long function's best-matching window is shown and, in debug mode, every signal's rank plus the fused rrf score. It then prints the signature (not for blocks), the first docstring line, and up to 6 preview lines prefixed with '   | '; for non-block cards without a best window the first preview line is dropped because it repeats the signature. The docstring calls this output 'what an agent reads', and the eval adapter imports format_results to count exactly those tokens. card_label() shows blocks as '<subkind> name' or '<imports>', and non-plain classes as 'qualname (subkind)'. freshness_note() returns an empty string when a search was complete, else one 'Note: ...' line combining up to three parts (files saved moments ago still being indexed; N code chunks in some files still being embedded; saves not confirmed) and ending with 'Search again in a few seconds, or use grep for those files.' format_status() and format_coverage() list state, counts by kind and language, vectors and models, remote embedding host (with a warning that code is sent there), indexed commit, age, staleness, pending work, whether the watcher works, skipped files by reason with up to 5 examples, non-code files by extension, and ignored folders.","key_symbols":["format_results(resp, debug=False, preview=True): the numbered result cards","card_label(card): display name for blocks, special classes and functions","freshness_note(fresh, pending): the closing 'Note:' line, or ''","format_chunk(d): get_chunk output: location, code, members, callers, callees","format_refresh(out): one-paragraph summary of a refresh_index run","format_status(info): multi-line status report","format_coverage(info): what is not indexed and why"],"connects_to":["src/codemem/search.py","src/codemem/server.py","src/codemem/cli.py","src/codemem/service.py","eval/src/cmeval/adapters/codemem.py","tests/test_frontends.py"],"component":"search"},"src/codemem/schema.py":{"bytes":2292,"lines":51,"auto_summary":"Chunk dataclass and ID helpers.","symbols":[{"kind":"def","name":"text_hash","line":17,"doc":""},{"kind":"def","name":"make_key","line":21,"doc":""},{"kind":"class","name":"Chunk","line":26,"doc":"","methods":["location"]}],"summary":"Defines the Chunk dataclass, the unit codemem stores and retrieves, plus the key and hash helpers used to identify chunks and texts.","details":"A Chunk holds its key, repo-relative path, qualname, name, kind (function, method, class or block), 1-based inclusive line range, signature, docstring, exact code, and a content_hash of that code. Optional fields cover the enclosing class, the unresolved callee names and the line of each first call, language, subkind (struct, interface, macro, constructor, arrow, imports, ...), parent_key, is_test, a skeleton for classes, and lead_comment for Python. chunk_id is empty until the store assigns one. text_hash() is the first 20 hex characters of a SHA-256 of the UTF-8 text and is used for both chunk content and embedded texts. CALLABLE_KINDS lists the kinds a call may resolve to (function, method, class), so blocks are never call targets.","key_symbols":["Chunk: dataclass for one function, method, class or block","Chunk.location: 'path:start-end' string","make_key(path, qualname): 'path::qualname'","text_hash(text): first 20 hex chars of SHA-256","KINDS: ('function', 'method', 'class', 'block')","CALLABLE_KINDS: kinds a call can resolve to","BLOCK_QUALNAME: '<block>'"],"connects_to":["src/codemem/chunker.py","src/codemem/store.py","src/codemem/indexer.py","src/codemem/texts.py","src/codemem/config.py"],"component":"chunking"},"src/codemem/search.py":{"bytes":13344,"lines":305,"auto_summary":"Hybrid retrieval: BM25 (FTS5) + one vector search per enabled vector set, merged with RRF.","symbols":[{"kind":"class","name":"ResultCard","line":27,"doc":"","methods":["location","to_dict"]},{"kind":"class","name":"SearchResponse","line":59,"doc":"","methods":["to_dict"]},{"kind":"def","name":"rrf","line":76,"doc":"Reciprocal rank fusion: score(d) = sum_s w_s / (k + rank_s(d)), ranks 1-based."},{"kind":"def","name":"_pick_top","line":91,"doc":"The k best results, with exact ties ordered by location (path, start line, key)."},{"kind":"def","name":"_focus","line":110,"doc":"Start of the `size`-line stretch around the line sharing the most query tokens."},{"kind":"def","name":"_preview","line":120,"doc":""},{"kind":"def","name":"make_card","line":139,"doc":""},{"kind":"def","name":"available_signals","line":164,"doc":""},{"kind":"def","name":"_reweigh","line":169,"doc":"Multiply fused scores by the test weight (test chunks) and the weight of each chunk's kind,"},{"kind":"def","name":"bm25_match","line":194,"doc":"The query's words for BM25 (docs/architecture.md §6). Stopwords are dropped (a query of stopwords"},{"kind":"def","name":"search","line":215,"doc":"`tests`: \"include\" (default), \"exclude\" or \"only\" test code."}],"summary":"The hybrid retrieval function: a BM25 keyword list from SQLite FTS5 plus one vector list per enabled vector type (code, usage), merged with reciprocal rank fusion and returned as structured ResultCards.","details":"search() is a pure library function; MCP and the CLI only format its output. It decides the signals (bm25 plus each enabled vector type that actually has stored vectors; an explicitly requested unknown signal raises ValueError, a known one with no vectors is silently dropped), builds a ChunkFilter from path_prefix, kinds, languages and the tests mode, and takes max(candidates, k) hits per signal (candidates defaults to 50). bm25_match() tokenizes the query, drops stopwords (unless that leaves nothing), optionally drops very common words for long queries (bm25_common_share, off by default), and ORs the distinct words into an FTS5 MATCH expression. The query is embedded once per distinct (model, embedder, version) and searched against each vector type; vector search is skipped entirely when a filter matches no chunks. rrf() scores each chunk as the sum over signals of weight/(k + rank) with k = 60 and weights 1.0 by default, ties broken by id; _reweigh() then multiplies by test_weight and kind_weights when they differ from 1. _pick_top() fetches k+10 candidates (extended to include a whole group tied with the last one, and tolerating rows deleted by a concurrent writer) and orders exact ties by path, start line and key so results do not depend on index history. Each card carries a preview: a class shows its skeleton, and a long function whose best code-vector window is not the first one shows that window (best_lines), focused on the lines sharing the most query tokens.","key_symbols":["search(store, query, config, k=10, signals=None, path_prefix=None, debug=False, kinds=None, languages=None, test_weight=None, kind_weights=None, tests='include'): the pipeline","rrf(ranked, k=60, weights=None): reciprocal rank fusion, sorted by (-score, id)","bm25_match(store, query, config): query words for FTS5 (stopwords dropped, optional common-word pruning)","_pick_top(fused, k, get_chunks): top k with ties ordered by location","_reweigh(store, fused, test_weight, kind_weights): score multipliers for tests and kinds","ResultCard: one result (location, qualname, kind, signature, doc line, preview, score, ranks, best_lines, ...)","SearchResponse: query, signals used, results, timings, plus freshness and models_loading set by the service","make_card(chunk, score, config, ...): builds a card, including the preview","_preview / _focus: preview text from the code, skeleton or best window, capped by preview_lines (12) and preview_chars (800)","TEST_FILTERS = ('include', 'exclude', 'only')","available_signals(store, config): bm25 plus enabled vector types with stored vectors"],"connects_to":["src/codemem/store.py","src/codemem/config.py","src/codemem/embedder.py","src/codemem/tokenize.py","src/codemem/schema.py","src/codemem/service.py","src/codemem/render.py","src/codemem/server.py","eval/src/cmeval/adapters/codemem.py","scripts/smoke_real_model.py","tests/test_search.py"],"component":"search"},"src/codemem/server.py":{"bytes":3736,"lines":88,"auto_summary":"MCP server (stdio). Thin layer over CodememService.","symbols":[{"kind":"def","name":"build_server","line":24,"doc":""},{"kind":"def","name":"run_stdio","line":79,"doc":""}],"summary":"The MCP server that coding agents launch over stdio. It is a thin layer that exposes four tools and turns CodememService results into text with render.py.","details":"build_server() creates an MCPServer (MCP SDK v2, from mcp.server.mcpserver) named 'codemem' with the package version and server instructions from prompts.py at the configured steering level, then registers four tools whose descriptions also come from prompts.py. search_code clamps k to 1..50, rejects unknown kinds (allowed: function, method, class, block) and unknown tests values (include, exclude, only) with an error string rather than an exception, adds an 'index still being built (N%)' notice while state is 'indexing', and returns 'The codemem index is not available yet' when there is no index and state is empty or error. It calls service.search(..., wait_for_models=False), so a search during model loading falls back to keywords only, and it appends the freshness note (with up to 3 example files from store.pending_paths()) and a 'model still loading' note when relevant. index_status returns the rendered status plus a one-line JSON object with state, progress, chunks, vectors and stale. run_stdio() sends all logging to stderr at INFO (stdout is reserved for protocol messages), creates the service, calls service.start() so the catch-up/first build, watcher and model prewarm run in background threads without blocking the handshake, then runs the server on stdio and closes the service on exit.","key_symbols":["build_server(service): creates the MCPServer and registers the four tools","search_code(query, k=10, path_prefix=None, kinds=None, tests='include'): validated search with freshness notes","get_chunk(ref): full chunk via service.get_chunk, or a hint about accepted ref formats","refresh_index(): service.refresh(timeout=60), rendered by format_refresh","index_status(): service.status(check_staleness=True) as text plus a JSON summary line","run_stdio(repo, index_dir): logging to stderr, service.start(), server.run('stdio'), service.close()"],"connects_to":["src/codemem/service.py","src/codemem/prompts.py","src/codemem/render.py","src/codemem/search.py","src/codemem/schema.py","src/codemem/cli.py","tests/test_frontends.py"],"component":"mcp"},"src/codemem/service.py":{"bytes":28878,"lines":587,"auto_summary":"Long-lived owner of one repo's index: updates, freshness, the watcher, queries.","symbols":[{"kind":"def","name":"_model_of","line":51,"doc":"The model in an embedder key: `jina…|doc|L1024|…` or `api:<host>|<model>|dims=…`."},{"kind":"class","name":"Freshness","line":60,"doc":"What a search could not include yet.","methods":["complete"]},{"kind":"class","name":"CodememService","line":73,"doc":"","methods":["__init__","indexer","has_index","_on_progress","update","start","start_background_update","notify","request_reconcile","request_update","_take_changes","_settle","_hand_over","_should_yield","_requeue","_wait_for_git","_apply_changes","_ensure_worker","_run","_step","_reload_config","refresh","catch_up","prewarm","start_watcher","close","search","_models_ready","resolve_ref","get_chunk","status"]}],"summary":"CodememService, the long-lived owner of one repo's index. It runs updates, the background writer thread, the file watcher, the pre-search catch-up and all queries, and every front-end (MCP, CLI, eval) goes through it.","details":"Construction only resolves the repo root, picks the index folder (~/.codemem/indexes/<repo>-<hash>), loads config and opens the Store; no threads start, because the eval adapter re-pins repo_root after construction. update() is the blocking path for the CLI and eval: a full reconcile, every queued vector and the FAISS files written, with errors kept in last_error and None returned. start() is the background path for the MCP server and `codemem watch`: it requests a reconcile, starts one 'codemem-writer' thread (_run/_step), starts the RepoWatcher, and loads the models in a 'codemem-prewarm' thread. The writer is the only thread that applies edits: stage A (Indexer.structure for the changed paths, or a full scan on reconcile) under _apply_lock, then stage B (Indexer.embed_pending) in batches of 64 chunks and model calls of at most 3,000 characters, in slices of up to 5 s, yielding when a search is waiting, new saves arrive or close() is called. Hand-overs of edits are numbered (_received, _applied, _settled) so catch_up() can wait for exactly the edits made before the search, within catchup_budget_ms (4 s), then embed the queue itself, newest first; it skips waiting on a first build or when more than 1,000 chunks are queued and returns a Freshness record describing what is missing. Other constants: FAISS files saved after 30 s idle, a safety reconcile every 300 s (every 10 s when file events don't work), more than 2,000 changed paths become a full reconcile, updates wait up to 10 s while git holds index.lock, and an edited .codemem.toml is reloaded on reconcile (switching vector backend if needed). get_chunk() resolves a chunk id, path::qualname or path:line, waits for stage A only, and shows classes of 80+ lines as their skeleton plus members; status() gathers counts, models, coverage, pending work and, unless indexing, a fresh scan for staleness.","key_symbols":["CodememService: owns Store, Indexer, writer thread, watcher and prewarm thread for one repo","Freshness: dataclass (pending_chunks, indexing, pending_files, unconfirmed) with .complete","update(full=False): blocking full reconcile + all embedding + FAISS save (CLI, eval)","start(watch=True, prewarm=True): reconcile request, writer thread, watcher, model prewarm (MCP, watch)","_step(): one unit of writer work: stage A for pending edits, else a stage B slice, else idle save or periodic reconcile","catch_up(budget=None, embed=True): barrier, hand-over, wait for stage A, then embed newest pending chunks within the budget","search(query, wait_for_models=True, **kwargs): catch_up, then search.search; keyword-only if models are still loading and wait_for_models is False","refresh(timeout=60): synchronous full reconcile, embed until timeout, save FAISS, return change counts","get_chunk(ref) / resolve_ref(ref): chunk by id, path::qualname or path:line, with members, callers, callees","status(check_staleness=True): the dict behind index_status and `codemem status`","notify(paths, reconcile): the watcher's callback; queues paths and wakes the writer","Constants: CATCHUP_MAX_CHUNKS=1000, SAVE_AFTER_IDLE=30, RECONCILE_EVERY=300, POLL_EVERY=10, BURST_PATHS=2000, _BATCH=64, _CALL_CHARS=3000, _LONG_CLASS_LINES=80"],"connects_to":["src/codemem/indexer.py","src/codemem/store.py","src/codemem/search.py","src/codemem/watcher.py","src/codemem/config.py","src/codemem/embedder.py","src/codemem/server.py","src/codemem/cli.py","eval/src/cmeval/adapters/codemem.py","tests/test_frontends.py","tests/test_freshness_stress.py"],"component":"service"},"src/codemem/store.py":{"bytes":68776,"lines":1444,"auto_summary":"Storage: SQLite (chunks, FTS5, call graph, vectors) + one in-memory search index per vector type.","symbols":[{"kind":"def","name":"_atomic_write","line":117,"doc":""},{"kind":"def","name":"bm25_weights5","line":124,"doc":"name, path, signature, doc, body. A 3-value list from older configs (name, signature, body) is mapped to it."},{"kind":"class","name":"VectorStore","line":137,"doc":"The in-memory search index of one vector type, keyed by vector id: FAISS by default, or a","methods":["upsert","remove","search","ids","__len__","to_bytes","from_bytes"]},{"kind":"class","name":"FaissVectorStore","line":180,"doc":"Exact inner-product search; IndexIDMap2 so the vector id is the FAISS id.","methods":["__init__","upsert","remove","search","ids","__len__","to_bytes","from_bytes"]},{"kind":"def","name":"vector_backend_class","line":233,"doc":"`faiss` or \"module:Class\" -> the VectorStore subclass."},{"kind":"def","name":"prepare","line":243,"doc":"Float32 vectors truncated to `dim` (Matryoshka) and L2-normalized again."},{"kind":"class","name":"VectorRow","line":253,"doc":"","methods":[]},{"kind":"class","name":"VectorHit","line":263,"doc":"","methods":[]},{"kind":"class","name":"_TypeIndex","line":273,"doc":"The in-memory search index of one vector type and where each vector came from.","methods":["__init__","add","remove"]},{"kind":"def","name":"_fetch_whole_ties","line":305,"doc":"fetch(size) gives the best `size` (id, score) pairs. Fetch more until the group of equal"},{"kind":"class","name":"IndexLock","line":318,"doc":"Exclusive writer lock on <index_dir>/write.lock. Released by the OS if the process dies.","methods":["__init__","acquire","release","__enter__","__exit__"]},{"kind":"class","name":"FileRow","line":376,"doc":"","methods":[]},{"kind":"class","name":"ChunkFilter","line":386,"doc":"Restricts which chunks a search may return. Empty = everything.","methods":["active","where"]},{"kind":"def","name":"_row_to_chunk","line":421,"doc":""},{"kind":"def","name":"_like_prefix","line":432,"doc":""},{"kind":"def","name":"_family","line":437,"doc":""},{"kind":"def","name":"_batches","line":444,"doc":"SQLite caps the number of `?` in one statement; query long id lists in slices."},{"kind":"class","name":"Store","line":450,"doc":"","methods":["__init__","_schema_version","_open_schema","conn","transaction","_read_snapshot","_after_commit","close_thread_conn","close","get_meta","set_meta","get_files","upsert_file","delete_file","move_chunks","upsert_chunk","delete_chunks","chunks_for_path","get_chunks","get_chunk","get_chunk_by_key","find_chunk_at","children_of","iter_chunks","chunks_for_paths","chunk_ids","file_paths_under","ids_with_prefix","filter_ids","definitions","all_calls","replace_edges","caller_refs","definitions_named","_calls_where","calls_of","calls_to_names","edges_from","replace_edges_from","edge_count","next_dirty_seq","mark_dirty","mark_all_dirty","dirty_batch","dirty_seqs","clear_dirty","dirty_count","pending_paths","callers_of","callees_of","chunk_total","term_doc_counts","bm25_search","_data_path","_note_path","_read_note","_noted_file","use_vector_backend","vec_types","_epoch","_bump_epoch","vector_dim","ensure_vec_type","drop_vec_type","_forget","vector_rows","vector_parts","find_vectors","put_vectors","delete_vectors","_type_index","_catch_up","_add_rows","_owner_rows","_load_saved","_rebuild","vector_search","_order_ties","save_vectors","vectors_unsaved","load_vectors","vacuum_if_sparse","skipped_files","counts","snapshot"]},{"kind":"def","name":"diff_snapshots","line":1431,"doc":"Readable differences between two `Store.snapshot()`s (empty when they are equal)."}],"summary":"The storage layer: one SQLite database holds files, chunks, the FTS5 keyword index, calls, call edges, the embedding queue and all vectors, and an in-memory FAISS index per vector type is derived from the stored vectors for search.","details":"SQLite (index.db, WAL mode, one connection per thread) is the source of truth for everything, vectors included: each 'vectors' row holds one float16 vector at full dimension with its chunk, part, line offsets, text hash and embedder key. The search index for each vector type is derived from those rows: by default FaissVectorStore, an exact inner-product IndexIDMap2 over an fp16 IndexScalarQuantizer (2 bytes per number), truncated to embedding_dim and re-normalized, or any VectorStore subclass named in vector_backend. Every transaction that changes a type's vectors bumps an epoch in meta, and in-memory indexes are patched by after-commit hooks, never before the commit. Vector rows are never changed in place (AUTOINCREMENT ids are never reused), so an index that is behind, such as a saved file from before a crash or after another process wrote, catches up by comparing vector id sets, and a missing or corrupt file is rebuilt from the rows with no model. save_vectors() writes vec_<type>.faiss and then a vec_<type>.json note (epoch, dim, count, embedder, backend, file) atomically via temp files. ensure_vec_type() drops a type's vectors when its embedder key changes, while a changed dim setting only rebuilds the search index. vector_search() scores a multi-part chunk by its best part and keeps fetching until the top n chunks are certain, bm25_search() uses FTS5 bm25() with five column weights, and both order equal scores by path, start line and key so results do not depend on index history. Opening an index from an older schema version (current is 3) drops and rebuilds it under the write lock; a newer one raises an error instead of wiping it.","key_symbols":["Store: the SQLite-backed index plus in-memory search indexes","Store.transaction(): BEGIN IMMEDIATE write transaction with after-commit hooks for the vector indexes","Store.upsert_chunk: insert or update by key (stable chunk_id) and refresh its FTS row and calls","Store.put_vectors / delete_vectors: write vector rows, bump the epoch, patch the search index after commit","Store.vector_search / bm25_search: the two retrieval primitives used by search.py","Store._type_index / _load_saved / _rebuild / _catch_up: load, reconcile or rebuild a type's search index","Store.save_vectors: persist changed indexes and their notes","Store.caller_refs: callers per callee, capped per test/non-test group, for usage texts","Store dirty queue: next_dirty_seq, mark_dirty, mark_all_dirty, dirty_batch, clear_dirty","VectorStore / FaissVectorStore: pluggable in-memory vector index interface and its FAISS fp16 implementation","IndexLock: exclusive write.lock using msvcrt on Windows and fcntl elsewhere, 30 s timeout","ChunkFilter: path prefix, kinds, languages and test filters as SQL WHERE clauses","snapshot / diff_snapshots: id-free view of the index for comparing builds"],"connects_to":["src/codemem/indexer.py","src/codemem/search.py","src/codemem/service.py","src/codemem/tokenize.py","src/codemem/vectorcache.py","src/codemem/texts.py","src/codemem/schema.py","src/codemem/plugins.py","src/codemem/languages/__init__.py"],"component":"store"},"src/codemem/texts.py":{"bytes":9399,"lines":244,"auto_summary":"Text builders: the texts that get embedded, one or more per (chunk, vector type).","symbols":[{"kind":"class","name":"Ref","line":27,"doc":"","methods":[]},{"kind":"class","name":"BuildContext","line":38,"doc":"","methods":[]},{"kind":"class","name":"TextPart","line":48,"doc":"","methods":[]},{"kind":"def","name":"register","line":60,"doc":""},{"kind":"def","name":"build_texts","line":68,"doc":""},{"kind":"def","name":"_comment_prefix","line":83,"doc":""},{"kind":"def","name":"_scope_of","line":90,"doc":"Enclosing scope from the qualname: `SessionManager.expire_old.is_old` -> `SessionManager.expire_old`."},{"kind":"def","name":"_header_lines","line":98,"doc":""},{"kind":"def","name":"_doc_lines","line":109,"doc":"Comments above a definition sit outside its code span, so the code text lacks them. They"},{"kind":"def","name":"_code_body","line":120,"doc":""},{"kind":"def","name":"build_code","line":125,"doc":""},{"kind":"def","name":"_windows","line":134,"doc":"Split lines into (first, last) windows of at most `budget` characters, overlapping by up"},{"kind":"def","name":"_even_windows","line":153,"doc":"As many windows as `_windows` needs, but as even as possible: the smallest budget that still"},{"kind":"def","name":"_part_label","line":169,"doc":"`part 2/3 of def f(x):`: every window after the first says which definition it belongs to."},{"kind":"def","name":"_split_code","line":176,"doc":""},{"kind":"def","name":"build_parts","line":196,"doc":"The vectors to store for one (chunk, vector type): usually one part, several windows for"},{"kind":"def","name":"_is_test","line":214,"doc":""},{"kind":"def","name":"build_usage","line":219,"doc":""},{"kind":"def","name":"_caller_line","line":241,"doc":""}],"summary":"Builds the texts that get embedded for each chunk, one builder per vector type ('code' and 'usage'), and splits long code into overlapping windows that are stored as separate vectors.","details":"Builders are registered by name in TEXT_BUILDERS with the @register decorator, so a new vector type only needs a builder here. The 'code' text is a short header (the file path, and 'in <scope>' when the chunk is nested, written with the language's comment prefix), then the comments above the definition (docstring, or lead_comment for Python), then the code; classes use their skeleton instead of their full code. The 'usage' text exists only for non-block chunks with callers (or, if enabled, recent commits): it names the chunk and file, then 'called by X in path' lines for normal callers and 'tested by X in path' lines for test callers, sorted by path, line, qualname and kind so rebuilt and updated indexes write identical text. Tests are reserved up to half of max_items (default 20) so many normal callers cannot crowd them out, and callers from block chunks are written as 'called at top level in path'. build_parts() returns one TextPart normally; a code text longer than window_chars is split into windows of whole lines overlapping by window_overlap_lines (default 3), sized as evenly as possible, each with the header and a 'part i/n of <signature>' label. Line offsets in parts are relative to the chunk's start line, so code moving down a file does not change its texts, and every part's text is capped at twice window_cha
