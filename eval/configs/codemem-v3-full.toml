# The fresh codemem run (F5 B4, decision of 2026-10-25): one system, codemem's default. The same
# settings as cm3-full in codemem-v3.toml, pinned here so the name keeps its meaning if the defaults
# change. Needs: uv sync --extra codemem

[[system]]
name = "cm3-full"  # BM25 + code + usage; neutral weights; BM25 queries drop stopwords
adapter = "codemem"
signals = ["bm25", "code", "usage"]
config = { device = "auto", test_weight = 1.0, kind_weights = {}, bm25 = { query_terms = 32, common_share = 0.0 } }
