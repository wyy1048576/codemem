# Fresh Java tasks (phase 2, B10, the bonus language). `cmeval collect configs/fresh-java-v1.toml`
# The same rules as configs/fresh-v1.toml (Python), so the languages are comparable. The date
# range is fixed, so the collection can be repeated and gives the same candidates.

[collect]
since = "2026-07-01"  # the freshness cutoff (Opus 5.5 data ends in June 2026)
until = "2026-10-22"
min_body_chars = 100  # issue body without hidden comments, as of when the fix PR was opened
extra_bots = []  # more bot logins to drop, next to the built-in list
max_code_files = 5  # changed code files in the fix (tests and docs do not count)
max_code_lines = 200  # added plus removed lines in those code files

# Chosen over keycloak, quarkus and elasticsearch: a Maven build that fits the image limit, and
# most tests run in the JVM without services. See the B10 notes.
[[repo]]
name = "trinodb/trino"
# Test files whatever their extension (collect/test_split.py): Maven test sources and test
# resources. Keep in step with the recipe.
test_paths = ["**/src/test/**"]
