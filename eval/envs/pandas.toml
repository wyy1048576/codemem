# Recipe for pandas-dev/pandas: how to build it at a task's commit and run a task's tests.
# The fields are described in src/cmeval/generate.py.

repo = "pandas-dev/pandas"
base_image = "python:3.12-bookworm"

# Once per repo.
base_setup = [
    "apt-get update && apt-get install -y --no-install-recommends ccache && rm -rf /var/lib/apt/lists/*",
    "pip install --no-cache-dir uv",
    # ripgrep, at a fixed version: Claude Code searches through the shell and expects `rg`, as on a developer's machine.
    "a=$(uname -m); case $a in x86_64) t=x86_64-unknown-linux-musl;; aarch64) t=aarch64-unknown-linux-gnu;; esac; curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-$t.tar.gz | tar xz -C /tmp && install /tmp/ripgrep-15.2.0-$t/rg /usr/local/bin/rg && rm -rf /tmp/ripgrep-15.2.0-$t && rg --version",
]

# Dependencies. The layer is shared by tasks with the same file content and the same week.
deps_files = ["requirements-dev.txt"]
# Packages for the documentation, for lint and type checks, and for Qt are left out: no test
# needs them, and some of them do not install at an older date.
deps = [
    "grep -viE '^(sphinx|pydata-sphinx-theme|numpydoc|nbsphinx|nbconvert|nbformat|notebook|ipywidgets|ipykernel|jupyterlite|pandoc|markdown|feedparser|pygments|asv|py-rattler|mypy|pre-commit|tokenize-rt|gitpython|scipy-stubs|types-|pyqt5|pytest-qt)|sphinx' requirements-dev.txt > requirements-tests.txt",
    "uv pip install --system --exclude-newer {exclude_newer} -r requirements-tests.txt",
]

# After the source of the task's commit is in /testbed. The editable install builds the
# C and Cython code now, and builds it again by itself when a later patch changes it.
# "--no-cache" is necessary: uv keeps a built package by its path, and every task is built in
# /testbed. With the cache, a task can get the build of another task.
build = [
    "CC='ccache gcc' CXX='ccache g++' uv pip install --system --no-cache --no-deps --no-build-isolation -e . -Cbuilddir=build",
    "python -c 'import pandas; print(pandas.__version__)'",
]

# After the real fix (or an agent's change) is applied, before the tests run.
refresh = ["python -c 'import pandas'"]

test_files = ["pandas/tests/**/test_*.py"]
# pytest-qt is off: it needs display libraries that the image does not have.
# --continue-on-collection-errors: before the fix, a new test file can fail to import. The other files must still run.
test = "python -m pytest {files} -p no:cacheprovider -p no:pytest-qt -n 8 --continue-on-collection-errors --junitxml={junit}"
parser = "junit"
timeout_min = 10
