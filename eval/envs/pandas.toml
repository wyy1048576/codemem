# Recipe for pandas-dev/pandas: how to build it at a task's commit and run a task's tests.
# The fields are described in src/cmeval/generate.py.

repo = "pandas-dev/pandas"
base_image = "python:3.12-bookworm"

# Once per repo.
base_setup = [
    "apt-get update && apt-get install -y --no-install-recommends ccache && rm -rf /var/lib/apt/lists/*",
    "pip install --no-cache-dir uv",
]

# Dependencies. The layer is shared by tasks with the same file content and the same week.
deps_files = ["requirements-dev.txt"]
deps = [
    "uv pip install --system --exclude-newer {exclude_newer} -r requirements-dev.txt",
]

# After the source of the task's commit is in /testbed. The editable install builds the
# C and Cython code now, and builds it again by itself when a later patch changes it.
build = [
    "CC='ccache gcc' CXX='ccache g++' uv pip install --system --no-deps --no-build-isolation -e . -Cbuilddir=build",
    "python -c 'import pandas; print(pandas.__version__)'",
]

# After the real fix (or an agent's change) is applied, before the tests run.
refresh = ["python -c 'import pandas'"]

test_files = ["pandas/tests/**/test_*.py"]
test = "python -m pytest {files} -p no:cacheprovider -n 8 --junitxml={junit}"
parser = "junit"
timeout_min = 10
