# Recipe for microsoft/playwright. Tests run on Chromium only.
# The fields are described in src/cmeval/generate.py.

repo = "microsoft/playwright"
base_image = "node:22-bookworm"

base_setup = [
    "apt-get update && apt-get install -y --no-install-recommends xvfb xauth && rm -rf /var/lib/apt/lists/*",
    # ripgrep, at a fixed version: Claude Code searches through the shell and expects `rg`, as on a developer's machine.
    "a=$(uname -m); case $a in x86_64) t=x86_64-unknown-linux-musl;; aarch64) t=aarch64-unknown-linux-gnu;; esac; curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-$t.tar.gz | tar xz -C /tmp && install /tmp/ripgrep-15.2.0-$t/rg /usr/local/bin/rg && rm -rf /tmp/ripgrep-15.2.0-$t && rg --version",
]

# The lock file fixes every package version, and the commit fixes the browser build.
build = [
    "npm ci",
    "npm run build",
    "npx playwright install --with-deps chromium",
    "cd tests/playwright-test/stable-test-runner && npm ci",
]

# The tests run the built files, so a change to the source needs a new build.
refresh = ["npm run build"]

timeout_min = 10

# --workers=4 in each test command: without it, Playwright takes the number of workers from the
# processors of the host, not from the limit of the container. Then test time and load change
# with the machine. Do not set CI anywhere: it turns on retries, which hide a failing test.

# The browser must not be in /root/.cache: that folder is a build cache and is not in the image.
[env]
PLAYWRIGHT_BROWSERS_PATH = "/opt/browsers"

[[suite]]
test_files = ["tests/library/**/*.spec.ts", "tests/page/**/*.spec.ts"]
test = "PLAYWRIGHT_JUNIT_OUTPUT_NAME={junit} xvfb-run -a npx playwright test --config=tests/library/playwright.config.ts --project=chromium-library --project=chromium-page --reporter=junit --workers=4 {files}"

[[suite]]
test_files = ["tests/mcp/**/*.spec.ts"]
test = "PLAYWRIGHT_JUNIT_OUTPUT_NAME={junit} xvfb-run -a npx playwright test --config=tests/mcp/playwright.config.ts --project=chromium --reporter=junit --workers=4 {files}"

[[suite]]
test_files = ["tests/playwright-test/**/*.spec.ts", "tests/playwright-test/**/*.test.ts"]
test = "PLAYWRIGHT_JUNIT_OUTPUT_NAME={junit} node tests/playwright-test/stable-test-runner/node_modules/@playwright/test/cli test --config=tests/playwright-test/playwright.config.ts --project=playwright-test --reporter=junit --workers=4 {files}"
