[project]
name = "cmeval"
version = "0.1.0"
description = "Evaluation suite for repository-level code retrieval (grep, codemem, and other systems)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unidiff>=1.0",
    # Same ranges as codemem, so both packages can share one environment.
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "pyarrow>=15",
    "anthropic>=2,<3",  # token counting (count_tokens)
]

[project.optional-dependencies]
# The codemem adapter. Install with: uv sync --extra codemem
codemem = ["codemem"]

[project.scripts]
cmeval = "cmeval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
codemem = { path = "..", editable = true }
