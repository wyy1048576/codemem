[project]
name = "cmeval"
version = "0.1.0"
description = "Evaluation suite for repository-level code retrieval (grep, codemem, and other systems)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "unidiff>=1.0",
]

[project.scripts]
cmeval = "cmeval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cmeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
